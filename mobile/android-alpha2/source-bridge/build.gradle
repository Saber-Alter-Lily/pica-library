plugins { id 'com.android.library' }

// Android AIDL is the established platform Binder mechanism; no site SDK,
// network permission, manga protocol or separate Reader implementation.
android {
    namespace 'com.picalibrary.android.remote'
    compileSdk 35
    defaultConfig { minSdk 28 }
    buildFeatures { aidl true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
