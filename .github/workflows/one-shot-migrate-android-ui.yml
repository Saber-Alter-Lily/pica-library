name: One-shot migrate Android direct UI literals

on:
  push:
    branches:
      - dev/localization-onboarding-v1
    paths:
      - .github/workflows/one-shot-migrate-android-ui.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/localization-onboarding-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Migrate direct UI literals
        run: node scripts/migrate-android-direct-ui.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/android-alpha2/app/src/main/java
          git diff --cached --quiet && exit 0
          git commit -m "dev(android-i18n): route direct UI literals through localization"
          git push origin HEAD:dev/localization-onboarding-v1
