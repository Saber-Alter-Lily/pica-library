name: Stage Visual V1 QC round 2

on:
  push:
    branches: [tmp-visual-qc-r2-stage]
    paths:
      - scripts/stage-visual-v1-qc-r2.py

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-visual-qc-r2-stage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - name: Apply Visual V1 QC round 2 patch
        run: python3 scripts/stage-visual-v1-qc-r2.py
      - name: Validate
        run: |
          pnpm install --frozen-lockfile
          pnpm type:check
          pnpm web:check
          pnpm test:unit
      - name: Commit validated fixes
        run: |
          rm -f scripts/stage-visual-v1-qc-r2.py .github/workflows/stage-visual-v1-qc-r2.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/RECOMMENDATION_V4_VISUAL_BETA.md')
          if p.exists(): p.write_text(p.read_text(encoding='utf-8').rstrip()+'\n', encoding='utf-8')
          PY
          git config user.name 'Saber-Alter-Lily'
          git config user.email '3178088154@qq.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: harden Visual V1 QC persistence and diagnostics'
          git push origin HEAD:tmp-visual-qc-r2-stage
