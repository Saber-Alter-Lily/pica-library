name: Repair exact E-H provider source

on:
  push:
    branches: [feature/eh-provider-v1]
    paths:
      - '.github/workflows/repair-eh-provider-full-source.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eh-provider-v1
          fetch-depth: 0
      - name: Restore complete provider and apply only quote-regex fix
        shell: bash
        run: |
          set -euo pipefail
          git show 98b344c0e95590ed402f420d91244a771bf861a1:src/providers/eh-provider.ts > src/providers/eh-provider.ts
          python - <<'PY'
          from pathlib import Path
          path=Path('src/providers/eh-provider.ts')
          text=path.read_text(encoding='utf-8')
          old1="/[\\\"']/u"
          new1="/[\"']/u"
          old2="/\\\"/g"
          new2="/\"/g"
          if text.count(old1) != 1:
              raise SystemExit(f'unexpected quote-regex count: {text.count(old1)}')
          if text.count(old2) != 1:
              raise SystemExit(f'unexpected quote-strip count: {text.count(old2)}')
          text=text.replace(old1,new1).replace(old2,new2)
          path.write_text(text,encoding='utf-8')
          PY
          grep -F "if (colon <= 0 || /[\"']/u.test(value)) return value" src/providers/eh-provider.ts
          grep -F "async probeExHentai()" src/providers/eh-provider.ts
          grep -F "async detailsOnSurface(" src/providers/eh-provider.ts
          grep -F "async episodesOnSurface(" src/providers/eh-provider.ts
          grep -F "async pagesOnSurface(" src/providers/eh-provider.ts
          grep -F "async fetchCover(" src/providers/eh-provider.ts
      - name: Remove one-off repair workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-eh-provider-full-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/providers/eh-provider.ts
          git diff --cached --check
          git commit -m 'fix(eh): restore complete provider after regex repair'
          git push origin HEAD:feature/eh-provider-v1
