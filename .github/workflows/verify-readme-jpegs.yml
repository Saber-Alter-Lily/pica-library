name: Verify README poster assets

on:
  push:
    paths:
      - 'README.md'
      - 'README.en.md'
      - 'docs/*guide*.md'
      - 'docs/assets/desktop-overview-final.png'
      - 'docs/assets/android-overview-final.png'
      - '.github/workflows/verify-readme-jpegs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'README.en.md'
      - 'docs/*guide*.md'
      - 'docs/assets/desktop-overview-final.png'
      - 'docs/assets/android-overview-final.png'
      - '.github/workflows/verify-readme-jpegs.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Decode final README PNG posters and verify references
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          expected = {
              Path('docs/assets/desktop-overview-final.png'): (1055, 1491),
              Path('docs/assets/android-overview-final.png'): (1214, 1295),
          }
          for path, size in expected.items():
              data = path.read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), (path, data[:12].hex())
              with Image.open(path) as im:
                  im.load()
                  print(path, im.format, im.size, hashlib.sha256(data).hexdigest())
                  assert im.format == 'PNG', (path, im.format)
                  assert im.size == size, (path, im.size, size)

          docs = [
              Path('README.md'), Path('README.en.md'),
              Path('docs/desktop-guide.zh-CN.md'), Path('docs/android-guide.zh-CN.md'),
              Path('docs/desktop-guide.en.md'), Path('docs/android-guide.en.md'),
          ]
          for path in docs:
              text = path.read_text(encoding='utf-8')
              if path.name.startswith('README') or 'desktop-guide' in path.name:
                  assert 'desktop-overview-final.png' in text, path
              if path.name.startswith('README') or 'android-guide' in path.name:
                  assert 'android-overview-final.png' in text, path
          print('README_POSTER_DECODE=PASS')
          PY
