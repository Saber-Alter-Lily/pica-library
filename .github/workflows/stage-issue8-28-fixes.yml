name: Stage issue 8 and 28 fixes

on:
  push:
    branches:
      - feature/recommendation-v4-visual-feedback
    paths:
      - .github/workflows/stage-issue8-28-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recommendation-v4-visual-feedback
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Apply staged fixes
        run: |
          python3 scripts/stage-issue8-28.py
          python3 scripts/stage-issue8-28-followup.py
      - name: Validate staged fixes
        run: |
          pnpm install --frozen-lockfile
          pnpm type:check
          pnpm web:check
          pnpm exec vitest run test/unit/download-large-queue.test.ts test/unit/issue8-28-contract.test.ts test/unit/download-scheduler.test.ts test/integration/migrations.test.ts test/unit/i18n.test.ts test/unit/recommendation-v4-integration.test.ts test/unit/v040-web-multi-provider-parity.test.ts
      - name: Commit staged fixes and remove one-shot helpers
        run: |
          rm .github/workflows/stage-issue8-28-fixes.yml
          rm scripts/stage-issue8-28.py
          rm scripts/stage-issue8-28-followup.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: scale download queue and refresh author works online'
          git push origin HEAD:feature/recommendation-v4-visual-feedback
