name: Validate and apply E-H Desktop account UI

on:
  push:
    branches:
      - feature/eh-provider-v1
    paths:
      - 'scripts/dev/apply-eh-desktop-account-ui.mjs'
      - '.github/workflows/eh-dev-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eh-provider-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply Desktop E-H account UI patch
        run: node scripts/dev/apply-eh-desktop-account-ui.mjs
      - name: Validate Desktop account UI and regressions
        run: |
          set -euo pipefail
          pnpm type:check
          pnpm web:check
          pnpm test
          pnpm build
      - name: Commit validated Desktop account UI
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/desktop/types.ts src/desktop/main.ts web/index.html web/eh-account.js test/unit/eh-desktop-account-ui.test.ts
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat: add encrypted E-H account controls on Desktop'
          git push origin HEAD:feature/eh-provider-v1
