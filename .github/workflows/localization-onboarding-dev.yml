name: Localization Onboarding Dev Audit

on:
  push:
    branches:
      - dev/localization-onboarding-v1

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build localization inventory
        run: node scripts/localization-inventory.mjs
      - uses: actions/upload-artifact@v4
        if: github.event.repository.private == false
        with:
          name: localization-inventory
          path: _reports/localization-inventory.json
          retention-days: 1

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Validate Web localization branch
        run: |
          set -euo pipefail
          pnpm type:check
          pnpm web:check
          pnpm test
          pnpm build
