name: Validate and apply E-H favorite migration fix

on:
  push:
    branches:
      - feature/eh-provider-v1
    paths:
      - 'scripts/dev/fix-eh-favorite-migration.mjs'
      - '.github/workflows/eh-dev-apply.yml'

permissions:
  contents: write

concurrency:
  group: eh-dev-favorite-migration
  cancel-in-progress: true

jobs:
  apply:
    if: github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eh-provider-v1
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply idempotent legacy E-H favorite migration fix
        run: node scripts/dev/fix-eh-favorite-migration.mjs
      - name: Validate Android migration and release build
        working-directory: mobile/android-alpha2
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
      - name: Commit validated migration fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            mobile/android-alpha2/app/src/main/java/com/picalibrary/android/EhFavoriteStore.java \
            mobile/android-alpha2/app/src/main/java/com/picalibrary/android/UnifiedCatalogStore.java \
            mobile/android-alpha2/app/src/main/java/com/picalibrary/android/PicaBootstrapWorker.java \
            mobile/android-alpha2/app/src/test/java/com/picalibrary/android/EhFavoriteMigrationTest.java
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix: migrate legacy E-H favorites without resurrection'
          git push origin HEAD:feature/eh-provider-v1
