name: Finalize directly uploaded README PNGs

on:
  push:
    branches: [fix/readme-use-uploaded-pngs]
    paths:
      - '.github/workflows/finalize-readme-pngs.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readme-use-uploaded-pngs
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Validate uploaded PNG binaries and update docs
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          posters = [
              Path('docs/assets/desktop-overview-final.png'),
              Path('docs/assets/android-overview-final.png'),
          ]
          for path in posters:
              data = path.read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), (path, data[:12].hex())
              with Image.open(path) as im:
                  im.load()
                  assert im.format == 'PNG', (path, im.format)
                  assert im.width >= 700 and im.height >= 700, (path, im.size)
                  print(path, 'format=', im.format, 'size=', im.size, 'sha256=', hashlib.sha256(data).hexdigest())

          docs = [
              Path('README.md'), Path('README.en.md'),
              Path('docs/desktop-guide.zh-CN.md'), Path('docs/android-guide.zh-CN.md'),
              Path('docs/desktop-guide.en.md'), Path('docs/android-guide.en.md'),
          ]
          replacements = {
              'docs/assets/desktop-overview-v0311-final.jpg': 'docs/assets/desktop-overview-final.png',
              'docs/assets/android-overview-v38-final.jpg': 'docs/assets/android-overview-final.png',
              'docs/assets/ChatGPT Image 2026年9月11日 13_36_37.png': 'docs/assets/desktop-overview-final.png',
              'docs/assets/ChatGPT Image 2026年9月11日 13_37_48.png': 'docs/assets/android-overview-final.png',
              'assets/desktop-overview-v0311-final.jpg': 'assets/desktop-overview-final.png',
              'assets/android-overview-v38-final.jpg': 'assets/android-overview-final.png',
              'assets/ChatGPT Image 2026年9月11日 13_36_37.png': 'assets/desktop-overview-final.png',
              'assets/ChatGPT Image 2026年9月11日 13_37_48.png': 'assets/android-overview-final.png',
          }
          for path in docs:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          for path in docs:
              text = path.read_text(encoding='utf-8')
              assert 'overview-v0311-final.jpg' not in text, path
              assert 'overview-v38-final.jpg' not in text, path
              assert 'ChatGPT Image 2026年9月11日' not in text, path
              if path.name.startswith('README') or 'desktop-guide' in path.name:
                  assert 'desktop-overview-final.png' in text, path
              if path.name.startswith('README') or 'android-guide' in path.name:
                  assert 'android-overview-final.png' in text, path
          print('DIRECT_UPLOADED_PNGS=PASS')
          PY
      - name: Replace obsolete poster verifier
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-readme-jpegs.yml
          cat > .github/workflows/verify-readme-posters.yml <<'YAML'
          name: Verify README poster assets

          on:
            push:
              paths:
                - 'README.md'
                - 'README.en.md'
                - 'docs/*guide*.md'
                - 'docs/assets/desktop-overview-final.png'
                - 'docs/assets/android-overview-final.png'
                - '.github/workflows/verify-readme-posters.yml'
            pull_request:
              paths:
                - 'README.md'
                - 'README.en.md'
                - 'docs/*guide*.md'
                - 'docs/assets/desktop-overview-final.png'
                - 'docs/assets/android-overview-final.png'
                - '.github/workflows/verify-readme-posters.yml'

          permissions:
            contents: read

          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: '3.12'
                - run: python -m pip install --disable-pip-version-check pillow
                - name: Decode README PNG posters and verify references
                  run: |
                    python - <<'PY'
                    from pathlib import Path
                    from PIL import Image
                    import hashlib

                    for path in [Path('docs/assets/desktop-overview-final.png'), Path('docs/assets/android-overview-final.png')]:
                        data = path.read_bytes()
                        assert data.startswith(b'\x89PNG\r\n\x1a\n'), (path, data[:12].hex())
                        with Image.open(path) as im:
                            im.load()
                            assert im.format == 'PNG', (path, im.format)
                            assert im.width >= 700 and im.height >= 700, (path, im.size)
                            print(path, im.size, hashlib.sha256(data).hexdigest())

                    docs = [
                        Path('README.md'), Path('README.en.md'),
                        Path('docs/desktop-guide.zh-CN.md'), Path('docs/android-guide.zh-CN.md'),
                        Path('docs/desktop-guide.en.md'), Path('docs/android-guide.en.md'),
                    ]
                    for path in docs:
                        text = path.read_text(encoding='utf-8')
                        if path.name.startswith('README') or 'desktop-guide' in path.name:
                            assert 'desktop-overview-final.png' in text, path
                        if path.name.startswith('README') or 'android-guide' in path.name:
                            assert 'android-overview-final.png' in text, path
                    print('README_POSTERS=PASS')
                    PY
          YAML
          rm -f .github/workflows/finalize-readme-pngs.yml
      - name: Commit final README poster cleanup
        run: |
          set -euo pipefail
          git config user.name 'Saber-Alter-Lily'
          git config user.email '3178088154@qq.com'
          git add -A README.md README.en.md docs .github/workflows
          git diff --cached --check
          git commit -m 'docs: use directly uploaded PNG posters'
          git push origin HEAD:fix/readme-use-uploaded-pngs
