name: Experimental Docker Headless Package

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'packaging/docker/**'
      - 'scripts/build-docker-experimental.sh'
      - 'scripts/test-docker-experimental.sh'
      - 'scripts/test-docker-remote-tls.sh'
      - 'scripts/test-docker-image-replacement.sh'
      - 'scripts/test-server-compose-preview.sh'
      - 'scripts/build-linux-experimental.sh'
      - 'rollup.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docker-experimental.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'web/**'
      - 'packaging/docker/**'
      - 'scripts/build-docker-experimental.sh'
      - 'scripts/test-docker-experimental.sh'
      - 'scripts/test-docker-remote-tls.sh'
      - 'scripts/test-docker-image-replacement.sh'
      - 'scripts/test-server-compose-preview.sh'
      - 'scripts/build-linux-experimental.sh'
      - 'rollup.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/docker-experimental.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-amd64-experimental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false

      - run: pnpm install --frozen-lockfile

      - name: Verify Docker engine
        run: docker version

      - name: Build experimental Docker amd64 image
        run: bash scripts/build-docker-experimental.sh

      - name: Build first W4B Remote API baseline image
        env:
          BASE_SHA: 76305939ee7561694a885f7a069189583955a7ec
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/pica-docker-remote-baseline"
          rm -rf "$baseline"
          git worktree add --detach "$baseline" "$BASE_SHA"
          cleanup() {
            git worktree remove --force "$baseline" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir -p "$baseline/artifacts/cache"
          if [ -d artifacts/cache ]; then
            cp -a artifacts/cache/. "$baseline/artifacts/cache/"
          fi
          (
            cd "$baseline"
            pnpm install --frozen-lockfile
            bash scripts/build-docker-experimental.sh
          )
          baseline_image="$(tr -d '\r\n' < "$baseline/artifacts/DOCKER-EXPERIMENTAL-IMAGE.txt")"
          test -n "$baseline_image"
          printf '%s\n' "$baseline_image" > artifacts/DOCKER-REMOTE-BASELINE-IMAGE.txt
          cleanup
          trap - EXIT

      - name: Smoke experimental headless container
        run: |
          set -euo pipefail
          image="$(tr -d '\r\n' < artifacts/DOCKER-EXPERIMENTAL-IMAGE.txt)"
          test -n "$image"
          bash scripts/test-docker-experimental.sh "$image"

      - name: Test authenticated Remote API behind Caddy TLS
        run: |
          set -euo pipefail
          image="$(tr -d '\r\n' < artifacts/DOCKER-EXPERIMENTAL-IMAGE.txt)"
          test -n "$image"
          bash scripts/test-docker-remote-tls.sh "$image"

      - name: Test Docker image replacement and rollback
        run: |
          set -euo pipefail
          baseline="$(tr -d '\r\n' < artifacts/DOCKER-REMOTE-BASELINE-IMAGE.txt)"
          candidate="$(tr -d '\r\n' < artifacts/DOCKER-EXPERIMENTAL-IMAGE.txt)"
          test -n "$baseline"
          test -n "$candidate"
          bash scripts/test-docker-image-replacement.sh "$baseline" "$candidate"

      - name: Test operator Server Compose preview
        run: |
          set -euo pipefail
          image="$(tr -d '\r\n' < artifacts/DOCKER-EXPERIMENTAL-IMAGE.txt)"
          test -n "$image"
          bash scripts/test-server-compose-preview.sh "$image"

      - name: Upload experimental Docker artifact
        if: github.event.repository.private == false
        uses: actions/upload-artifact@v4
        with:
          name: pica-library-docker-amd64-experimental-${{ github.sha }}
          path: |
            artifacts/Pica-Library-*-docker-amd64-experimental.tar.gz
            artifacts/DOCKER-EXPERIMENTAL-SHA256SUMS.txt
            artifacts/DOCKER-EXPERIMENTAL-METADATA.json
          retention-days: 1
          if-no-files-found: error
