name: Apply V5 portable semantic hardening

on:
  push:
    branches: [feature/recommendation-v5-portable-policy]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recommendation-v5-portable-policy
          fetch-depth: 0
      - name: Apply semantic hardening
        shell: bash
        run: |
          if grep -q 'CACHE_BASELINE="cacheBaseline"' mobile/android-alpha2/app/src/main/java/com/picalibrary/android/RecommendationPolicyStore.java; then
            echo 'V5 semantic hardening already applied.'
            exit 0
          fi
          python -m py_compile scripts/v5-portable-semantic-hardening.py
          python scripts/v5-portable-semantic-hardening.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/android-alpha2/app/src/main/java/com/picalibrary/android/RecommendationPolicyStore.java \
                  mobile/android-alpha2/app/src/main/java/com/picalibrary/android/BridgeClient.java \
                  mobile/android-alpha2/app/src/main/java/com/picalibrary/android/NativeRecommendationEngine.java \
                  mobile/android-alpha2/app/src/main/java/com/picalibrary/android/HomeActivity.java \
                  src/library/service.ts \
                  src/recommendation-v3/cycle-coordinator-v3.ts \
                  test/unit/recommendation-v5-product-contract.test.ts
          git diff --cached --check
          git commit -m "fix: apply only portable policy deltas on Android"
          git push origin HEAD:feature/recommendation-v5-portable-policy
