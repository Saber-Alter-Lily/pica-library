name: Desktop Overlap Foreground Latency Harness

on:
  push:
    branches: [main]
    paths:
      - 'scripts/benchmark/http-latency-scenario.ts'
      - 'scripts/benchmark/desktop-overlap-load-harness.ts'
      - 'scripts/run-desktop-webdav-load-harness.mjs'
      - 'test/unit/desktop-overlap-load-benchmark-p2j11.test.ts'
      - 'src/library/**'
      - 'src/remote-storage/**'
      - 'src/runtime/resource-coordinator.ts'
      - 'docs/DESKTOP_OVERLAP_FOREGROUND_LATENCY_P2J11.md'
      - 'DEVELOPMENT_TASK_LOG.md'
      - 'package.json'
      - '.github/workflows/desktop-overlap-load-harness.yml'
  pull_request:
    paths:
      - 'scripts/benchmark/http-latency-scenario.ts'
      - 'scripts/benchmark/desktop-overlap-load-harness.ts'
      - 'scripts/run-desktop-webdav-load-harness.mjs'
      - 'test/unit/desktop-overlap-load-benchmark-p2j11.test.ts'
      - 'src/library/**'
      - 'src/remote-storage/**'
      - 'src/runtime/resource-coordinator.ts'
      - 'docs/DESKTOP_OVERLAP_FOREGROUND_LATENCY_P2J11.md'
      - 'DEVELOPMENT_TASK_LOG.md'
      - 'package.json'
      - '.github/workflows/desktop-overlap-load-harness.yml'

permissions:
  contents: read

jobs:
  overlap-foreground-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run J2/J11 contract tests
        run: >-
          pnpm exec vitest run
          test/unit/http-latency-scenario-p2j2.test.ts
          test/unit/desktop-overlap-load-benchmark-p2j11.test.ts
      - name: Run controlled overlapping-load harness smoke
        run: >-
          pnpm benchmark:desktop-overlap-load --
          --rounds=1
          --iterations=3
          --warmup=1
          --interval-ms=10
          --download-pages=120
          --chunks-per-page=4
          --chunk-delay-ms=15
          --bytes-per-chunk=8192
          --webdav-pages=240
          --webdav-bytes-per-page=8192
          --webdav-request-delay-ms=25
          --output=test-results/desktop-overlap-load/j11-smoke.json
      - name: Upload J11 harness diagnostics
        if: always() && github.event.repository.private == false
        uses: actions/upload-artifact@v4
        with:
          name: desktop-overlap-load-${{ github.run_id }}-${{ github.job }}
          path: test-results/desktop-overlap-load/
          retention-days: 1
          if-no-files-found: ignore
