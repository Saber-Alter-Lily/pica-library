plugins {
    id 'com.android.application'
}

def previewKeystorePath = System.getenv('ANDROID_PREVIEW_KEYSTORE_PATH')
def previewKeystorePassword = System.getenv('ANDROID_PREVIEW_KEYSTORE_PASSWORD')
def previewSigningConfigured = previewKeystorePath != null && !previewKeystorePath.isBlank() &&
        previewKeystorePassword != null && !previewKeystorePassword.isBlank()
def buildVersionCode = Integer.parseInt(System.getenv('PICA_ANDROID_VERSION_CODE') ?: '50')
def buildVersionName = System.getenv('PICA_ANDROID_VERSION_NAME') ?: '0.4.7'

android {
    namespace 'com.picalibrary.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.picalibrary.android'
        minSdk 28
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName
        manifestPlaceholders = [
                appLabel  : 'Pica Library',
                pairScheme: 'picalibrary'
        ]
    }

    signingConfigs {
        if (previewSigningConfigured) {
            preview {
                storeFile file(previewKeystorePath)
                storePassword previewKeystorePassword
                keyAlias 'pica-preview'
                keyPassword previewKeystorePassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    buildTypes {
        debug {
            // Side-by-side manual QA build. It must never replace the formal app.
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev-pr35'
            debuggable true
            manifestPlaceholders = [
                    appLabel  : 'Pica Library Dev',
                    pairScheme: 'picalibrary'
            ]
            // CI candidate builds reuse the fixed official signing identity when configured so future Dev APKs
            // can upgrade the previous Dev installation without shipping a private key.
            if (previewSigningConfigured) {
                signingConfig signingConfigs.preview
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [
                    appLabel  : 'Pica Library',
                    pairScheme: 'picalibrary'
            ]
            if (previewSigningConfigured) {
                signingConfig signingConfigs.preview
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
