name: Experimental Linux Package

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'scripts/build-linux-experimental.sh'
      - 'scripts/linux-runtime-preflight.sh'
      - 'scripts/test-linux-experimental.sh'
      - 'scripts/test-linux-glibc228-container.sh'
      - 'scripts/test-linux-preview-acceptance.sh'
      - 'scripts/test-linux-preview-replacement.sh'
      - 'scripts/install-linux-user.sh'
      - 'scripts/uninstall-linux-user.sh'
      - 'scripts/test-linux-user-desktop-install.sh'
      - 'rollup.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/linux-experimental.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'web/**'
      - 'scripts/build-linux-experimental.sh'
      - 'scripts/linux-runtime-preflight.sh'
      - 'scripts/test-linux-experimental.sh'
      - 'scripts/test-linux-glibc228-container.sh'
      - 'scripts/test-linux-preview-acceptance.sh'
      - 'scripts/test-linux-preview-replacement.sh'
      - 'scripts/install-linux-user.sh'
      - 'scripts/uninstall-linux-user.sh'
      - 'scripts/test-linux-user-desktop-install.sh'
      - 'rollup.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/linux-experimental.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x64-experimental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false

      - run: pnpm install --frozen-lockfile

      - name: Build experimental Linux x64 package
        run: bash scripts/build-linux-experimental.sh

      - name: Build first W4A preview baseline for replacement gate
        env:
          BASE_SHA: 9104ed6774b33d903becf73ee1f16168c9bc5f3d
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/pica-linux-preview-baseline"
          rm -rf "$baseline"
          git worktree add --detach "$baseline" "$BASE_SHA"
          cleanup() {
            git worktree remove --force "$baseline" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir -p "$baseline/artifacts/cache"
          if [ -d artifacts/cache ]; then
            cp -a artifacts/cache/. "$baseline/artifacts/cache/"
          fi
          (
            cd "$baseline"
            pnpm install --frozen-lockfile
            bash scripts/build-linux-experimental.sh
          )
          baseline_archive="$(find "$baseline/artifacts" -maxdepth 1 -type f -name 'Pica-Library-*-linux-x64-experimental.tar.gz' -print -quit)"
          test -n "$baseline_archive"
          cp "$baseline_archive" artifacts/Pica-Library-linux-x64-preview-baseline.tar.gz
          cleanup
          trap - EXIT

      - name: Smoke packaged Linux runtime
        run: |
          set -euo pipefail
          archive="$(find artifacts -maxdepth 1 -type f -name 'Pica-Library-*-linux-x64-experimental.tar.gz' -print -quit)"
          test -n "$archive"
          bash scripts/test-linux-experimental.sh "$archive"

      - name: Run packaged runtime on glibc 2.28 baseline
        run: |
          set -euo pipefail
          archive="$(find artifacts -maxdepth 1 -type f -name 'Pica-Library-*-linux-x64-experimental.tar.gz' -print -quit)"
          test -n "$archive"
          bash scripts/test-linux-glibc228-container.sh "$archive"

      - name: Run Linux x64 preview vertical acceptance
        run: |
          set -euo pipefail
          archive="$(find artifacts -maxdepth 1 -type f -name 'Pica-Library-*-linux-x64-experimental.tar.gz' -print -quit)"
          test -n "$archive"
          bash scripts/test-linux-preview-acceptance.sh "$archive"

      - name: Run Linux preview replacement and rollback acceptance
        run: |
          set -euo pipefail
          baseline="artifacts/Pica-Library-linux-x64-preview-baseline.tar.gz"
          candidate="$(find artifacts -maxdepth 1 -type f -name 'Pica-Library-*-linux-x64-experimental.tar.gz' -print -quit)"
          test -f "$baseline"
          test -n "$candidate"
          bash scripts/test-linux-preview-replacement.sh "$baseline" "$candidate"

      - name: Validate Linux user desktop install and uninstall
        run: |
          set -euo pipefail
          if ! command -v desktop-file-validate >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y desktop-file-utils
          fi
          archive="$(find artifacts -maxdepth 1 -type f -name 'Pica-Library-*-linux-x64-experimental.tar.gz' -print -quit)"
          test -n "$archive"
          bash scripts/test-linux-user-desktop-install.sh "$archive"

      - name: Upload experimental Linux x64 artifact
        if: github.event.repository.private == false
        uses: actions/upload-artifact@v4
        with:
          name: pica-library-linux-x64-experimental-${{ github.sha }}
          path: |
            artifacts/Pica-Library-*-linux-x64-experimental.tar.gz
            artifacts/LINUX-EXPERIMENTAL-SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error
