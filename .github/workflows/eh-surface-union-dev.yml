name: Validate E-H canonical surface union

on:
  push:
    branches:
      - feature/eh-provider-v1
    paths:
      - 'scripts/dev/fix-eh-surface-union.mjs'
      - '.github/workflows/eh-surface-union-dev.yml'

permissions:
  contents: write

concurrency:
  group: eh-surface-union-dev
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eh-provider-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
      - run: pnpm install --frozen-lockfile
      - name: Apply source-union fix
        run: node scripts/dev/fix-eh-surface-union.mjs
      - name: Validate Web and Desktop
        run: |
          pnpm type:check
          pnpm web:check
          pnpm test
          pnpm build
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate Android unchanged integration
        working-directory: mobile/android-alpha2
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
      - name: Commit validated source-union fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/provider-service.ts test/unit/eh-cross-source-v3.test.ts
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix: union E-H and ExH source bindings canonically'
          git push origin HEAD:feature/eh-provider-v1
