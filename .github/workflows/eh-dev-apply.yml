name: Validate and apply E-H account core

on:
  push:
    branches:
      - feature/eh-provider-v1
    paths:
      - 'scripts/dev/apply-eh-account-core.mjs'
      - '.github/workflows/eh-dev-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eh-provider-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply E-H account core patch
        run: node scripts/dev/apply-eh-account-core.mjs
      - name: Validate account core and desktop regression
        run: |
          set -euo pipefail
          pnpm type:check
          pnpm web:check
          pnpm test
          pnpm build
      - name: Commit validated account core
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/library/database.ts src/services/provider-service.ts src/library/service.ts src/library/server.ts test/unit/eh-account-core.test.ts
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat: add E-H account core and favorite aggregation'
          git push origin HEAD:feature/eh-provider-v1
