plugins { id 'com.android.application' }

// Independent optional source component only. Uses the platform Binder ABI;
// the real Reader, local storage, shelves and history live exclusively in
// the physically separate no-INTERNET :local-app.
android {
    namespace 'com.picalibrary.android.hostapp'
    compileSdk 35
    defaultConfig {
        applicationId 'com.picalibrary.android.userhost.qa'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.5.0-user-host-qa'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':local-core')
    implementation project(':user-host-core')
    implementation project(':source-bridge')
}
