name: Legacy transition T3 (unpublished diagnostics only)

on:
  push:
    branches: [codex/legacy-transition-t3-20261026]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: legacy-transition-t3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  t3:
    if: github.event.repository.private == false && github.repository == 'Saber-Alter-Lily/pica-library' && github.ref == 'refs/heads/codex/legacy-transition-t3-20261026' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Existing dependencies and source-only T3 checks
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm type:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run test/unit/legacy-transition-t3-gate.test.ts test/unit/legacy-transition-preflight.test.ts test/unit/legacy-transition-coordinator.test.ts --maxWorkers=2 --minWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pinned public old package and actual trusted producer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/release-base | Out-Null
          $old='artifacts/release-base/Pica-Library-v0.5.0-windows-x64.zip'
          Invoke-WebRequest -Uri 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/v0.5.0/Pica-Library-v0.5.0-windows-x64.zip' -OutFile $old
          if ((Get-FileHash -LiteralPath $old -Algorithm SHA256).Hash.ToLowerInvariant() -ne '14b92b60660b6694e2c8c19a2c1da695127de8dfd0fbafd6bd36fc8b5bc3d2bf') { throw 'Pinned old archive mismatch' }
          ./scripts/build-windows-legacy-transition-t3.ps1 -ExpectedSourceSha $env:GITHUB_SHA
          if (-not $?) { throw 'T3 fixture/producer step failed' }
      - name: Reused real ConPTY and browser tools in runner temp only
        shell: pwsh
        run: |
          $toolRoot=Join-Path $env:RUNNER_TEMP ('pica-t3-tools-'+[guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $toolRoot | Out-Null
          [IO.File]::WriteAllText((Join-Path $toolRoot 'package.json'), '{"private":true}', [Text.UTF8Encoding]::new($false))
          pnpm --dir $toolRoot add --save-dev --ignore-scripts 'node-pty@1.1.0' '@playwright/test@1.63.0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PLAYWRIGHT_BROWSERS_PATH=Join-Path $toolRoot 'browsers'
          pnpm --dir $toolRoot exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PICA_T3_TOOL_ROOT=$toolRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PLAYWRIGHT_BROWSERS_PATH=$env:PLAYWRIGHT_BROWSERS_PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Actual bound entry, protected data, recovery and browser forward update
        shell: pwsh
        run: |
          node scripts/test-windows-legacy-transition-t3.mjs artifacts/release-base/Pica-Library-v0.5.0-windows-x64.zip artifacts/legacy-transition-t3-private-fixtures $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep bounded diagnostics, NEVER executable tools or target archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Legacy-Transition-T3-Diagnostics
          path: |
            artifacts/legacy-transition-t3-evidence/summary.json
            artifacts/legacy-transition-t3-evidence/*/result.json
            artifacts/legacy-transition-t3-evidence/*/terminal.txt
            artifacts/legacy-transition-t3-evidence/*/audit.jsonl
            artifacts/legacy-transition-t3-private-fixtures/BUILD_RECEIPT.json
          retention-days: 1
          if-no-files-found: warn
