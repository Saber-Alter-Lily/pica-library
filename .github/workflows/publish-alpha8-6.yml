name: Publish Alpha8.6 and Desktop v0.3.4

on:
  push:
    paths:
      - '.github/workflows/publish-alpha8-6.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_REPO: 'Saber-Alter-Lily/pica-library'
      RELEASE_TARGET: '9b9ff099cd4edb44613ced649d038d20b433fc92'
      ANDROID_ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-0e10-81f5-bad8-72b608cf9474/raw?se=2026-09-10T13%3A16%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=3e90ba6b-1f35-5219-b40f-a8f4260c82cb&skoid=80e81ea6-3c08-46f9-bd84-b87176742bcd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T12%3A48%3A23Z&ske=2026-09-11T12%3A48%3A23Z&sks=b&skv=2026-02-06&sig=3eew%2B9ViU5sYDcM%2BBEX9TLXqJF8QHh3i4V/VZnojIYw%3D'
      WINDOWS_ARTIFACT_URL: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-79e8-81f6-9d3e-7b473c002e4d/raw?se=2026-09-10T13%3A16%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=86fd9b49-9e0a-5e76-b29c-0e70ff19a17d&skoid=80e81ea6-3c08-46f9-bd84-b87176742bcd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T03%3A28%3A37Z&ske=2026-09-11T03%3A28%3A37Z&sks=b&skv=2026-02-06&sig=fgaZ0C8NSXElbf3WJrYKzhcpaK8dPn/wDRqZ93jfku4%3D'
      EXPECTED_CERT: '64fb87dc7d8bd6bc7b2cec92cc8c83fad3afe8cfb07591a2e53d53cbd3ab2f9d'
    steps:
      - name: Download validated private artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android" "$RUNNER_TEMP/windows" publish
          curl -L --fail --retry 3 --retry-delay 1 "$ANDROID_ARTIFACT_URL" -o "$RUNNER_TEMP/android-wrapper.zip"
          curl -L --fail --retry 3 --retry-delay 1 "$WINDOWS_ARTIFACT_URL" -o "$RUNNER_TEMP/windows-wrapper.zip"
          unzip -q "$RUNNER_TEMP/android-wrapper.zip" -d "$RUNNER_TEMP/android"
          unzip -q "$RUNNER_TEMP/windows-wrapper.zip" -d "$RUNNER_TEMP/windows"
          A=$(find "$RUNNER_TEMP/android" -type f -name 'Pica-Library-Android-v31-Alpha8.6-UNSIGNED.apk' -print -quit)
          F=$(find "$RUNNER_TEMP/windows" -type f -name 'Pica-Library-v0.3.4-windows-x64.zip' -print -quit)
          U=$(find "$RUNNER_TEMP/windows" -type f -name 'Pica-Library-v0.3.4-update.zip' -print -quit)
          S=$(find "$RUNNER_TEMP/windows" -type f -name 'SHA256SUMS-v0.3.4.txt' -print -quit)
          test -s "$A" && test -s "$F" && test -s "$U" && test -s "$S"
          cp "$F" publish/Pica-Library-v0.3.4-windows-x64.zip
          cp "$U" publish/Pica-Library-v0.3.4-update.zip
          cp "$S" publish/SHA256SUMS.txt
          FULL_SHA=$(sha256sum publish/Pica-Library-v0.3.4-windows-x64.zip | cut -d' ' -f1)
          UPDATE_SHA=$(sha256sum publish/Pica-Library-v0.3.4-update.zip | cut -d' ' -f1)
          grep -q "$FULL_SHA  Pica-Library-v0.3.4-windows-x64.zip" publish/SHA256SUMS.txt
          grep -q "$UPDATE_SHA  Pica-Library-v0.3.4-update.zip" publish/SHA256SUMS.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'build-tools;35.0.0'
      - name: Sign and verify Android v31
        env:
          PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          INPUT=$(find "$RUNNER_TEMP/android" -type f -name 'Pica-Library-Android-v31-Alpha8.6-UNSIGNED.apk' -print -quit)
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$INPUT" | grep -q "package: name='com.picalibrary.android' versionCode='31' versionName='0.1.0-alpha8.6-star-personalization'"
          KEYSTORE="$RUNNER_TEMP/pica-preview.jks"
          printf '%s' "$PREVIEW_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias pica-preview \
            --ks-pass "pass:$PREVIEW_KEYSTORE_PASSWORD" --key-pass "pass:$PREVIEW_KEYSTORE_PASSWORD" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false \
            --out publish/Pica-Library-Android-Preview.apk "$INPUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs publish/Pica-Library-Android-Preview.apk
          CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs publish/Pica-Library-Android-Preview.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')
          test "$CERT" = "$EXPECTED_CERT"
          printf '%s\n' "$CERT" > publish/Pica-Library-Android-Preview.cert-sha256
          rm -f "$KEYSTORE"
      - name: Validate universal update and write release metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          p=Path('publish'); apk=p/'Pica-Library-Android-Preview.apk'; full=p/'Pica-Library-v0.3.4-windows-x64.zip'; update=p/'Pica-Library-v0.3.4-update.zip'
          sha=lambda q: hashlib.sha256(q.read_bytes()).hexdigest()
          with zipfile.ZipFile(update) as z:
              m=json.loads(z.read('update-manifest.json'))
          assert m['sourceVersionRange']=='=0.3.1 || =0.3.2 || =0.3.3',m
          assert 'sourceSha' not in m,m
          assert m['targetVersion']=='0.3.4',m
          assert m['targetSourceSha']==os.environ['RELEASE_TARGET'],m
          assert not m['requiresFullInstall'],m
          ah,fh,uh=sha(apk),sha(full),sha(update)
          android={
            'versionCode':31,
            'versionName':'0.1.0-alpha8.6-star-personalization',
            'apkUrl':'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.apk',
            'sha256':ah,
            'releaseNotes':'Alpha8.6: current source is open again. Personalization is now a GitHub Star community reward; one successful public Star verification unlocks Pica Violet · 星漫 and Theme Studio themes, which can sync from Desktop to a paired phone. Adds a fixed anime brand icon, fixes the Desktop header collision and double file-picker trigger, and replaces the oversized Recommendation refresh / Online account header buttons with compact icon actions. Retains recommendation persistence, viewport restoration, 24h/7d/30d rankings and updater resilience.',
            'minimumSupportedVersionCode':23
          }
          (p/'android-update.json').write_text(json.dumps(android,ensure_ascii=False,indent=2),encoding='utf-8')
          transparency={
            'releaseId':'alpha8.6-v31-desktop-v0.3.4',
            'sourcePolicy':'current-source-open',
            'publicSourceCommit':os.environ['RELEASE_TARGET'],
            'android':{'versionCode':31,'versionName':android['versionName'],'sha256':ah,'signingCertificateSha256':os.environ['EXPECTED_CERT'],'R8':True},
            'windows':{'version':'0.3.4','fullZipSha256':fh,'updateZipSha256':uh,'sourceVersionRange':m['sourceVersionRange'],'buildProvenance':m['targetSourceSha']},
            'personalization':{'gate':'github-star','defaultTheme':'Pica Violet · 星漫','themePackFormatVersion':1,'dataOnly':True}
          }
          (p/'BUILD_TRANSPARENCY.json').write_text(json.dumps(transparency,ensure_ascii=False,indent=2),encoding='utf-8')
          print('ANDROID_SHA='+ah);print('WINDOWS_FULL_SHA='+fh);print('WINDOWS_UPDATE_SHA='+uh)
          PY
      - name: Publish Android Preview OTA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit android-preview --repo "$GH_REPO" --target "$RELEASE_TARGET" --prerelease --title 'Pica Library Android Preview' --notes 'Alpha8.6 / v31: GitHub Star personalization, Pica Violet · 星漫, unified anime app icon, compact mobile header actions, Theme Studio sync and current-source open-source return.'
          gh release upload android-preview --repo "$GH_REPO" publish/Pica-Library-Android-Preview.apk publish/android-update.json publish/Pica-Library-Android-Preview.cert-sha256 publish/BUILD_TRANSPARENCY.json --clobber
      - name: Publish Desktop v0.3.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Desktop v0.3.4 / Alpha8.6: current source is open again. GitHub Star now unlocks personalization independently of donations, with Pica Violet · 星漫 available immediately and Theme Studio themes syncing to paired Android. Fixes top-header collisions, duplicate file-picker launches and preserves the resilient GitHub update fallback. The incremental package supports v0.3.1, v0.3.2 and v0.3.3.'
          if gh release view v0.3.4 --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit v0.3.4 --repo "$GH_REPO" --target "$RELEASE_TARGET" --title 'Pica Library v0.3.4' --notes "$NOTES" --latest
          else
            gh release create v0.3.4 --repo "$GH_REPO" --target "$RELEASE_TARGET" --title 'Pica Library v0.3.4' --notes "$NOTES" --latest
          fi
          gh release upload v0.3.4 --repo "$GH_REPO" publish/Pica-Library-v0.3.4-windows-x64.zip publish/Pica-Library-v0.3.4-update.zip publish/SHA256SUMS.txt publish/BUILD_TRANSPARENCY.json --clobber
      - name: Verify live channels
        run: |
          set -euo pipefail
          sleep 4
          curl -L --fail --retry 3 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/android-update.json' -o "$RUNNER_TEMP/a.json"
          curl -L --fail --retry 3 'https://api.github.com/repos/Saber-Alter-Lily/pica-library/releases/tags/android-preview' -o "$RUNNER_TEMP/ar.json"
          curl -L --fail --retry 3 'https://api.github.com/repos/Saber-Alter-Lily/pica-library/releases/latest' -o "$RUNNER_TEMP/w.json"
          python - "$RUNNER_TEMP/a.json" "$RUNNER_TEMP/ar.json" "$RUNNER_TEMP/w.json" <<'PY'
          import hashlib,json,sys,urllib.request
          a=json.load(open(sys.argv[1],encoding='utf-8')); ar=json.load(open(sys.argv[2],encoding='utf-8')); w=json.load(open(sys.argv[3],encoding='utf-8'))
          assert a['versionCode']==31 and a['versionName']=='0.1.0-alpha8.6-star-personalization'
          aa={x['name']:x for x in ar['assets']}; assert aa['Pica-Library-Android-Preview.apk'].get('digest')=='sha256:'+a['sha256']
          assert w['tag_name']=='v0.3.4' and not w['draft'] and not w['prerelease']
          wa={x['name']:x for x in w['assets']}
          sums=urllib.request.urlopen(wa['SHA256SUMS.txt']['browser_download_url'],timeout=15).read().decode()
          for name in ['Pica-Library-v0.3.4-windows-x64.zip','Pica-Library-v0.3.4-update.zip']:
              expected=[line.split()[0] for line in sums.splitlines() if line.strip().endswith(name)][0]
              assert wa[name].get('digest')=='sha256:'+expected,(name,wa[name].get('digest'),expected)
          print('Alpha8.6 Android v31 and Desktop v0.3.4 are live and verified')
          PY
