name: S3 v0.5 release-layout historical fixture QA (read-only, synthetic only)

on:
  push:
    branches:
      - codex/s3-v050-historical-fixture-gate-20261029
    paths:
      - '.github/workflows/s3-v050-historical-fixture-qa.yml'
      - 'src/desktop/v050-historical-fixture-gate.ts'
      - 'test/unit/v050-historical-fixture-gate.test.ts'
      - 'src/desktop/legacy-profile-preflight.ts'
      - 'src/storage/sqlite/migrations.ts'
      - 'src/desktop/paths.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s3-v050-historical-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-layout-fixture:
    if: github.repository == 'Saber-Alter-Lily/pica-library'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Typecheck current Desktop and test contracts
        run: pnpm type:check
      - name: Prove v0.5 release Git blobs, old config, SQLite schema and fail-closed read-only gate
        run: pnpm exec vitest run test/unit/v050-historical-fixture-gate.test.ts test/unit/legacy-profile-preflight.test.ts test/unit/legacy-profile-snapshot-qa.test.ts test/unit/sqlite-filename.test.ts test/unit/desktop-instance-ownership.test.ts
