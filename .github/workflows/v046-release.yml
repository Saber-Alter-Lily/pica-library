name: v0.4.6 Formal Release

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/v046-release.yml'

permissions:
  contents: write

env:
  EXPECTED_CERT: '64fb87dc7d8bd6bc7b2cec92cc8c83fad3afe8cfb07591a2e53d53cbd3ab2f9d'

jobs:
  windows:
    if: github.event.repository.private == false && github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PICA_LIBRARY_BUILD_PROVENANCE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Re-run formal Desktop gates
        shell: pwsh
        run: |
          pnpm type:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm web:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download checksum-pinned public baselines
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\release-base | Out-Null
          $bases=@(
            @('0.4.1','88d87a8f0e5a8413656751ff344052eccbfa796e663e4acc8c7fe4a0e0866b3d'),
            @('0.4.2','96bcc020c7cd19aa84f982af9010f6656a44dc01b827839d6e24c40e36ec24c1'),
            @('0.4.3','36283292a1b3aefb1032b11c5064663bef9176d4bf32562be6a3f531c84ac733'),
            @('0.4.4','cff1c7cf5d79300d8fa38e9faf9d7280c20df1641908fbf28a28e32d3de41bff'),
            @('0.4.5','f5b93b4a81c78df17bbee793354d4e8df002fad6dcc9c432e334bb7c14fee901')
          )
          foreach($row in $bases){
            $version=$row[0]
            $expected=$row[1]
            $name="Pica-Library-v$version-windows-x64.zip"
            $path="artifacts\release-base\$name"
            Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/Saber-Alter-Lily/pica-library/releases/download/v$version/$name" -OutFile $path
            $actual=(Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if($actual -ne $expected){ throw "Official v$version package checksum mismatch: $actual" }
          }
      - name: Build Windows full and scoped updates
        shell: pwsh
        run: |
          pnpm build:windows
          $target='artifacts\Pica-Library-v0.4.6-windows-x64.zip'
          ./scripts/test-windows-artifact.ps1 -Zip $target
          foreach($source in @('0.4.1','0.4.2','0.4.3','0.4.4','0.4.5')){
            pnpm build:local-update "artifacts\release-base\Pica-Library-v$source-windows-x64.zip" $target "artifacts\Pica-Library-v0.4.6-update-from-v$source.zip"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build v0.4.0 direct upgrade assistant
        shell: pwsh
        run: |
          $full='artifacts\Pica-Library-v0.4.6-windows-x64.zip'
          $fullHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $full).Hash.ToLowerInvariant()
          $src='packaging\windows\upgrade-assistant-v041'
          $work=Join-Path $env:RUNNER_TEMP 'pica-v045-assistant'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $work
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          $ps1=Get-Content -Raw -LiteralPath (Join-Path $src 'Upgrade-Pica-Library-v0.4.1.ps1')
          $ps1=$ps1.Replace('0.4.1','0.4.6').Replace('v041','v045')
          $ps1=$ps1.Replace('88d87a8f0e5a8413656751ff344052eccbfa796e663e4acc8c7fe4a0e0866b3d',$fullHash)
          $ps1=$ps1.Replace('974d4e9b22379aeed379b71711008332acc213a4',$env:GITHUB_SHA)
          [IO.File]::WriteAllText((Join-Path $work 'Upgrade-Pica-Library-v0.4.6.ps1'),$ps1,(New-Object Text.UTF8Encoding($true)))

          $cmd=(Get-Content -Raw -LiteralPath (Join-Path $src 'Upgrade-Pica-Library-v0.4.1.cmd')).Replace('0.4.1','0.4.6')
          [IO.File]::WriteAllText((Join-Path $work 'Upgrade-Pica-Library-v0.4.6.cmd'),$cmd,(New-Object Text.UTF8Encoding($false)))
          $readme=(Get-Content -Raw -LiteralPath (Join-Path $src 'README.txt')).Replace('0.4.1','0.4.6')
          [IO.File]::WriteAllText((Join-Path $work 'README.txt'),$readme,(New-Object Text.UTF8Encoding($false)))

          $assistant='artifacts\Pica-Library-v0.4.6-upgrade-assistant.zip'
          Compress-Archive -Path (Join-Path $work '*') -DestinationPath $assistant -CompressionLevel Optimal
          $assistantHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $assistant).Hash.ToLowerInvariant()
          "$assistantHash  Pica-Library-v0.4.6-upgrade-assistant.zip" | Set-Content -Encoding ascii 'artifacts\Pica-Library-v0.4.6-upgrade-assistant.sha256'
      - name: Write Windows release evidence
        shell: pwsh
        run: |
          $names=@(
            'Pica-Library-v0.4.6-windows-x64.zip',
            'Pica-Library-v0.4.6-update-from-v0.4.1.zip',
            'Pica-Library-v0.4.6-update-from-v0.4.2.zip',
            'Pica-Library-v0.4.6-update-from-v0.4.3.zip',
            'Pica-Library-v0.4.6-update-from-v0.4.4.zip',
            'Pica-Library-v0.4.6-upgrade-assistant.zip'
          )
          $lines=@()
          foreach($name in $names){
            $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath ("artifacts\"+$name)).Hash.ToLowerInvariant()
            $lines += "$hash  $name"
          }
          $lines | Set-Content -Encoding ascii 'artifacts\SHA256SUMS-Windows.txt'
          [ordered]@{
            release='v0.4.6'; sourceSha=$env:GITHUB_SHA; productVersion='0.4.6';
            publicUpgradeBaseline='0.4.0'; databaseSchema=13;
            scopedUpdateSources=@('0.4.1','0.4.2','0.4.3','0.4.4','0.4.5');
            gates=@('type-check','web-syntax','unit-integration-tests','production-build','windows-artifact-smoke','official-base-checksums','scoped-update-builds','direct-upgrade-assistant')
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'artifacts\BUILD_TRANSPARENCY-Windows.json'
      - uses: actions/upload-artifact@v4
        with:
          name: v045-windows-release
          path: |
            artifacts/Pica-Library-v0.4.6-windows-x64.zip
            artifacts/Pica-Library-v0.4.6-update-from-v0.4.1.zip
            artifacts/Pica-Library-v0.4.6-update-from-v0.4.2.zip
            artifacts/Pica-Library-v0.4.6-update-from-v0.4.3.zip
            artifacts/Pica-Library-v0.4.6-update-from-v0.4.4.zip
            artifacts/Pica-Library-v0.4.6-update-from-v0.4.5.zip
            artifacts/Pica-Library-v0.4.6-upgrade-assistant.zip
            artifacts/Pica-Library-v0.4.6-upgrade-assistant.sha256
            artifacts/SHA256SUMS-Windows.txt
            artifacts/BUILD_TRANSPARENCY-Windows.json
          retention-days: 1
          if-no-files-found: error

  android:
    if: github.event.repository.private == false && github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and lint Android
        working-directory: mobile/android-alpha2
        run: gradle :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Build and verify formal v48
        working-directory: mobile/android-alpha2
        env:
          ANDROID_PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
          ANDROID_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_PREVIEW_KEYSTORE_B64:-}"
          test -n "${ANDROID_PREVIEW_KEYSTORE_PASSWORD:-}"
          curl -fL --retry 3 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/v0.4.5/Pica-Library-Android-Preview.cert-sha256' -o "$RUNNER_TEMP/old-cert.txt"
          oldcert=$(tr -d '\r\n ' < "$RUNNER_TEMP/old-cert.txt")
          test "$oldcert" = "$EXPECTED_CERT"

          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/pica-v045-signing-XXXXXXXX")
          export ANDROID_PREVIEW_KEYSTORE_PATH="$signing_dir/preview.jks"
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$ANDROID_PREVIEW_KEYSTORE_B64" | base64 --decode > "$ANDROID_PREVIEW_KEYSTORE_PATH"
          unset ANDROID_PREVIEW_KEYSTORE_B64
          gradle :app:assembleRelease --no-daemon
          apk=app/build/outputs/apk/release/app-release.apk

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/package.txt"
          grep -q "package: name='com.picalibrary.android' versionCode='49' versionName='0.4.6'" "$RUNNER_TEMP/package.txt"
          grep -q "application-label:'Pica Library'" "$RUNNER_TEMP/package.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/cert.txt"
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/cert.txt" | head -1 | tr 'A-F' 'a-f')
          test "$cert" = "$EXPECTED_CERT"
          test "$cert" = "$oldcert"

          mkdir -p publish
          cp "$apk" publish/Pica-Library-Android-v49.apk
          cp "$apk" publish/Pica-Library-Android-Preview.apk
          printf '%s\n' "$cert" > publish/Pica-Library-Android-Preview.cert-sha256
          sha=$(sha256sum publish/Pica-Library-Android-v49.apk | awk '{print $1}')
          cat > publish/android-update.json <<JSON
          {
            "versionCode": 49,
            "versionName": "0.4.6",
            "apkUrl": "https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.apk",
            "sha256": "$sha",
            "releaseNotes": "三语界面与可跳过新手引导；扫码竖屏、提示与画风任务反馈修复；移动书库工具栏优化；Desktop 关闭页面时保留已配对手机链路。",
            "minimumSupportedVersionCode": 42
          }
          JSON
          printf '%s  %s\n' "$sha" 'Pica-Library-Android-v49.apk' > publish/SHA256SUMS-Android.txt
          python - "$sha" "$cert" "$GITHUB_SHA" <<'PY'
          import json,sys
          sha,cert,source=sys.argv[1:]
          out={"release":"v0.4.6","versionCode":49,"versionName":"0.4.6","sourceSha":source,"apkSha256":sha,"signerCertificateSha256":cert,"minimumSupportedVersionCode":42,"upgradeValidation":["same-package-id","higher-than-v48-formal-version","same-signing-certificate","formal-label","unit-tests","lint","R8-release-build"]}
          with open("publish/BUILD_TRANSPARENCY-Android.json","w",encoding="utf-8") as f: json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v045-android-release
          path: mobile/android-alpha2/publish/
          retention-days: 1
          if-no-files-found: error

  publish:
    if: github.event.repository.private == false && github.repository == 'Saber-Alter-Lily/pica-library'
    needs: [windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: v045-windows-release
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: v045-android-release
          path: release/android
      - name: Assemble release metadata
        run: |
          cat release/windows/SHA256SUMS-Windows.txt release/android/SHA256SUMS-Android.txt > release/SHA256SUMS.txt
          python - <<'PY'
          import json
          from pathlib import Path
          w=json.loads(Path("release/windows/BUILD_TRANSPARENCY-Windows.json").read_text(encoding="utf-8-sig"))
          a=json.loads(Path("release/android/BUILD_TRANSPARENCY-Android.json").read_text(encoding="utf-8-sig"))
          Path("release/BUILD_TRANSPARENCY.json").write_text(json.dumps({"release":"v0.4.6","windows":w,"android":a},ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          cat > release/RELEASE_NOTES.md <<'EOF'
          Pica Library v0.4.6

          ## Hotfix
          - 修复 Desktop / Web 推荐控制中心因本地化 helper 自递归导致的 `Maximum call stack size exceeded`。
          - 原有 V5 持久化人工调整没有被删除；修复后“你的调整”和完整 0–10 微调区域会直接恢复显示。
          - 合并重复的推荐语言切换重绘路径，避免一次切换触发两次面板重建。
          - 新增本地化 helper 自递归静态审计，以及真实 Chromium 持久化调整可见性回归。

          ## 升级
          - Windows v0.4.1–v0.4.5：应用内兼容增量更新。
          - Windows v0.4.0：使用 Pica-Library-v0.4.6-upgrade-assistant.zip 一次直达。
          - Android：v49 / 0.4.6，与 v0.4.5 保持相同包名和签名，可直接原地升级。
          EOF
      - name: Publish stable release and Android channel
        run: |
          assets=(
            release/windows/Pica-Library-v0.4.6-windows-x64.zip
            release/windows/Pica-Library-v0.4.6-update-from-v0.4.1.zip
            release/windows/Pica-Library-v0.4.6-update-from-v0.4.2.zip
            release/windows/Pica-Library-v0.4.6-update-from-v0.4.3.zip
            release/windows/Pica-Library-v0.4.6-update-from-v0.4.4.zip
            release/windows/Pica-Library-v0.4.6-update-from-v0.4.5.zip
            release/windows/Pica-Library-v0.4.6-upgrade-assistant.zip
            release/windows/Pica-Library-v0.4.6-upgrade-assistant.sha256
            release/windows/BUILD_TRANSPARENCY-Windows.json
            release/android/Pica-Library-Android-v49.apk
            release/android/Pica-Library-Android-Preview.cert-sha256
            release/android/android-update.json
            release/android/BUILD_TRANSPARENCY-Android.json
            release/BUILD_TRANSPARENCY.json
            release/SHA256SUMS.txt
          )
          gh release create v0.4.6 "${assets[@]}" --target "$GITHUB_SHA" --title 'Pica Library v0.4.6 · Recommendation Controls Hotfix' --notes-file release/RELEASE_NOTES.md

          git tag -f android-preview "$GITHUB_SHA"
          git push --force origin refs/tags/android-preview
          gh release upload android-preview             release/android/Pica-Library-Android-Preview.apk             release/android/Pica-Library-Android-Preview.cert-sha256             release/android/android-update.json             release/android/BUILD_TRANSPARENCY-Android.json             release/BUILD_TRANSPARENCY.json             --clobber
          gh release edit android-preview --title 'Android Preview v49 · Pica Library 0.4.6' --notes 'Android v49 / 0.4.6 正式更新通道。与既有正式版本保持相同包名和签名；可从 v42–v48 原地升级。' --prerelease
