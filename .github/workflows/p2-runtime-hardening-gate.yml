name: P2 Runtime Hardening Promotion Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/p2-runtime-hardening-gate.yml'
      - 'scripts/write-p2-runtime-hardening-gate-report.mjs'
      - 'test/unit/p2-runtime-hardening-gate.test.ts'
      - 'docs/P2_RUNTIME_HARDENING_GATE.md'
      - 'DEVELOPMENT_TASK_LOG.md'

concurrency:
  group: p2-runtime-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  P2_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  desktop-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run full Desktop/Web validation
        run: |
          set -euo pipefail
          pnpm type:check
          pnpm web:check
          pnpm test
          pnpm build
      - name: Re-run critical runtime hardening contracts explicitly
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            test/unit/long-task-stability-v047.test.ts \
            test/unit/recommendation-network-recovery.test.ts \
            test/unit/download-large-queue.test.ts \
            test/unit/download-runtime-stability.test.ts \
            test/unit/runtime-resource-coordinator.test.ts \
            test/unit/runtime-resource-observation-p2c2.test.ts \
            test/unit/runtime-resource-observation-p2c2b.test.ts \
            test/unit/runtime-task-diagnostics-p2i1.test.ts \
            test/unit/runtime-task-diagnostics-p2i2.test.ts \
            test/unit/http-latency-runtime-p2j1.test.ts \
            test/unit/http-latency-scenario-p2j2.test.ts \
            test/unit/desktop-headless-runtime-p5c.test.ts \
            test/unit/desktop-remediation.test.ts
      - name: Run real-browser Web smoke
        run: bash scripts/run-web-browser-smoke.sh
      - name: Upload browser diagnostics
        if: failure() && github.event.repository.private == false
        uses: actions/upload-artifact@v4
        with:
          name: p2-hardening-web-${{ github.run_id }}
          path: test-results/
          retention-days: 1
          if-no-files-found: ignore

  windows-package-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Prepare previous accepted Windows package
        shell: pwsh
        run: |
          $currentText = [string]((Get-Content -Raw -LiteralPath 'package.json' | ConvertFrom-Json).version)
          $current = [version]$currentText
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'pica-library-p2-hardening-gate'
          }
          $releases = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/Saber-Alter-Lily/pica-library/releases?per_page=100'
          $candidates = @(
            $releases | ForEach-Object {
              if ([string]$_.tag_name -match '^v(\d+\.\d+\.\d+)$') {
                $candidate = [version]$Matches[1]
                if ($candidate -lt $current) {
                  [pscustomobject]@{ Version=$candidate; Release=$_ }
                }
              }
            } | Sort-Object Version -Descending
          )
          if (-not $candidates.Count) { throw "No previous accepted semver release found before v$currentText" }
          $selected = $candidates[0]
          $baseVersion = $selected.Version.ToString()
          $assetName = "Pica-Library-v$baseVersion-windows-x64.zip"
          $asset = @($selected.Release.assets | Where-Object { $_.name -eq $assetName }) | Select-Object -First 1
          if (-not $asset) { throw "Previous accepted Windows asset missing: $assetName" }
          $baseDir = 'artifacts\release-base'
          New-Item -ItemType Directory -Force -Path $baseDir | Out-Null
          Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile (Join-Path $baseDir $assetName)
          Write-Host "Prepared accepted launcher baseline: v$baseVersion"
      - name: Build and smoke current Windows package
        shell: pwsh
        env:
          PICA_LIBRARY_BUILD_PROVENANCE: ${{ env.P2_CANDIDATE_SHA }}
        run: |
          pnpm build:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = [string]((Get-Content -Raw -LiteralPath 'package.json' | ConvertFrom-Json).version)
          $zip = "artifacts\Pica-Library-v$version-windows-x64.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "Windows package missing: $zip" }
          ./scripts/test-windows-artifact.ps1 -Zip $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  android-static:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run Android unit/lint/release + performance harness build
        working-directory: mobile/android-alpha2
        run: |
          gradle \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease \
            :app:assembleBenchmark \
            :macrobenchmark:assembleBenchmark \
            --stacktrace

  android-force-stop:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real force-stop recovery acceptance
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run-android-worker-force-stop-recovery.sh
      - name: Upload force-stop diagnostics
        if: always() && github.event.repository.private == false
        uses: actions/upload-artifact@v4
        with:
          name: p2-hardening-force-stop-${{ github.run_id }}
          path: test-results/android-worker-force-stop-recovery/
          retention-days: 1
          if-no-files-found: ignore

  android-memory-background:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run trim-memory and Doze durable-recovery acceptance
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run-android-memory-background.sh
      - name: Upload memory/background diagnostics
        if: always() && github.event.repository.private == false
        uses: actions/upload-artifact@v4
        with:
          name: p2-hardening-memory-background-${{ github.run_id }}
          path: test-results/android-memory-background/
          retention-days: 1
          if-no-files-found: ignore

  automated-summary:
    if: always()
    needs:
      - desktop-contracts
      - windows-package-smoke
      - android-static
      - android-force-stop
      - android-memory-background
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Write machine-readable P2 gate report
        env:
          P2_GATE_SHA: ${{ env.P2_CANDIDATE_SHA }}
          P2_GATE_DESKTOP: ${{ needs.desktop-contracts.result }}
          P2_GATE_WINDOWS: ${{ needs.windows-package-smoke.result }}
          P2_GATE_ANDROID: ${{ needs.android-static.result }}
          P2_GATE_FORCE_STOP: ${{ needs.android-force-stop.result }}
          P2_GATE_MEMORY_BACKGROUND: ${{ needs.android-memory-background.result }}
        run: node scripts/write-p2-runtime-hardening-gate-report.mjs
      - name: Upload gate report
        if: always() && github.event.repository.private == false
        uses: actions/upload-artifact@v4
        with:
          name: p2-runtime-hardening-gate-${{ github.run_id }}
          path: test-results/p2-runtime-hardening-gate.json
          retention-days: 7
          if-no-files-found: error
