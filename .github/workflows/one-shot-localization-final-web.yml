name: One-shot Localization Final Web Gate
# final-web-gate: work-identity-pass-4

on:
  push:
    branches:
      - dev/localization-onboarding-v1
    paths:
      - .github/workflows/one-shot-localization-final-web.yml

permissions:
  contents: read

jobs:
  web-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/localization-onboarding-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Validate Web
        run: |
          set -euo pipefail
          pnpm type:check
          pnpm web:check
          pnpm test
          pnpm build
      - name: Run final trilingual browser gate
        run: bash scripts/run-web-browser-smoke.sh
