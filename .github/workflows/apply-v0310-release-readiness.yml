name: Apply v0.3.10 release readiness

on:
  push:
    branches: [release/v0.3.10-readiness]
    paths:
      - '.github/workflows/apply-v0310-release-readiness.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.3.10-readiness
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply deterministic source transforms
        run: node scripts/apply-v0310-release-readiness.mjs
      - name: Verify source-level release contracts
        run: |
          set -euo pipefail
          grep -Fq '"version": "0.3.10"' package.json
          grep -Fq 'versionCode 37' mobile/android-alpha2/app/build.gradle
          grep -Fq "versionName '0.1.0-alpha8.10-release-readiness'" mobile/android-alpha2/app/build.gradle
          grep -Fq "Pica-Library-v0.3.10-windows-x64" scripts/build-windows-package.ps1
          ! grep -Fq 'GitHub 收藏项目有小惊喜' web/alpha8-product.js
          ! grep -Fq 'installBundledTesterGrant()' src/desktop/main.ts
          grep -Fq "GitHub Star authentication required" src/mobile/bridge-server.ts
          git diff --check
      - name: Commit transformed source
        run: |
          set -euo pipefail
          git config user.name 'Saber-Alter-Lily'
          git config user.email '3178088154@qq.com'
          git add web/alpha8-product.js web/alpha8-7-desktop-hub.js src/mobile/bridge-server.ts src/desktop/main.ts package.json mobile/android-alpha2/app/build.gradle scripts/build-windows-package.ps1 README.md README.en.md
          git diff --cached --quiet && { echo 'No source changes'; exit 1; }
          git commit -m 'refine: prepare v0.3.10 release UX and strict personalization gate'
          git push origin HEAD:release/v0.3.10-readiness
