name: S3 Android local Reader real emulator flow (unpublished)

on:
  pull_request:
    paths:
      - '.github/workflows/s3-android-local-emulator.yml'
      - 'scripts/run-s3-android-local-emulator.sh'
      - 'scripts/s3-android-local-emulator-flow.py'
      - 'mobile/android-alpha2/local-app/**'
      - 'mobile/android-alpha2/local-storage/**'
      - 'mobile/android-alpha2/reader-view/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-ui-flow:
    if: github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Require real KVM acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Use Android 35 system picker and original app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          script: bash scripts/run-s3-android-local-emulator.sh
      - name: Preserve actual app screenshots, UI trees, ledgers and failures
        if: always() && github.event.repository.private == false
        uses: actions/upload-artifact@v4
        with:
          name: s3-local-emulator-${{ github.sha }}
          path: mobile/android-alpha2/s3-local-emulator-evidence/
          retention-days: 2
          if-no-files-found: warn
