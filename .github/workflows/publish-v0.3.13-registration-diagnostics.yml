name: Publish v0.3.13 and Android v40 registration diagnostics

on:
  push:
    paths:
      - '.github/workflows/publish-v0.3.13-registration-diagnostics.yml'

permissions:
  contents: write

env:
  RELEASE_TARGET: '866acade5cd096614a99357ed7c2654bb0a93073'
  DESKTOP_VERSION: '0.3.13'
  ANDROID_VERSION_CODE: '40'
  ANDROID_VERSION_NAME: '0.1.0-alpha8.13-registration-diagnostics'
  EXPECTED_CERT: '64fb87dc7d8bd6bc7b2cec92cc8c83fad3afe8cfb07591a2e53d53cbd3ab2f9d'

jobs:
  windows:
    runs-on: windows-latest
    env:
      PICA_LIBRARY_BUILD_PROVENANCE: '866acade5cd096614a99357ed7c2654bb0a93073'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '866acade5cd096614a99357ed7c2654bb0a93073'
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Re-run Desktop release gates
        shell: pwsh
        run: |
          pnpm type:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm web:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download and verify official v0.3.12 base
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\release-base | Out-Null
          $base='artifacts\release-base\Pica-Library-v0.3.12-windows-x64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/v0.3.12/Pica-Library-v0.3.12-windows-x64.zip' -OutFile $base
          $actual=(Get-FileHash -Algorithm SHA256 $base).Hash.ToLowerInvariant()
          $expected='a18cb46d40a077ba6f6ee46b9c8ee6df78812e2e384bbeff63dbc4a563497810'
          if($actual -ne $expected){ throw "v0.3.12 base SHA-256 mismatch: $actual" }
          Write-Host 'OFFICIAL_V0_3_12_BASE_SHA256=PASS'
      - name: Build v0.3.13 full and incremental packages
        shell: pwsh
        run: |
          pnpm build:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec tsx scripts/build-local-update-package.ts artifacts/release-base/Pica-Library-v0.3.12-windows-x64.zip artifacts/Pica-Library-v0.3.13-windows-x64.zip artifacts/Pica-Library-v0.3.13-update.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows update contract and hashes
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $update='artifacts\Pica-Library-v0.3.13-update.zip'
          $archive=[IO.Compression.ZipFile]::OpenRead($update)
          try {
            $entry=$archive.GetEntry('update-manifest.json')
            if(-not $entry){ throw 'update-manifest.json missing' }
            $reader=New-Object IO.StreamReader($entry.Open())
            try { $manifest=($reader.ReadToEnd() | ConvertFrom-Json) } finally { $reader.Dispose() }
            if($manifest.sourceVersionRange -ne '=0.3.12'){ throw "unexpected source range: $($manifest.sourceVersionRange)" }
            if($manifest.targetVersion -ne '0.3.13'){ throw "unexpected target: $($manifest.targetVersion)" }
            if($manifest.targetSourceSha -ne $env:RELEASE_TARGET){ throw "unexpected target source: $($manifest.targetSourceSha)" }
            if($manifest.requiresFullInstall){ throw 'incremental update unexpectedly requires full install' }
            $protected=@('Pica Library.exe','app/updater.js','runtime/node.exe')
            foreach($item in @($manifest.files)){ if($protected -contains [string]$item.path){ throw "protected replacement in update: $($item.path)" } }
            foreach($item in @($manifest.deletions)){ if($protected -contains [string]$item){ throw "protected deletion in update: $item" } }
          } finally { $archive.Dispose() }
          $full='artifacts\Pica-Library-v0.3.13-windows-x64.zip'
          $fullHash=(Get-FileHash -Algorithm SHA256 $full).Hash.ToLowerInvariant()
          $updateHash=(Get-FileHash -Algorithm SHA256 $update).Hash.ToLowerInvariant()
          "$fullHash  Pica-Library-v0.3.13-windows-x64.zip`n$updateHash  Pica-Library-v0.3.13-update.zip" | Set-Content -Encoding ascii artifacts\SHA256SUMS-Windows.txt
          [ordered]@{
            product='Pica Library Desktop'
            version='0.3.13'
            sourceSha=$env:RELEASE_TARGET
            baseVersion='0.3.12'
            baseSha256='a18cb46d40a077ba6f6ee46b9c8ee6df78812e2e384bbeff63dbc4a563497810'
            fullSha256=$fullHash
            updateSha256=$updateHash
            updateSourceRange='=0.3.12'
            buildValidation=@('typecheck','web-check','tests','build','official-base-sha256','incremental-manifest-contract')
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 artifacts\BUILD_TRANSPARENCY-Windows.json
          Write-Host 'WINDOWS_RELEASE_CONTRACT=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Windows-v0.3.13
          path: |
            artifacts/Pica-Library-v0.3.13-windows-x64.zip
            artifacts/Pica-Library-v0.3.13-update.zip
            artifacts/SHA256SUMS-Windows.txt
            artifacts/BUILD_TRANSPARENCY-Windows.json
          retention-days: 3
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '866acade5cd096614a99357ed7c2654bb0a93073'
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and lint before loading signing material
        working-directory: mobile/android-alpha2
        run: gradle :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Build and verify fixed-signature Android v40
        working-directory: mobile/android-alpha2
        env:
          ANDROID_PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
          ANDROID_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_PREVIEW_KEYSTORE_B64:-}"
          test -n "${ANDROID_PREVIEW_KEYSTORE_PASSWORD:-}"
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/pica-signing-XXXXXXXX")
          export ANDROID_PREVIEW_KEYSTORE_PATH="$signing_dir/preview.jks"
          trap 'rm -f -- "$ANDROID_PREVIEW_KEYSTORE_PATH"; rmdir -- "$signing_dir" 2>/dev/null || true' EXIT
          printf '%s' "$ANDROID_PREVIEW_KEYSTORE_B64" | base64 --decode > "$ANDROID_PREVIEW_KEYSTORE_PATH"
          unset ANDROID_PREVIEW_KEYSTORE_B64
          gradle :app:assembleRelease --no-daemon
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/pica-v40-package.txt"
          grep -q "package: name='com.picalibrary.android' versionCode='40' versionName='0.1.0-alpha8.13-registration-diagnostics'" "$RUNNER_TEMP/pica-v40-package.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/pica-v40-cert.txt"
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/pica-v40-cert.txt" | head -1 | tr 'A-F' 'a-f')
          test "$cert" = "$EXPECTED_CERT"
          mkdir -p publish
          cp "$apk" publish/Pica-Library-Android-v40.apk
          cp "$apk" publish/Pica-Library-Android-Preview.apk
          printf '%s\n' "$cert" > publish/Pica-Library-Android-Preview.cert-sha256
          sha=$(sha256sum publish/Pica-Library-Android-Preview.apk | awk '{print $1}')
          python - "$sha" "$cert" "$RELEASE_TARGET" <<'PY'
          import json,sys
          sha,cert,source=sys.argv[1:]
          manifest={
              'versionCode':40,
              'versionName':'0.1.0-alpha8.13-registration-diagnostics',
              'apkUrl':'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.apk',
              'sha256':sha,
              'releaseNotes':'Alpha8.13: improve Pica registration validation and failure feedback; preserve failed registration forms; distinguish direct-network failures from account rejection. Registration still uses the official Pica API and proxy/VPN need depends on network reachability.',
              'minimumSupportedVersionCode':23,
          }
          with open('publish/android-update.json','w',encoding='utf-8') as f:
              json.dump(manifest,f,ensure_ascii=False,indent=2)
          transparency={
              'product':'Pica Library Android Preview',
              'versionCode':40,
              'versionName':'0.1.0-alpha8.13-registration-diagnostics',
              'sourceSha':source,
              'apkSha256':sha,
              'signerCertificateSha256':cert,
              'channel':'android-preview',
              'buildValidation':['unit-tests','lint','R8-release-build','package-version-verification','stable-signer-verification'],
              'liveProviderRegistration':'not-exercised-in-CI',
          }
          with open('publish/BUILD_TRANSPARENCY.json','w',encoding='utf-8') as f:
              json.dump(transparency,f,ensure_ascii=False,indent=2)
          PY
          sha256sum publish/Pica-Library-Android-v40.apk publish/Pica-Library-Android-Preview.apk > publish/SHA256SUMS-Android.txt
          unset ANDROID_PREVIEW_KEYSTORE_PASSWORD
          echo 'ANDROID_V40_SIGNING_AND_PACKAGE=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Android-v40
          path: mobile/android-alpha2/publish/
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '866acade5cd096614a99357ed7c2654bb0a93073'
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Pica-Library-Windows-v0.3.13
          path: publish/windows
      - uses: actions/download-artifact@v4
        with:
          name: Pica-Library-Android-v40
          path: publish/android
      - name: Assemble final release evidence
        run: |
          set -euo pipefail
          test -s publish/windows/Pica-Library-v0.3.13-windows-x64.zip
          test -s publish/windows/Pica-Library-v0.3.13-update.zip
          test -s publish/android/Pica-Library-Android-v40.apk
          test -s publish/android/Pica-Library-Android-Preview.apk
          test -s publish/android/android-update.json
          (cd publish && sha256sum \
            windows/Pica-Library-v0.3.13-windows-x64.zip \
            windows/Pica-Library-v0.3.13-update.zip \
            android/Pica-Library-Android-v40.apk \
            android/android-update.json \
            android/Pica-Library-Android-Preview.cert-sha256 > SHA256SUMS.txt)
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('publish')
          w=json.loads((p/'windows/BUILD_TRANSPARENCY-Windows.json').read_text(encoding='utf-8-sig'))
          a=json.loads((p/'android/BUILD_TRANSPARENCY.json').read_text(encoding='utf-8'))
          out={
              'release':'v0.3.13',
              'sourceSha':'866acade5cd096614a99357ed7c2654bb0a93073',
              'desktop':w,
              'android':a,
              'liveProviderRegistration':'not-exercised; service/network dependent',
          }
          (p/'BUILD_TRANSPARENCY.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cat > publish/RELEASE_NOTES.md <<'EOF'
          Desktop v0.3.13 / Android Preview v40 · Alpha8.13

          - 改进哔咔注册字段校验与失败反馈，避免把网络不可达误判成账号/密码错误。
          - Desktop 对服务端注册失败仅做白名单分类，不直接暴露可能包含敏感内容的原始响应。
          - Android 注册失败不再清空整张表单；对网络中断、频控、服务不可用、明确拒绝和结果不确定分别提示。
          - 明确注册协议本身不要求代理；是否需要系统代理/加速器取决于当前网络能否直连 Pica API。
          - 新注册用户名按 1–16 位字母、数字、点或下划线校验；密码继续采用保守的至少 9 位规则。

          Windows v0.3.12 可在“设置 → 软件更新”直接升级到 v0.3.13。本次增量包只声明支持官方 v0.3.12；更早版本请先升级到 v0.3.12 或使用完整包。
          Android 已安装稳定 Preview 签名版本可通过“连接 → 软件更新”升级到 v40；固定签名证书不变。

          边界：真实第三方 Pica 注册没有在 CI 中自动创建测试账号；不同 ISP/地区的直连可达性仍属于外部服务和网络条件，不宣称所有网络均可免代理注册。
          EOF
      - name: Publish stable v0.3.13 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.3.13 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.3.13 already exists; refusing to overwrite a stable release' >&2
            exit 1
          fi
          gh release create v0.3.13 --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title 'Pica Library v0.3.13 · Registration diagnostics' \
            --notes-file publish/RELEASE_NOTES.md \
            publish/windows/Pica-Library-v0.3.13-windows-x64.zip \
            publish/windows/Pica-Library-v0.3.13-update.zip \
            publish/android/Pica-Library-Android-v40.apk \
            publish/android/android-update.json \
            publish/android/Pica-Library-Android-Preview.cert-sha256 \
            publish/SHA256SUMS.txt \
            publish/BUILD_TRANSPARENCY.json
      - name: Move Android Preview channel and replace OTA assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f android-preview "$RELEASE_TARGET"
          git push origin refs/tags/android-preview --force
          cat > publish/ANDROID_PREVIEW_NOTES.md <<'EOF'
          Android Preview v40 · Alpha8.13 Registration diagnostics

          改进 Pica 注册校验与失败反馈，注册失败保留表单，并明确区分直连网络失败与服务端拒绝。注册仍直接连接官方 Pica API；是否需要系统代理/加速器取决于当前网络可达性。固定 Preview 签名证书保持不变。
          EOF
          gh release edit android-preview --repo "$GITHUB_REPOSITORY" --prerelease \
            --title 'Android Preview v40 · Alpha8.13 Registration diagnostics' \
            --notes-file publish/ANDROID_PREVIEW_NOTES.md
          gh release upload android-preview --repo "$GITHUB_REPOSITORY" \
            publish/android/Pica-Library-Android-Preview.apk \
            publish/android/android-update.json \
            publish/android/Pica-Library-Android-Preview.cert-sha256 \
            publish/android/BUILD_TRANSPARENCY.json \
            --clobber
      - name: Verify live stable and Android update channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.3.13")
          python - "$RELEASE_TARGET" "$release" <<'PY'
          import json,sys
          target,data=sys.argv[1],json.loads(sys.argv[2])
          assert data['tag_name']=='v0.3.13',data
          assert not data['draft'] and not data['prerelease'],data
          names={x['name'] for x in data['assets']}
          required={'Pica-Library-v0.3.13-windows-x64.zip','Pica-Library-v0.3.13-update.zip','Pica-Library-Android-v40.apk','SHA256SUMS.txt','BUILD_TRANSPARENCY.json'}
          assert required <= names,(required-names)
          print('STABLE_RELEASE_ASSETS=PASS')
          PY
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/android-preview" --jq '.object.sha')
          test "$ref" = "$RELEASE_TARGET"
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/android-update.json' \
            -o "$RUNNER_TEMP/live-android-update.json"
          curl -L --fail --retry 5 --retry-delay 2 \
            'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.apk' \
            -o "$RUNNER_TEMP/live-android.apk"
          python - "$RUNNER_TEMP/live-android-update.json" "$RUNNER_TEMP/live-android.apk" <<'PY'
          import hashlib,json,sys
          manifest=json.load(open(sys.argv[1],encoding='utf-8'))
          apk=open(sys.argv[2],'rb').read()
          assert manifest['versionCode']==40,manifest
          assert manifest['versionName']=='0.1.0-alpha8.13-registration-diagnostics',manifest
          assert hashlib.sha256(apk).hexdigest()==manifest['sha256'],manifest
          print('ANDROID_PREVIEW_LIVE_OTA=PASS')
          PY
          echo 'V0_3_13_PUBLICATION=PASS'
