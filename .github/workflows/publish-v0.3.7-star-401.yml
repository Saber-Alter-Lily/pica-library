name: Publish v0.3.7 Star 401 hotfix retry

on:
  push:
    paths:
      - '.github/workflows/publish-v0.3.7-star-401.yml'

permissions:
  actions: read
  contents: write

env:
  RELEASE_TARGET: 'a2582a7bfcdcb89de8d3006992645d161d5683b6'
  EXPECTED_CERT: '64fb87dc7d8bd6bc7b2cec92cc8c83fad3afe8cfb07591a2e53d53cbd3ab2f9d'
  SOURCE_RUN_ID: '34500128644'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Reuse already validated Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: Pica-Library-Windows-v0.3.7-Star401
          path: publish
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34500128644
      - name: Reuse already validated Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: Pica-Library-Android-v34-Star401
          path: publish
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34500128644
      - name: Verify actual anonymous client fallback path
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.error, urllib.request
          headers={
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'Pica-Library-Anonymous-Star-Acceptance'
          }
          assert not any(k.lower()=='authorization' for k in headers)
          account='Saber-Alter-Lily'
          repo='Saber-Alter-Lily/pica-library'
          def request_json(url):
              request=urllib.request.Request(url,headers=headers,method='GET')
              try:
                  with urllib.request.urlopen(request,timeout=20) as response:
                      return response.status,json.load(response)
              except urllib.error.HTTPError as error:
                  body=error.read().decode('utf-8','replace')
                  return error.code,body

          # GitHub currently requires authentication for repository stargazers.
          # The product must therefore survive this exact 401 and continue to
          # the named user's public starred-repositories route.
          primary_status,primary=request_json(
              f'https://api.github.com/repos/{repo}/stargazers?per_page=100&page=1'
          )
          assert primary_status in (200,401),(primary_status,primary)

          found=False
          for page in range(1,101):
              status,repositories=request_json(
                  f'https://api.github.com/users/{account}/starred?per_page=100&page={page}'
              )
              assert status==200,(status,repositories)
              assert isinstance(repositories,list)
              if any(str(item.get('full_name','')).lower()==repo.lower() for item in repositories):
                  found=True
                  break
              if len(repositories)<100:
                  break
          assert found,'anonymous fallback did not confirm Saber-Alter-Lily/pica-library'
          print(f'ANONYMOUS_PRIMARY_STATUS={primary_status}')
          print('ANONYMOUS_USER_STARRED_FALLBACK=PASS')
          print('REAL_CLIENT_401_TO_FALLBACK=PASS')
          print('AUTHORIZATION_HEADER=ABSENT')
          PY
      - name: Validate artifacts and write public metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          p=Path('publish')
          apk=p/'Pica-Library-Android-Preview.apk'
          full=p/'Pica-Library-v0.3.7-windows-x64.zip'
          update=p/'Pica-Library-v0.3.7-update.zip'
          assert apk.is_file() and full.is_file() and update.is_file()
          sha=lambda path:hashlib.sha256(path.read_bytes()).hexdigest()
          with zipfile.ZipFile(update) as archive:
              manifest=json.loads(archive.read('update-manifest.json'))
          assert manifest['sourceVersionRange']=='=0.3.3 || =0.3.4 || =0.3.5 || =0.3.6',manifest
          assert manifest['targetVersion']=='0.3.7' and not manifest['requiresFullInstall'],manifest
          assert manifest['targetSourceSha']==os.environ['RELEASE_TARGET'],manifest
          cert=(p/'Pica-Library-Android-Preview.cert-sha256').read_text().strip().lower()
          assert cert==os.environ['EXPECTED_CERT'],cert
          android_sha,full_sha,update_sha=sha(apk),sha(full),sha(update)
          existing=(p/'SHA256SUMS-v0.3.7.txt').read_text()
          assert f'{full_sha}  Pica-Library-v0.3.7-windows-x64.zip' in existing
          assert f'{update_sha}  Pica-Library-v0.3.7-update.zip' in existing
          android={
            'versionCode':34,
            'versionName':'0.1.0-alpha8.7.1-star-401-hotfix',
            'apkUrl':'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.apk',
            'sha256':android_sha,
            'releaseNotes':'Alpha8.7.1 / v34: fixes real-client GitHub Star HTTP 401 failures by falling through to the public user starred-repositories route. Existing theme and library data is preserved.',
            'minimumSupportedVersionCode':23
          }
          (p/'android-update.json').write_text(json.dumps(android,ensure_ascii=False,indent=2),encoding='utf-8')
          transparency={
            'releaseId':'alpha8.7.1-v34-desktop-v0.3.7',
            'publicSourceCommit':os.environ['RELEASE_TARGET'],
            'sourceBuildRun':os.environ['SOURCE_RUN_ID'],
            'android':{'versionCode':34,'versionName':android['versionName'],'sha256':android_sha,'signingCertificateSha256':cert,'R8':True},
            'windows':{'version':'0.3.7','fullZipSha256':full_sha,'updateZipSha256':update_sha,'sourceVersionRange':manifest['sourceVersionRange'],'buildProvenance':manifest['targetSourceSha']},
            'starAcceptance':{
              'repositoryStargazersAnonymous':'HTTP_401_REQUIRES_AUTHENTICATION_ACCEPTED_AS_PRIMARY_FAILURE',
              'userStarredRepositoriesAnonymous':'PASS',
              'fallbackAfterPrimary401':'PASS',
              'authorizationHeader':'ABSENT',
              'liveStarAccount':'Saber-Alter-Lily'
            }
          }
          (p/'BUILD_TRANSPARENCY.json').write_text(json.dumps(transparency,ensure_ascii=False,indent=2),encoding='utf-8')
          (p/'SHA256SUMS.txt').write_text(f'{full_sha}  Pica-Library-v0.3.7-windows-x64.zip\n{update_sha}  Pica-Library-v0.3.7-update.zip\n',encoding='ascii')
          print('ANDROID_SHA='+android_sha)
          print('WINDOWS_FULL_SHA='+full_sha)
          print('WINDOWS_UPDATE_SHA='+update_sha)
          PY
      - name: Publish Android Preview v34
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit android-preview --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --prerelease --title 'Pica Library Android Preview' --notes 'Alpha8.7.1 / v34: fixes the real-client GitHub Star HTTP 401 failure. GitHub now returns 401 for anonymous repository stargazer-list requests; the client detects that and falls through to the named user public starred-repositories list, which has been anonymously validated against Saber-Alter-Lily. Existing Pica Violet · 星漫, custom themes and library data are preserved.'
          gh release upload android-preview --repo "$GITHUB_REPOSITORY" publish/Pica-Library-Android-Preview.apk publish/android-update.json publish/Pica-Library-Android-Preview.cert-sha256 publish/BUILD_TRANSPARENCY.json --clobber
      - name: Publish Desktop v0.3.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.3.7 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --title 'Pica Library v0.3.7' --notes 'Desktop v0.3.7 / Alpha8.7.1 hotfix: fixes the real-client GitHub Star HTTP 401 failure. GitHub currently requires authentication for the repository stargazers-list endpoint, so Star verification now falls through to the named user public starred-repositories endpoint. The release gate reproduced the primary anonymous HTTP 401 and then anonymously confirmed Saber-Alter-Lily/pica-library through the fallback route with no Authorization header. The incremental update is verified for v0.3.3, v0.3.4, v0.3.5 and v0.3.6.' publish/Pica-Library-v0.3.7-windows-x64.zip publish/Pica-Library-v0.3.7-update.zip publish/SHA256SUMS.txt publish/BUILD_TRANSPARENCY.json
      - name: Verify live update channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" = 'v0.3.7'
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/tags/v0.3.7 --jq .target_commitish)" = "$RELEASE_TARGET"
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/tags/android-preview --jq .target_commitish)" = "$RELEASE_TARGET"
          curl -L --fail --retry 3 --retry-all-errors 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/android-update.json' -o "$RUNNER_TEMP/android-update.json"
          python - "$RUNNER_TEMP/android-update.json" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          assert value['versionCode']==34,value
          assert value['versionName']=='0.1.0-alpha8.7.1-star-401-hotfix',value
          print('LIVE_ANDROID_UPDATE_CHANNEL=PASS')
          PY
          gh release view v0.3.7 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'Pica-Library-v0.3.7-update.zip'
          gh release view android-preview --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'Pica-Library-Android-Preview.apk'
          echo 'LIVE_DESKTOP_UPDATE_CHANNEL=PASS'
