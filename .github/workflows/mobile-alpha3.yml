name: Mobile Alpha 3

on:
  push:
    branches: [android-alpha3-product-shell]
    paths:
      - 'mobile/android-alpha2/**'
      - '.github/workflows/mobile-alpha3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Stage Android source
        run: |
          rm -rf android-app
          cp -R mobile/android-alpha2 android-app
      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Pica-Library-Android-v0.1.0-alpha3.apk
          sha256sum Pica-Library-Android-v0.1.0-alpha3.apk | tee Pica-Library-Android-v0.1.0-alpha3.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Android-v0.1.0-alpha3
          path: |
            Pica-Library-Android-v0.1.0-alpha3.apk
            Pica-Library-Android-v0.1.0-alpha3.sha256
          retention-days: 7
