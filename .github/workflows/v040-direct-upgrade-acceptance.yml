name: v0.4 Direct Upgrade Acceptance

on:
  pull_request:
    paths:
      - 'src/library/database.ts'
      - 'src/storage/sqlite/migrations.ts'
      - 'src/update/**'
      - 'test/unit/update-release-assets.test.ts'
      - 'scripts/build-local-update-package.ts'
      - 'mobile/android-alpha2/app/build.gradle'
      - 'test/integration/v040-upgrade-preservation.test.ts'
      - 'test/integration/migrations.test.ts'
      - 'test/unit/update-manager*.test.ts'
      - 'test/unit/update-package-builder.test.ts'
      - 'docs/V040_TO_NEXT_RELEASE_ACCEPTANCE.md'
      - '.github/workflows/v040-direct-upgrade-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-data-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Verify v0.4 schema migration and updater compatibility contracts
        run: |
          set -euo pipefail
          pnpm type:check
          pnpm exec vitest run \
            test/integration/v040-upgrade-preservation.test.ts \
            test/integration/migrations.test.ts \
            test/unit/database-schema-authority.test.ts \
            test/unit/update-compatibility.test.ts \
            test/unit/update-manager.test.ts \
            test/unit/update-manager-release-fallback.test.ts \
            test/unit/update-package-builder.test.ts \
            test/unit/update-release-assets.test.ts
          git diff --check

  public-windows-baseline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download checksum-pinned public v0.4.0 Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/v0.4.0/Pica-Library-v0.4.0-windows-x64.zip'
          $path = Join-Path $env:RUNNER_TEMP 'Pica-Library-v0.4.0-windows-x64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $uri -OutFile $path
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
          if ($hash -ne '1e22df88d067c34152e1a94008fbb4c378c543fc41450768e01c25c105e698d0') {
            throw "Public v0.4.0 Windows checksum mismatch: $hash"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($path)
          try {
            $entries = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
            foreach ($required in @('Pica Library.exe','runtime/node.exe')) {
              if (-not ($entries -contains $required)) {
                throw "Public v0.4.0 package missing required entry: $required"
              }
            }
            $forbidden = $entries | Where-Object {
              $_ -match '^(data|cache|downloads?|logs?|config)(/|$)' -or
              $_ -match '\.(db|sqlite)(-|$)'
            }
            if ($forbidden) {
              throw "Public application package unexpectedly contains mutable user data: $($forbidden -join ', ')"
            }
          } finally {
            $zip.Dispose()
          }

  android-production-identity-precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify public v0.4.0 Android production identity
        run: |
          set -euo pipefail
          old_apk="$RUNNER_TEMP/Pica-Library-Android-v42.apk"
          cert_file="$RUNNER_TEMP/Pica-Library-Android-Preview.cert-sha256"
          curl -fL 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/v0.4.0/Pica-Library-Android-v42.apk' -o "$old_apk"
          curl -fL 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/v0.4.0/Pica-Library-Android-Preview.cert-sha256' -o "$cert_file"
          printf '%s  %s\n' '718dfc81484627045a3d5209a79e705f87b6a3ae9be737721299956fc4a77ed2' "$old_apk" | sha256sum -c -

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$old_apk" > "$RUNNER_TEMP/v040-badging.txt"
          grep -q "package: name='com.picalibrary.android'" "$RUNNER_TEMP/v040-badging.txt"
          grep -q "versionCode='42'" "$RUNNER_TEMP/v040-badging.txt"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$old_apk" > "$RUNNER_TEMP/v040-cert.txt"
          observed="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/v040-cert.txt" | tr '[:upper:]' '[:lower:]' | head -n1)"
          expected="$(tr -d '\r\n ' < "$cert_file" | tr '[:upper:]' '[:lower:]')"
          test -n "$observed"
          test "$observed" = "$expected"

      - name: Build a production-identity upgrade metadata candidate
        working-directory: mobile/android-alpha2
        env:
          PICA_ANDROID_VERSION_CODE: '43'
          PICA_ANDROID_VERSION_NAME: '0.5.0-upgrade-gate'
        run: |
          set -euo pipefail
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon
          apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/next-badging.txt"
          grep -q "package: name='com.picalibrary.android'" "$RUNNER_TEMP/next-badging.txt"
          grep -q "versionCode='43'" "$RUNNER_TEMP/next-badging.txt"

      - name: Record remaining signed-OTA release blocker
        run: |
          {
            echo '## Android v0.4 → next stable upgrade status'
            echo
            echo '- PASS: production package name remains com.picalibrary.android.'
            echo '- PASS: release build metadata can use a versionCode greater than public v0.4.0 (42).'
            echo '- PASS: public v0.4.0 certificate is independently pinned and verified.'
            echo '- BLOCKER BEFORE FORMAL RELEASE: build the actual signed RC with the same production signing identity, then perform an in-place install over v0.4.0 and verify local-state preservation.'
          } >> "$GITHUB_STEP_SUMMARY"
