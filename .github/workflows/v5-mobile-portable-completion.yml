name: Complete Recommendation V5 mobile portable loop

on:
  push:
    branches: [feature/recommendation-v5-portable-policy]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: stage V5 mobile portable completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recommendation-v5-portable-policy
          fetch-depth: 0
      - name: Complete portable mobile recommendation loop
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def write(path, content):
              Path(path).write_text(textwrap.dedent(content).lstrip('\n'), encoding='utf-8')

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one exact match, got {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex match, got {count}')
              p.write_text(updated, encoding='utf-8')

          write('mobile/android-alpha2/app/src/main/java/com/picalibrary/android/RecommendationPolicyStore.java', r'''
          package com.picalibrary.android;

          import android.content.Context;
