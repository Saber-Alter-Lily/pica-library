name: Validate and apply E-H development patch

on:
  push:
    branches:
      - feature/eh-provider-v1
    paths:
      - 'scripts/dev/apply-eh-v3-ui.mjs'
      - '.github/workflows/eh-dev-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eh-provider-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply bounded cross-source V3 and UI patch
        run: node scripts/dev/apply-eh-v3-ui.mjs
      - name: Validate desktop, web and cross-source contracts
        run: |
          set -euo pipefail
          pnpm type:check
          pnpm web:check
          pnpm test
          pnpm build
      - name: Commit validated V3 patch to development branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/provider-service.ts src/library/service.ts src/library/database.ts web/app.js mobile/android-alpha2/app/src/main/java/com/picalibrary/android/NativeRecommendationEngine.java test/unit/eh-cross-source-v3.test.ts
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat: add bounded E-H recall to recommendation V3'
          git push origin HEAD:feature/eh-provider-v1
