name: Verify README poster assets

on:
  push:
    paths:
      - 'README.md'
      - 'README.en.md'
      - 'docs/*guide*.md'
      - 'docs/assets/desktop-overview-v0311-final.jpg'
      - 'docs/assets/android-overview-v38-final.jpg'
      - '.github/workflows/verify-readme-jpegs.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Decode final README posters and verify references
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              Path('docs/assets/desktop-overview-v0311-final.jpg'): (700, 989),
              Path('docs/assets/android-overview-v38-final.jpg'): (700, 746),
          }
          for path, size in expected.items():
              data = path.read_bytes()
              assert data[:3] == b'\xff\xd8\xff', (path, data[:12].hex())
              with Image.open(path) as im:
                  im.load()
                  print(path, im.format, im.size, len(data))
                  assert im.format == 'JPEG', (path, im.format)
                  assert im.size == size, (path, im.size, size)

          docs = [
              Path('README.md'), Path('README.en.md'),
              Path('docs/desktop-guide.zh-CN.md'), Path('docs/android-guide.zh-CN.md'),
              Path('docs/desktop-guide.en.md'), Path('docs/android-guide.en.md'),
          ]
          for path in docs:
              text = path.read_text(encoding='utf-8')
              assert 'desktop-overview.webp' not in text
              assert 'android-overview.webp' not in text
              assert 'desktop-overview.jpg' not in text
              assert 'android-overview.jpg' not in text
              if 'desktop' in path.name.lower() or path.name.startswith('README'):
                  assert 'desktop-overview-v0311-final.jpg' in text, path
              if 'android' in path.name.lower() or path.name.startswith('README'):
                  assert 'android-overview-v38-final.jpg' in text, path
          print('README_POSTER_DECODE=PASS')
          PY
