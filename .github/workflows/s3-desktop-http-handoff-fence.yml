name: S3 Desktop HTTP helper handoff fence (unpublished)

on:
  push:
    branches:
      - codex/s3-desktop-http-handoff-fence-20261029
    paths:
      - '.github/workflows/s3-desktop-http-handoff-fence.yml'
      - 'src/desktop/update-http-fence.ts'
      - 'src/runtime/resource-coordinator.ts'
      - 'test/unit/runtime-resource-coordinator.test.ts'
      - 'src/desktop/update-quiescence.ts'
      - 'src/desktop/update-command.ts'
      - 'src/desktop/main.ts'
      - 'src/library/server.ts'
      - 'test/unit/desktop-http-handoff-fence.test.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s3-desktop-http-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-desktop-http-safety:
    if: github.repository == 'Saber-Alter-Lily/pica-library'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Typecheck current Desktop/HTTP/upgrade contracts
        run: pnpm type:check
      - name: Real local HTTP CSRF, in-flight work, rollback and historical gates
        run: pnpm exec vitest run test/unit/desktop-http-handoff-fence.test.ts test/unit/desktop-update-quiescence.test.ts test/unit/desktop-update-command.test.ts test/unit/desktop-instance-ownership.test.ts test/unit/runtime-resource-coordinator.test.ts test/unit/server.test.ts test/unit/legacy-profile-preflight.test.ts
