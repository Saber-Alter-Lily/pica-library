name: Publish v0.4.1 Stable

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v041-publish.yml'

permissions:
  contents: read

env:
  VERSION: '0.4.1'
  TAG: 'v0.4.1'
  DESKTOP_BASE_SHA256: '1e22df88d067c34152e1a94008fbb4c378c543fc41450768e01c25c105e698d0'
  ANDROID_VERSION_CODE: '43'
  EXPECTED_CERT: '64fb87dc7d8bd6bc7b2cec92cc8c83fad3afe8cfb07591a2e53d53cbd3ab2f9d'

jobs:
  windows:
    if: github.event.repository.private == false && github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PICA_LIBRARY_BUILD_PROVENANCE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Verify release identity
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          if($package.version -ne $env:VERSION){ throw "main is not v$($env:VERSION): $($package.version)" }
      - name: Run Desktop product gates
        shell: pwsh
        run: |
          pnpm type:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm web:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download and verify official v0.4.0 base
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\release-base | Out-Null
          $base='artifacts\release-base\Pica-Library-v0.4.0-windows-x64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/v0.4.0/Pica-Library-v0.4.0-windows-x64.zip' -OutFile $base
          $actual=(Get-FileHash -Algorithm SHA256 $base).Hash.ToLowerInvariant()
          if($actual -ne $env:DESKTOP_BASE_SHA256){ throw "v0.4.0 base SHA-256 mismatch: $actual" }
      - name: Build formal Windows package
        shell: pwsh
        run: |
          pnpm build:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify formal Windows package
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $full=[IO.Compression.ZipFile]::OpenRead("artifacts\Pica-Library-v$($env:VERSION)-windows-x64.zip")
          try {
            $names=@($full.Entries | ForEach-Object { $_.FullName.Replace('\\','/') })
            if($names -contains 'TEST_BUILD.txt'){ throw 'formal package contains TEST_BUILD.txt' }
            if($names | Where-Object { $_ -match '(?i)recommendation-v5-beta|visual-qc-beta|work-identity-review-beta|pica library dev|dev-pr' }){ throw 'formal package contains beta/dev artifact names' }
            if(-not ($names -contains 'Pica Library.exe')){ throw 'formal launcher missing' }
            $source=$full.GetEntry('SOURCE_SHA.txt')
            if(-not $source){ throw 'SOURCE_SHA.txt missing from formal full package' }
            $reader=New-Object IO.StreamReader($source.Open())
            try { $sourceSha=$reader.ReadToEnd().Trim() } finally { $reader.Dispose() }
            if($sourceSha -ne $env:GITHUB_SHA){ throw "full package source SHA mismatch: $sourceSha" }
          } finally { $full.Dispose() }
      - name: Verify v0.4.0 full application replacement
        shell: pwsh
        run: |
          $appRoot=Join-Path $env:RUNNER_TEMP 'pica-publish-replace'
          $targetRoot=Join-Path $env:RUNNER_TEMP 'pica-publish-target'
          $stateRoot=Join-Path $env:RUNNER_TEMP 'pica-publish-state'
          foreach($p in @($appRoot,$targetRoot,$stateRoot)){ Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $p; New-Item -ItemType Directory -Force -Path $p | Out-Null }
          Expand-Archive -LiteralPath 'artifacts\release-base\Pica-Library-v0.4.0-windows-x64.zip' -DestinationPath $appRoot
          Expand-Archive -LiteralPath "artifacts\Pica-Library-v$($env:VERSION)-windows-x64.zip" -DestinationPath $targetRoot
          New-Item -ItemType Directory -Force -Path (Join-Path $stateRoot 'data'),(Join-Path $stateRoot 'runtime-state') | Out-Null
          Set-Content -LiteralPath (Join-Path $stateRoot 'data\upgrade-sentinel.txt') -Value 'keep-user-data-v041' -Encoding ascii
          Get-ChildItem -LiteralPath $appRoot -Force | Remove-Item -Recurse -Force
          Get-ChildItem -LiteralPath $targetRoot -Force | ForEach-Object { Copy-Item -Recurse -Force -LiteralPath $_.FullName -Destination $appRoot }
          if((Get-Content -Raw -LiteralPath (Join-Path $stateRoot 'data\upgrade-sentinel.txt')).Trim() -ne 'keep-user-data-v041'){ throw 'user-data sentinel changed' }
          $env:PICA_LIBRARY_DESKTOP_HOME=$stateRoot
          $process=Start-Process -FilePath (Join-Path $appRoot 'runtime\node.exe') -ArgumentList (Join-Path $appRoot 'app\desktop.js') -PassThru -WindowStyle Hidden
          $instanceFile=Join-Path $stateRoot 'runtime-state\instance.json'
          $deadline=(Get-Date).AddSeconds(30)
          while((Get-Date) -lt $deadline -and -not (Test-Path -LiteralPath $instanceFile)){ Start-Sleep -Milliseconds 250 }
          if(-not (Test-Path -LiteralPath $instanceFile)){ Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue; throw 'v0.4.1 desktop did not start after replacement' }
          $instance=Get-Content -Raw -LiteralPath $instanceFile | ConvertFrom-Json
          $status=Invoke-RestMethod -Uri "$($instance.url)/api/v1/status" -TimeoutSec 5
          $caps=Invoke-RestMethod -Uri "$($instance.url)/api/v1/capabilities" -TimeoutSec 5
          if($status.version -ne $env:VERSION){ throw "status version mismatch: $($status.version)" }
          if($caps.appVersion -ne $env:VERSION){ throw "capabilities version mismatch: $($caps.appVersion)" }
          if([int]$caps.databaseSchemaVersion -ne 13){ throw "unexpected database schema: $($caps.databaseSchemaVersion)" }
          Stop-Process -Id ([int]$instance.pid) -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
      - name: Prepare Windows publication assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish | Out-Null
          $full="artifacts\Pica-Library-v$($env:VERSION)-windows-x64.zip"
          Copy-Item $full "publish\Pica-Library-v$($env:VERSION)-windows-x64.zip"
          $hash=(Get-FileHash -Algorithm SHA256 $full).Hash.ToLowerInvariant()
          [ordered]@{
            release=$env:TAG
            sourceSha=$env:GITHUB_SHA
            asset="Pica-Library-v$($env:VERSION)-windows-x64.zip"
            sha256=$hash
            baseVersion='0.4.0'
            baseSha256=$env:DESKTOP_BASE_SHA256
            upgradeMode='FULL_APPLICATION_REPLACEMENT'
            userDataHome='separate-and-preserved'
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 publish\BUILD_TRANSPARENCY-Windows.json
      - uses: actions/upload-artifact@v4
        with:
          name: v041-windows-publish
          path: publish/
          retention-days: 1
          if-no-files-found: error

  android:
    if: github.event.repository.private == false && github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and build signed v43
        working-directory: mobile/android-alpha2
        env:
          ANDROID_PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
          ANDROID_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_PREVIEW_KEYSTORE_B64:-}"
          test -n "${ANDROID_PREVIEW_KEYSTORE_PASSWORD:-}"
          gradle :app:testDebugUnitTest :app:lintDebug --no-daemon
          curl -fL --retry 3 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/v0.4.0/Pica-Library-Android-v42.apk' -o "$RUNNER_TEMP/Pica-Library-Android-v42.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/Pica-Library-Android-v42.apk" > "$RUNNER_TEMP/v42-cert.txt"
          oldcert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/v42-cert.txt" | head -1 | tr 'A-F' 'a-f')
          test "$oldcert" = "$EXPECTED_CERT"
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/pica-signing-XXXXXXXX")
          export ANDROID_PREVIEW_KEYSTORE_PATH="$signing_dir/preview.jks"
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$ANDROID_PREVIEW_KEYSTORE_B64" | base64 --decode > "$ANDROID_PREVIEW_KEYSTORE_PATH"
          unset ANDROID_PREVIEW_KEYSTORE_B64
          gradle :app:assembleRelease --no-daemon
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/v43-package.txt"
          grep -q "package: name='com.picalibrary.android' versionCode='43' versionName='0.4.1'" "$RUNNER_TEMP/v43-package.txt"
          grep -q "application-label:'Pica Library'" "$RUNNER_TEMP/v43-package.txt"
          if grep -qi "Pica Library Dev" "$RUNNER_TEMP/v43-package.txt"; then exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/v43-cert.txt"
          newcert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/v43-cert.txt" | head -1 | tr 'A-F' 'a-f')
          test "$newcert" = "$EXPECTED_CERT"
          test "$newcert" = "$oldcert"
          mkdir -p publish
          cp "$apk" publish/Pica-Library-Android-v43.apk
          cp "$apk" publish/Pica-Library-Android-Preview.apk
          sha=$(sha256sum "$apk" | awk '{print $1}')
          printf '%s\n' "$newcert" > publish/Pica-Library-Android-Preview.cert-sha256
          python - "$sha" "$GITHUB_SHA" <<'PY'
          import json,sys
          sha,source=sys.argv[1:]
          manifest={
            "versionCode":43,
            "versionName":"0.4.1",
            "minimumSupportedVersionCode":42,
            "apkUrl":"https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.apk",
            "sha256":sha,
            "releaseNotes":"v0.4.1：统一移动端四页签切换，优化推荐画像与批次切换性能，加入可开关画风推荐，并完善阅读历史与界面层级。"
          }
          with open("publish/android-update.json","w",encoding="utf-8") as f:
              json.dump(manifest,f,ensure_ascii=False,indent=2)
          transparency={
            "release":"v0.4.1",
            "versionCode":43,
            "versionName":"0.4.1",
            "sourceSha":source,
            "apkSha256":sha,
            "signerCertificateSha256":"64fb87dc7d8bd6bc7b2cec92cc8c83fad3afe8cfb07591a2e53d53cbd3ab2f9d",
            "upgradeFromVersionCode":42,
            "channel":"android-preview",
            "validation":["unit-tests","lint","R8-release-build","same-package-id","higher-version-code","same-signing-certificate","formal-label"]
          }
          with open("publish/BUILD_TRANSPARENCY-Android.json","w",encoding="utf-8") as f:
              json.dump(transparency,f,ensure_ascii=False,indent=2)
          PY
          unset ANDROID_PREVIEW_KEYSTORE_PASSWORD
      - uses: actions/upload-artifact@v4
        with:
          name: v041-android-publish
          path: mobile/android-alpha2/publish/
          retention-days: 1
          if-no-files-found: error

  publish:
    if: github.event.repository.private == false && github.repository == 'Saber-Alter-Lily/pica-library'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          path: publish
          merge-multiple: true
      - name: Assemble release metadata
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          test -s "publish/Pica-Library-v$VERSION-windows-x64.zip"
          test -s "publish/Pica-Library-Android-v43.apk"
          test -s "publish/Pica-Library-Android-Preview.apk"
          test -s publish/android-update.json
          test -s publish/BUILD_TRANSPARENCY-Windows.json
          test -s publish/BUILD_TRANSPARENCY-Android.json
          test -s publish/Pica-Library-Android-Preview.cert-sha256
          python - <<'PY'
          import json
          with open("publish/BUILD_TRANSPARENCY-Windows.json",encoding="utf-8-sig") as f:
              win=json.load(f)
          with open("publish/BUILD_TRANSPARENCY-Android.json",encoding="utf-8") as f:
              android=json.load(f)
          combined={
            "release":"v0.4.1",
            "sourceSha":win["sourceSha"],
            "windows":win,
            "android":android,
            "windowsUpgradeFrom":"v0.4.0",
            "windowsUpgradeMode":"FULL_APPLICATION_REPLACEMENT",
            "genericLegacyUpdateZipPublished":False
          }
          with open("publish/BUILD_TRANSPARENCY.json","w",encoding="utf-8") as f:
              json.dump(combined,f,ensure_ascii=False,indent=2)
          PY
          (
            cd publish
            sha256sum               "Pica-Library-v$VERSION-windows-x64.zip"               "Pica-Library-Android-v43.apk"               android-update.json               Pica-Library-Android-Preview.cert-sha256               BUILD_TRANSPARENCY.json > SHA256SUMS.txt
          )
          cat > publish/release-notes.md <<'EOF'
          Pica Library v0.4.1 focuses on recommendation quality controls, mobile responsiveness, and final UI consistency.

          - Android now keeps Library / Recommendations / Online / Settings in one top-level shell.
          - Recommendation profile and adjustment loading moves off the main thread; hot-path policy, evidence, catalog, and portable-candidate reads are cached.
          - Batch switching reuses the current frozen recommendation cycle instead of rerunning the full recommendation pipeline.
          - Visual/style recommendation is an optional module with light / standard / strong influence; disabling it leaves normal recommendation unchanged.
          - Reading history, next-chapter navigation, and mobile disclosure hierarchy are refined.
          - Android upgrades in place from official v42 to v43 with the same package ID and signing certificate.

          Windows v0.4.0 users: v0.4.1 is a full application replacement because the current schema/app boundary is beyond the legacy incremental updater contract. Close Pica Library, replace only the application files with the v0.4.1 Windows package, and keep %LOCALAPPDATA%\Pica Library unchanged. Do not uninstall or delete the data directory.

          No legacy generic Pica-Library-v0.4.1-update.zip is published, so v0.4.0 will not mistake an incompatible incremental package for a safe update.
          EOF
          cat > publish/android-preview-notes.md <<'EOF'
          Android Preview v43 · Pica Library v0.4.1

          Same official package identity and signing certificate as v42. This channel now serves the v0.4.1 Android build with unified top-level navigation, recommendation performance improvements, optional Visual/style influence, and final UI hierarchy cleanup.
          EOF
      - name: Create draft stable release
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to overwrite an existing stable release." >&2
            exit 1
          fi
          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Pica Library v0.4.1 · Recommendation & Mobile Polish"             --notes-file publish/release-notes.md             --draft             "publish/Pica-Library-v$VERSION-windows-x64.zip"             publish/Pica-Library-Android-v43.apk             publish/android-update.json             publish/BUILD_TRANSPARENCY.json             publish/Pica-Library-Android-Preview.cert-sha256             publish/SHA256SUMS.txt
      - name: Refresh Android update channel
        run: |
          set -euo pipefail
          gh release upload android-preview             --repo "$GITHUB_REPOSITORY"             --clobber             publish/Pica-Library-Android-Preview.apk             publish/android-update.json             publish/Pica-Library-Android-Preview.cert-sha256             publish/BUILD_TRANSPARENCY-Android.json
          gh release edit android-preview             --repo "$GITHUB_REPOSITORY"             --title "Android Preview v43 · Pica Library v0.4.1"             --notes-file publish/android-preview-notes.md             --prerelease
      - name: Publish stable release
        run: |
          set -euo pipefail
          gh release edit "$TAG"             --repo "$GITHUB_REPOSITORY"             --draft=false             --latest
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false"
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = "false"
          for name in             "Pica-Library-v$VERSION-windows-x64.zip"             "Pica-Library-Android-v43.apk"             android-update.json             BUILD_TRANSPARENCY.json             Pica-Library-Android-Preview.cert-sha256             SHA256SUMS.txt; do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$name"
          done
          for name in Pica-Library-Android-Preview.apk android-update.json Pica-Library-Android-Preview.cert-sha256 BUILD_TRANSPARENCY-Android.json; do
            gh release view android-preview --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$name"
          done
