name: Apply v0.4 web parity backend patch

on:
  push:
    branches: [feature/eh-provider-v1]
    paths:
      - '.github/workflows/v040-web-parity-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eh-provider-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply deterministic source patch
        run: node scripts/apply-v040-web-parity-patch.mjs
      - name: Commit patched sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/providers/eh-provider.ts src/library/server.ts
          git diff --cached --quiet && { echo 'No patch changes'; exit 1; }
          git commit -m 'feat(web): add native E-H browse modes and filters'
          git push origin HEAD:feature/eh-provider-v1
