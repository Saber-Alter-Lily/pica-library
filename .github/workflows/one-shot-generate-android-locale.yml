name: One-shot generate Android locale catalog

on:
  push:
    branches:
      - dev/localization-onboarding-v1
    paths:
      - .github/workflows/one-shot-generate-android-locale.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/localization-onboarding-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate shared locale catalog
        run: node scripts/build-android-literal-catalog.mjs
      - name: Commit generated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/android-alpha2/app/src/main/assets/locales/shared-literals.json
          git diff --cached --quiet && exit 0
          git commit -m "dev(android-i18n): generate shared literal catalog"
          git push origin HEAD:dev/localization-onboarding-v1
