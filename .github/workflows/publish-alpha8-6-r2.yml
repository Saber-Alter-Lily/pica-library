name: Publish Alpha8.6 R2

on:
  push:
    paths:
      - '.github/workflows/publish-alpha8-6-r2.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_REPO: 'Saber-Alter-Lily/pica-library'
      RELEASE_TARGET: '9b9ff099cd4edb44613ced649d038d20b433fc92'
      ANDROID_ARTIFACT_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-0e10-81f5-bad8-72b608cf9474/raw?se=2026-09-10T13%3A16%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=3e90ba6b-1f35-5219-b40f-a8f4260c82cb&skoid=80e81ea6-3c08-46f9-bd84-b87176742bcd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T12%3A48%3A23Z&ske=2026-09-11T12%3A48%3A23Z&sks=b&skv=2026-02-06&sig=3eew%2B9ViU5sYDcM%2BBEX9TLXqJF8QHh3i4V/VZnojIYw%3D'
      WINDOWS_ARTIFACT_URL: 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-79e8-81f6-9d3e-7b473c002e4d/raw?se=2026-09-10T13%3A16%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=86fd9b49-9e0a-5e76-b29c-0e70ff19a17d&skoid=80e81ea6-3c08-46f9-bd84-b87176742bcd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T03%3A28%3A37Z&ske=2026-09-11T03%3A28%3A37Z&sks=b&skv=2026-02-06&sig=fgaZ0C8NSXElbf3WJrYKzhcpaK8dPn/wDRqZ93jfku4%3D'
      EXPECTED_CERT: '64fb87dc7d8bd6bc7b2cec92cc8c83fad3afe8cfb07591a2e53d53cbd3ab2f9d'
    steps:
      - name: Download artifacts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/a" "$RUNNER_TEMP/w" publish
          curl -L --fail --retry 3 "$ANDROID_ARTIFACT_URL" -o "$RUNNER_TEMP/a.zip"
          curl -L --fail --retry 3 "$WINDOWS_ARTIFACT_URL" -o "$RUNNER_TEMP/w.zip"
          unzip -q "$RUNNER_TEMP/a.zip" -d "$RUNNER_TEMP/a"
          unzip -q "$RUNNER_TEMP/w.zip" -d "$RUNNER_TEMP/w"
          cp "$(find "$RUNNER_TEMP/w" -name 'Pica-Library-v0.3.4-windows-x64.zip' -print -quit)" publish/
          cp "$(find "$RUNNER_TEMP/w" -name 'Pica-Library-v0.3.4-update.zip' -print -quit)" publish/
          cp "$(find "$RUNNER_TEMP/w" -name 'SHA256SUMS-v0.3.4.txt' -print -quit)" publish/SHA256SUMS.txt
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'build-tools;35.0.0'
      - name: Sign Android
        env:
          PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          INPUT=$(find "$RUNNER_TEMP/a" -name 'Pica-Library-Android-v31-Alpha8.6-UNSIGNED.apk' -print -quit)
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$INPUT" | grep -q "versionCode='31' versionName='0.1.0-alpha8.6-star-personalization'"
          KEYSTORE="$RUNNER_TEMP/pica-preview.jks"
          printf '%s' "$PREVIEW_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-key-alias pica-preview --ks-pass "pass:$PREVIEW_KEYSTORE_PASSWORD" --key-pass "pass:$PREVIEW_KEYSTORE_PASSWORD" --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false --out publish/Pica-Library-Android-Preview.apk "$INPUT"
          CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs publish/Pica-Library-Android-Preview.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr A-F a-f)
          test "$CERT" = "$EXPECTED_CERT"
          printf '%s\n' "$CERT" > publish/Pica-Library-Android-Preview.cert-sha256
          rm -f "$KEYSTORE"
      - name: Metadata
        run: |
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          p=Path('publish');apk=p/'Pica-Library-Android-Preview.apk';full=p/'Pica-Library-v0.3.4-windows-x64.zip';upd=p/'Pica-Library-v0.3.4-update.zip'
          sha=lambda x:hashlib.sha256(x.read_bytes()).hexdigest()
          with zipfile.ZipFile(upd) as z:m=json.loads(z.read('update-manifest.json'))
          assert m['sourceVersionRange']=='=0.3.1 || =0.3.2 || =0.3.3';assert 'sourceSha' not in m;assert m['targetVersion']=='0.3.4';assert m['targetSourceSha']==os.environ['RELEASE_TARGET'];assert not m['requiresFullInstall']
          ah,fh,uh=sha(apk),sha(full),sha(upd)
          sums=(p/'SHA256SUMS.txt').read_text();assert fh in sums and uh in sums
          a={'versionCode':31,'versionName':'0.1.0-alpha8.6-star-personalization','apkUrl':'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.apk','sha256':ah,'releaseNotes':'Alpha8.6: current source is open again. GitHub Star unlocks personalization, including Pica Violet · 星漫 and Theme Studio themes synced from Desktop. Adds a fixed anime brand icon, fixes Desktop header overlap and double file-picker launches, and uses compact Recommendation refresh / Online account header actions.','minimumSupportedVersionCode':23}
          (p/'android-update.json').write_text(json.dumps(a,ensure_ascii=False,indent=2),encoding='utf-8')
          t={'releaseId':'alpha8.6-v31-desktop-v0.3.4','sourcePolicy':'current-source-open','publicSourceCommit':os.environ['RELEASE_TARGET'],'android':{'versionCode':31,'versionName':a['versionName'],'sha256':ah,'signingCertificateSha256':os.environ['EXPECTED_CERT'],'R8':True},'windows':{'version':'0.3.4','fullZipSha256':fh,'updateZipSha256':uh,'sourceVersionRange':m['sourceVersionRange'],'buildProvenance':m['targetSourceSha']},'personalization':{'gate':'github-star','defaultTheme':'Pica Violet · 星漫','dataOnly':True}}
          (p/'BUILD_TRANSPARENCY.json').write_text(json.dumps(t,ensure_ascii=False,indent=2),encoding='utf-8')
          print('ANDROID_SHA='+ah);print('FULL_SHA='+fh);print('UPDATE_SHA='+uh)
          PY
      - name: Publish Android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit android-preview --repo "$GH_REPO" --prerelease --title 'Pica Library Android Preview' --notes 'Alpha8.6 / v31: GitHub Star personalization, Pica Violet · 星漫, unified anime app icon, compact mobile header actions, Theme Studio sync and current-source open-source return.'
          gh release upload android-preview --repo "$GH_REPO" publish/Pica-Library-Android-Preview.apk publish/android-update.json publish/Pica-Library-Android-Preview.cert-sha256 publish/BUILD_TRANSPARENCY.json --clobber
      - name: Publish Desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Desktop v0.3.4 / Alpha8.6: current source is open again. GitHub Star unlocks personalization independently of donations, with Pica Violet · 星漫 immediately available and Theme Studio themes syncing to paired Android. Fixes top-header collisions and duplicate file-picker launches while retaining resilient update fallback. The update package supports v0.3.1, v0.3.2 and v0.3.3.'
          gh release create v0.3.4 --repo "$GH_REPO" --target "$RELEASE_TARGET" --title 'Pica Library v0.3.4' --notes "$NOTES" --latest || gh release edit v0.3.4 --repo "$GH_REPO" --title 'Pica Library v0.3.4' --notes "$NOTES" --latest
          gh release upload v0.3.4 --repo "$GH_REPO" publish/Pica-Library-v0.3.4-windows-x64.zip publish/Pica-Library-v0.3.4-update.zip publish/SHA256SUMS.txt publish/BUILD_TRANSPARENCY.json --clobber
      - name: Verify
        run: |
          set -euo pipefail
          sleep 3
          curl -L --fail 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/android-update.json' -o /tmp/a.json
          curl -L --fail 'https://api.github.com/repos/Saber-Alter-Lily/pica-library/releases/tags/android-preview' -o /tmp/ar.json
          curl -L --fail 'https://api.github.com/repos/Saber-Alter-Lily/pica-library/releases/latest' -o /tmp/w.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/a.json'));ar=json.load(open('/tmp/ar.json'));w=json.load(open('/tmp/w.json'))
          assert a['versionCode']==31 and a['versionName']=='0.1.0-alpha8.6-star-personalization'
          aa={x['name']:x for x in ar['assets']};assert aa['Pica-Library-Android-Preview.apk']['digest']=='sha256:'+a['sha256']
          assert w['tag_name']=='v0.3.4' and not w['draft'] and not w['prerelease']
          wa={x['name']:x for x in w['assets']};assert {'Pica-Library-v0.3.4-windows-x64.zip','Pica-Library-v0.3.4-update.zip','SHA256SUMS.txt','BUILD_TRANSPARENCY.json'}<=set(wa)
          print('LIVE PASS',a['sha256'],wa['Pica-Library-v0.3.4-windows-x64.zip']['digest'],wa['Pica-Library-v0.3.4-update.zip']['digest'])
          PY
