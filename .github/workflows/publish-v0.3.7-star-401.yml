name: Publish v0.3.7 and Android v34 Star 401 hotfix

on:
  push:
    paths:
      - '.github/workflows/publish-v0.3.7-star-401.yml'

permissions:
  contents: write

env:
  RELEASE_TARGET: 'a2582a7bfcdcb89de8d3006992645d161d5683b6'
  EXPECTED_CERT: '64fb87dc7d8bd6bc7b2cec92cc8c83fad3afe8cfb07591a2e53d53cbd3ab2f9d'

jobs:
  windows:
    runs-on: windows-latest
    env:
      PICA_LIBRARY_BUILD_PROVENANCE: 'a2582a7bfcdcb89de8d3006992645d161d5683b6'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'a2582a7bfcdcb89de8d3006992645d161d5683b6'
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Re-run v0.3.7 Web/Desktop gates
        shell: pwsh
        run: |
          pnpm web:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run test/unit/alpha8-7-1-star-401-hotfix.test.ts test/unit/alpha8-7-settings-star-contract.test.ts test/unit/alpha8-6-star-personalization-contract.test.ts test/unit/personalization-theme-studio.test.ts test/unit/update-hotfix-contract.test.ts test/unit/update-manager-release-fallback.test.ts test/unit/update-manager.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download accepted v0.3.3-v0.3.6 bases
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $items=@(
            @('0.3.3','fa7e2e282e471bc2e9ee0a0c4c9d2616c97f9383d5b034e019833b8e5ec62e0f'),
            @('0.3.4','6c52f076ae251e11089ed14fcfd1d9be3897c7220c97dfe025eafa75f50a233b'),
            @('0.3.5','876ee53b16ff76ab590de7c7f4c8c0d3bf2052c03edd3480b1a1ee243148209d'),
            @('0.3.6','cb948ab0fe1c796ea19da66367c2f69b2e525549e5139281648cddcb209f5bd0')
          )
          foreach($item in $items){
            $v=$item[0];$expected=$item[1];$file="artifacts/Pica-Library-v$v-windows-x64.zip"
            Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/Saber-Alter-Lily/pica-library/releases/download/v$v/Pica-Library-v$v-windows-x64.zip" -OutFile $file
            $actual=(Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            if($actual -ne $expected){ throw "base $v hash mismatch: $actual" }
          }
      - name: Build Desktop v0.3.7 full package
        shell: pwsh
        run: pnpm build:windows
      - name: Build universal v0.3.3-v0.3.6 update and prove convergence
        shell: pwsh
        run: |
          pnpm exec tsx scripts/build-local-update-package.ts artifacts/Pica-Library-v0.3.6-windows-x64.zip artifacts/Pica-Library-v0.3.7-windows-x64.zip artifacts/Pica-Library-v0.3.7-update.zip
          @'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('artifacts')
          versions=('0.3.3','0.3.4','0.3.5','0.3.6')
          bases={v:root/f'Pica-Library-v{v}-windows-x64.zip' for v in versions}
          target=root/'Pica-Library-v0.3.7-windows-x64.zip'
          update=root/'Pica-Library-v0.3.7-update.zip'
          def entries(p):
              with zipfile.ZipFile(p) as z:
                  return {i.filename:z.read(i.filename) for i in z.infolist() if not i.is_dir()}
          b={v:entries(p) for v,p in bases.items()}; t=entries(target)
          changed=sorted(name for name,data in t.items() if any(name not in b[v] or b[v][name]!=data for v in versions))
          deleted=sorted({name for values in b.values() for name in values if name not in t})
          assert 'Pica Library.exe' not in changed, 'launcher replacement would require full install'
          assert 'app/updater.js' not in changed, 'updater self replacement would require full install'
          with zipfile.ZipFile(update) as z:m=json.loads(z.read('update-manifest.json'))
          m['sourceVersionRange']='=0.3.3 || =0.3.4 || =0.3.5 || =0.3.6';m.pop('sourceSha',None)
          m['targetVersion']='0.3.7';m['targetSourceSha']=t['SOURCE_SHA.txt'].decode().strip();m['requiresFullInstall']=False
          m['deletions']=deleted
          m['files']=[{'path':name,'sha256':hashlib.sha256(t[name]).hexdigest(),'size':len(t[name])} for name in changed]
          tmp=update.with_suffix('.tmp.zip')
          with zipfile.ZipFile(tmp,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              z.writestr('update-manifest.json',json.dumps(m,ensure_ascii=False,indent=2).encode())
              for name in changed:z.writestr(name,t[name])
          tmp.replace(update)
          assert m['targetSourceSha']=='a2582a7bfcdcb89de8d3006992645d161d5683b6'
          for v,values in b.items():
              got=dict(values)
              for name in deleted:got.pop(name,None)
              for name in changed:got[name]=t[name]
              assert got.keys()==t.keys(),(v,sorted(got.keys()-t.keys())[:10],sorted(t.keys()-got.keys())[:10])
              mism=[name for name in t if got[name]!=t[name]]
              assert not mism,(v,mism[:10])
              print(f'{v} -> 0.3.7 exact tree PASS')
          print('changed files',len(changed),'deletions',len(deleted))
          '@ | python -
          $full=(Get-FileHash -Algorithm SHA256 artifacts/Pica-Library-v0.3.7-windows-x64.zip).Hash.ToLowerInvariant()
          $update=(Get-FileHash -Algorithm SHA256 artifacts/Pica-Library-v0.3.7-update.zip).Hash.ToLowerInvariant()
          "$full  Pica-Library-v0.3.7-windows-x64.zip`n$update  Pica-Library-v0.3.7-update.zip" | Set-Content -Encoding ascii artifacts/SHA256SUMS-v0.3.7.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Windows-v0.3.7-Star401
          path: |
            artifacts/Pica-Library-v0.3.7-windows-x64.zip
            artifacts/Pica-Library-v0.3.7-update.zip
            artifacts/SHA256SUMS-v0.3.7.txt
          retention-days: 3

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'a2582a7bfcdcb89de8d3006992645d161d5683b6'
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test lint and build Android v34
        working-directory: mobile/android-alpha2
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
      - name: Sign and verify Android v34
        env:
          PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          INPUT='mobile/android-alpha2/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$INPUT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$INPUT" | grep -q "package: name='com.picalibrary.android' versionCode='34' versionName='0.1.0-alpha8.7.1-star-401-hotfix'"
          mkdir -p release-artifacts
          KEYSTORE="$RUNNER_TEMP/pica-preview.jks"
          printf '%s' "$PREVIEW_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias pica-preview \
            --ks-pass "pass:$PREVIEW_KEYSTORE_PASSWORD" --key-pass "pass:$PREVIEW_KEYSTORE_PASSWORD" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false \
            --out release-artifacts/Pica-Library-Android-Preview.apk "$INPUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release-artifacts/Pica-Library-Android-Preview.apk
          CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release-artifacts/Pica-Library-Android-Preview.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')
          test "$CERT" = "$EXPECTED_CERT"
          printf '%s\n' "$CERT" > release-artifacts/Pica-Library-Android-Preview.cert-sha256
          sha256sum release-artifacts/Pica-Library-Android-Preview.apk > release-artifacts/ANDROID-SHA256.txt
          rm -f "$KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Android-v34-Star401
          path: release-artifacts/
          retention-days: 3

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pica-Library-Windows-v0.3.7-Star401
          path: publish
      - uses: actions/download-artifact@v4
        with:
          name: Pica-Library-Android-v34-Star401
          path: publish
      - name: Anonymous GitHub Star acceptance with no Authorization
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          headers={
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'Pica-Library-Anonymous-Star-Acceptance'
          }
          assert not any(k.lower()=='authorization' for k in headers)
          def get(url):
              request=urllib.request.Request(url,headers=headers,method='GET')
              with urllib.request.urlopen(request,timeout=20) as response:
                  assert response.status==200,(url,response.status)
                  return json.load(response)
          account='Saber-Alter-Lily'
          repo='Saber-Alter-Lily/pica-library'
          found_repo_route=False
          for page in range(1,101):
              users=get(f'https://api.github.com/repos/{repo}/stargazers?per_page=100&page={page}')
              if any(str(x.get('login','')).lower()==account.lower() for x in users):
                  found_repo_route=True;break
              if len(users)<100:break
          assert found_repo_route,'anonymous repository stargazer route did not confirm Saber-Alter-Lily'
          found_user_route=False
          for page in range(1,101):
              repos=get(f'https://api.github.com/users/{account}/starred?per_page=100&page={page}')
              if any(str(x.get('full_name','')).lower()==repo.lower() for x in repos):
                  found_user_route=True;break
              if len(repos)<100:break
          assert found_user_route,'anonymous user starred-repositories route did not confirm pica-library'
          print('ANONYMOUS_REPO_STARGAZERS=PASS')
          print('ANONYMOUS_USER_STARRED=PASS')
          print('AUTHORIZATION_HEADER=ABSENT')
          PY
      - name: Validate artifacts and write update metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          p=Path('publish');apk=p/'Pica-Library-Android-Preview.apk';full=p/'Pica-Library-v0.3.7-windows-x64.zip';update=p/'Pica-Library-v0.3.7-update.zip'
          sha=lambda q:hashlib.sha256(q.read_bytes()).hexdigest()
          assert apk.is_file() and full.is_file() and update.is_file()
          with zipfile.ZipFile(update) as z:m=json.loads(z.read('update-manifest.json'))
          assert m['sourceVersionRange']=='=0.3.3 || =0.3.4 || =0.3.5 || =0.3.6',m
          assert 'sourceSha' not in m and m['targetVersion']=='0.3.7' and not m['requiresFullInstall'],m
          assert m['targetSourceSha']==os.environ['RELEASE_TARGET'],m
          cert=(p/'Pica-Library-Android-Preview.cert-sha256').read_text().strip().lower();assert cert==os.environ['EXPECTED_CERT']
          ah,fh,uh=sha(apk),sha(full),sha(update)
          sums=(p/'SHA256SUMS-v0.3.7.txt').read_text();assert f'{fh}  Pica-Library-v0.3.7-windows-x64.zip' in sums;assert f'{uh}  Pica-Library-v0.3.7-update.zip' in sums
          android={
            'versionCode':34,
            'versionName':'0.1.0-alpha8.7.1-star-401-hotfix',
            'apkUrl':'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.apk',
            'sha256':ah,
            'releaseNotes':'Alpha8.7.1 / v34: fixes real-client GitHub Star HTTP 401 failures with anonymous dual-route verification and safe proxy-to-direct fallback. Existing theme and library data is preserved.',
            'minimumSupportedVersionCode':23
          }
          (p/'android-update.json').write_text(json.dumps(android,ensure_ascii=False,indent=2),encoding='utf-8')
          transparency={
            'releaseId':'alpha8.7.1-v34-desktop-v0.3.7',
            'publicSourceCommit':os.environ['RELEASE_TARGET'],
            'android':{'versionCode':34,'versionName':android['versionName'],'sha256':ah,'signingCertificateSha256':cert,'R8':True},
            'windows':{'version':'0.3.7','fullZipSha256':fh,'updateZipSha256':uh,'sourceVersionRange':m['sourceVersionRange'],'buildProvenance':m['targetSourceSha']},
            'acceptance':{
              'anonymousRepositoryStargazers':'PASS',
              'anonymousUserStarredRepositories':'PASS',
              'authorizationHeader':'ABSENT',
              'liveStarAccount':'Saber-Alter-Lily'
            },
            'fixes':['real-client Star HTTP 401 fallback','dual public Star evidence routes','anonymous release acceptance parity']
          }
          (p/'BUILD_TRANSPARENCY.json').write_text(json.dumps(transparency,ensure_ascii=False,indent=2),encoding='utf-8')
          (p/'SHA256SUMS.txt').write_text(f'{fh}  Pica-Library-v0.3.7-windows-x64.zip\n{uh}  Pica-Library-v0.3.7-update.zip\n',encoding='ascii')
          print('ANDROID_SHA='+ah);print('WINDOWS_FULL_SHA='+fh);print('WINDOWS_UPDATE_SHA='+uh)
          PY
      - name: Publish Android Preview v34
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit android-preview --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --prerelease --title 'Pica Library Android Preview' --notes 'Alpha8.7.1 / v34: fixes the real-client GitHub Star HTTP 401 path. Verification now uses two independent anonymous public GitHub routes, and Desktop safely retries public GitHub reads directly when the saved proxy returns an auth/rate-limit response. Existing Pica Violet · 星漫, custom themes and library data are preserved.'
          gh release upload android-preview --repo "$GITHUB_REPOSITORY" publish/Pica-Library-Android-Preview.apk publish/android-update.json publish/Pica-Library-Android-Preview.cert-sha256 publish/BUILD_TRANSPARENCY.json --clobber
      - name: Publish Desktop v0.3.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.3.7 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --title 'Pica Library v0.3.7' --notes 'Desktop v0.3.7 / Alpha8.7.1 hotfix: fixes GitHub Star verification HTTP 401 seen in the real client. Public GitHub reads may safely fall back from the configured proxy to direct transport, and Star status is confirmed through both repository stargazers and the named user starred-repositories list. Release acceptance now uses anonymous requests with no Authorization header. The incremental update is verified for v0.3.3, v0.3.4, v0.3.5 and v0.3.6.' publish/Pica-Library-v0.3.7-windows-x64.zip publish/Pica-Library-v0.3.7-update.zip publish/SHA256SUMS.txt publish/BUILD_TRANSPARENCY.json
      - name: Verify live update channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)" = 'v0.3.7'
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/tags/v0.3.7 --jq .target_commitish)" = "$RELEASE_TARGET"
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/tags/android-preview --jq .target_commitish)" = "$RELEASE_TARGET"
          curl -L --fail --retry 3 --retry-all-errors 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/android-update.json' -o "$RUNNER_TEMP/android-update.json"
          python - "$RUNNER_TEMP/android-update.json" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding='utf-8'))
          assert value['versionCode']==34,value
          assert value['versionName']=='0.1.0-alpha8.7.1-star-401-hotfix',value
          print('LIVE_ANDROID_UPDATE_CHANNEL=PASS')
          PY
          gh release view v0.3.7 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'Pica-Library-v0.3.7-update.zip'
          gh release view android-preview --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'Pica-Library-Android-Preview.apk'
          echo 'LIVE_DESKTOP_UPDATE_CHANNEL=PASS'
