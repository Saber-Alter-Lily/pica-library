plugins {
    id 'com.android.application'
}

def previewKeystorePath = System.getenv('ANDROID_PREVIEW_KEYSTORE_PATH')
def previewKeystorePassword = System.getenv('ANDROID_PREVIEW_KEYSTORE_PASSWORD')
def previewSigningConfigured = previewKeystorePath != null && !previewKeystorePath.isBlank() &&
        previewKeystorePassword != null && !previewKeystorePassword.isBlank()
def buildVersionCode = Integer.parseInt(System.getenv('PICA_ANDROID_VERSION_CODE') ?: '55')
def buildVersionName = System.getenv('PICA_ANDROID_VERSION_NAME') ?: '0.5.0'
// Each disposable manual-QA snapshot has a distinct Android identity. Never
// replace an earlier Dev install with a different ephemeral Debug key.
def isolatedQaSuffix = System.getenv('PICA_ANDROID_QA_PACKAGE_SUFFIX') ?: ''
if (isolatedQaSuffix && !(isolatedQaSuffix ==~ /^\.s1qa[1-9][0-9]{0,2}$/)) {
    throw new GradleException('Invalid S1 QA application suffix')
}
def debugAppSuffix = isolatedQaSuffix ? isolatedQaSuffix : '.dev'
def debugAppLabel = isolatedQaSuffix ? "Pica Library S1 QA${isolatedQaSuffix.substring(5)}" : 'Pica Library Dev'
def debugPairScheme = isolatedQaSuffix ? "picalibrary-${isolatedQaSuffix.substring(1)}" : 'picalibrary'

android {
    namespace 'com.picalibrary.android'
    compileSdk 35
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.java {
        srcDir '../../../source-jvm/src/main/java'
        exclude '**/JmProtocolMain.java'
    }
    // One tracked fixture is consumed by both Vitest and the Android JSON adapter tests.
    sourceSets.test.resources.srcDir '../../../test/fixtures/tag-policy'

    defaultConfig {
        applicationId 'com.picalibrary.android'
        minSdk 28
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [
                appLabel  : 'Pica Library',
                pairScheme: 'picalibrary'
        ]
    }

    signingConfigs {
        if (previewSigningConfigured) {
            preview {
                storeFile file(previewKeystorePath)
                storePassword previewKeystorePassword
                keyAlias 'pica-preview'
                keyPassword previewKeystorePassword
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    buildTypes {
        debug {
            // Side-by-side manual QA build. It must never replace the formal app.
            applicationIdSuffix debugAppSuffix
            versionNameSuffix '-dev-pr35'
            debuggable true
            manifestPlaceholders = [
                    appLabel  : debugAppLabel,
                    pairScheme: debugPairScheme
            ]
            // CI candidate builds reuse the fixed official signing identity when configured so future Dev APKs
            // can upgrade the previous Dev installation without shipping a private key.
            if (previewSigningConfigured) {
                signingConfig signingConfigs.preview
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [
                    appLabel  : 'Pica Library',
                    pairScheme: 'picalibrary'
            ]
            if (previewSigningConfigured) {
                signingConfig signingConfigs.preview
            }
        }
        benchmark {
            initWith release
            // Release-like code path, signed locally so Macrobenchmark can install it on QA devices.
            signingConfig signingConfigs.debug
            debuggable false
            matchingFallbacks = ['release']
            manifestPlaceholders = [
                    appLabel  : 'Pica Library Benchmark',
                    pairScheme: 'picalibrary'
            ]
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation('io.github.jukomu:jmcomic-core:v1.1.12') {
        exclude group: 'io.github.darkxanter', module: 'webp-imageio'
    }
    implementation 'io.github.jukomu:jmcomic-android-support:v1.1.12'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.work:work-runtime:2.12.0'
    testImplementation 'androidx.work:work-testing:2.12.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

// Android uses the SDK's native image processor, not the desktop ImageIO SPI/native binaries.
configurations.configureEach {
    exclude group: 'io.github.darkxanter', module: 'webp-imageio'
}

// Compile the decision seam without Android, SDKs or any other application classes.
// Recognition remains in GestureDetector / ScaleGestureDetector; this is not a new touch framework.
def gestureBoundary = tasks.register('compileReaderGestureBoundary', JavaCompile) {
    source fileTree('src/main/java/com/picalibrary/android/reader/gestures') { include '**/*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('reader-gesture-boundary')
    options.release = 17
    options.encoding = 'UTF-8'
}
def tagBoundary = tasks.register('compileTagPolicyBoundary', JavaCompile) {
    source fileTree('src/main/java/com/picalibrary/android/tags') { include '**/*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('tag-policy-boundary')
    options.release = 17
    options.encoding = 'UTF-8'
}
tasks.configureEach {
    if (name == 'testDebugUnitTest') dependsOn gestureBoundary, tagBoundary
}

// Local ingestion is a storage boundary, not another provider or Reader implementation.
def localImportBoundary = tasks.register('compileLocalImportBoundary', JavaCompile) {
    source fileTree('src/main/java/com/picalibrary/android/local') { include '**/*.java' }
    classpath = files()
    destinationDirectory = layout.buildDirectory.dir('local-import-boundary')
    options.release = 17
    options.encoding = 'UTF-8'
}
tasks.configureEach { if (name == 'testDebugUnitTest') dependsOn localImportBoundary }
