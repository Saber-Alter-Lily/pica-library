name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-and-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Validate Web and Desktop
        run: |
          set -euo pipefail
          pnpm type:check
          pnpm web:check
          pnpm test
          pnpm build

      - name: Run real-browser Web smoke
        run: bash scripts/run-web-browser-smoke.sh
      - name: Upload Web smoke diagnostics
        if: failure() && github.event.repository.private == false
        uses: actions/upload-artifact@v4
        with:
          name: web-browser-smoke-${{ github.run_id }}-${{ github.job }}
          path: test-results/
          retention-days: 1
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and build Android
        working-directory: mobile/android-alpha2
        timeout-minutes: 28
        # Keep every test enabled; bound hangs and preserve verbose per-test progress.
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --stacktrace --info --max-workers=2
      - name: Assemble opt-in local-only Android draft and inspect its manifest
        if: ${{ github.head_ref == 'codex/s3-android-local-only-draft-20261030' || github.head_ref == 'codex/s3-android-reader-view-module-20261030' || github.head_ref == 'codex/s3-android-reader-image-pipeline-20261030' || github.head_ref == 'codex/s3-android-reader-chapter-contract-20261030' || github.head_ref == 'codex/s3-android-reader-progress-module-20261030' }}
        working-directory: mobile/android-alpha2
        timeout-minutes: 10
        env:
          PICA_ANDROID_LOCAL_ONLY_DRAFT: '1'
        run: |
          gradle :app:assembleDebug --no-daemon --max-workers=2
          apk=app/build/outputs/apk/debug/app-debug.apk
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$apk" | grep -F "package: name='com.picalibrary.android.localdraft'"
          "$aapt" dump badging "$apk" | grep -F "launchable-activity: name='com.picalibrary.android.DisclaimerActivity'"
          if "$aapt" dump permissions "$apk" | grep -E 'android.permission.(INTERNET|CAMERA|REQUEST_INSTALL_PACKAGES)'; then
            echo "Local-only APK still requests a forbidden runtime capability"
            exit 1
          fi
      - name: Build and inspect physically source-free Android local QA APK
        working-directory: mobile/android-alpha2
        timeout-minutes: 10
        run: |
          set -euo pipefail
          gradle :local-app:assembleDebug --no-daemon --max-workers=2
          apk=local-app/build/outputs/apk/debug/local-app-debug.apk
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$apk" | grep -F "package: name='com.picalibrary.android.localcore.qa'"
          "$aapt" dump badging "$apk" | grep -F "launchable-activity: name='com.picalibrary.android.LocalLibraryActivity'"
          if "$aapt" dump permissions "$apk" | grep -E 'android.permission.(INTERNET|CAMERA|REQUEST_INSTALL_PACKAGES|MANAGE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE)'; then
            echo "Source-free APK requested a forbidden permission"
            exit 1
          fi
          APK_PATH="$apk" python3 - <<'PY'
          import os, re, zipfile
          apk = os.environ["APK_PATH"]
          forbidden = (
              b"Lcom/picalibrary/android/Pica",
              b"Lcom/picalibrary/android/Eh",
              b"Lcom/picalibrary/android/Jm",
              b"Lcom/picalibrary/android/Bridge",
              b"Lcom/picalibrary/android/Host",
              b"Lcom/picalibrary/android/OnlineReader",
              b"Lcom/picalibrary/android/RemoteReader",
              b"Lcom/picalibrary/android/ReaderSourceFactory",
              b"Lio/github/jukomu/",
          )
          with zipfile.ZipFile(apk) as archive:
              dexes = [name for name in archive.namelist()
                       if re.fullmatch(r"classes[0-9]*\.dex", name)]
              if not dexes:
                  raise SystemExit("APK has no compiled DEX")
              for name in dexes:
                  contents = archive.read(name)
                  hits = [item.decode() for item in forbidden if item in contents]
                  if hits:
                      raise SystemExit(f"Source SDK in {name}: {hits}")
          print(f"PASS: standalone APK contains {len(dexes)} checked DEX files, no source SDK")
          PY
      - name: Upload unsigned local-core QA APK (not a Release)
        if: success() && github.event.repository.private == false && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: source-free-local-qa-${{ github.run_id }}
          path: mobile/android-alpha2/local-app/build/outputs/apk/debug/local-app-debug.apk
          retention-days: 2
          if-no-files-found: error
      - name: Preserve actual Android JUnit results even on timeout
        if: always() && github.event.repository.private == false
        uses: actions/upload-artifact@v4
        with:
          name: android-junit-${{ github.run_id }}-${{ github.job }}
          path: mobile/android-alpha2/app/build/test-results/testDebugUnitTest/
          retention-days: 1
          if-no-files-found: warn
