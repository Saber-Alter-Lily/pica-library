name: Experimental Windows ARM64 Package

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'packaging/windows/Launcher.cs'
      - 'scripts/build-windows-arm64-experimental.ps1'
      - 'scripts/test-windows-arm64-experimental.ps1'
      - 'scripts/test-windows-arm64-preview-replacement.ps1'
      - 'rollup.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/windows-arm64-experimental.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'web/**'
      - 'packaging/windows/Launcher.cs'
      - 'scripts/build-windows-arm64-experimental.ps1'
      - 'scripts/test-windows-arm64-experimental.ps1'
      - 'scripts/test-windows-arm64-preview-replacement.ps1'
      - 'rollup.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/windows-arm64-experimental.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-arm64-experimental:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert native Windows ARM64 runner
        shell: pwsh
        run: |
          if (-not $IsWindows) { throw 'Windows runner required' }
          if ([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture -ne [System.Runtime.InteropServices.Architecture]::Arm64) {
            throw "Expected ARM64 runner, got $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false

      - run: pnpm install --frozen-lockfile

      - name: Build experimental Windows ARM64 package
        shell: pwsh
        run: ./scripts/build-windows-arm64-experimental.ps1

      - name: Build first accepted Windows ARM64 preview baseline
        shell: pwsh
        env:
          BASE_SHA: c820c3f8ccba70dfb09e81602fe2116f992323ed
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'pica-windows-arm64-preview-baseline'
          if (Test-Path -LiteralPath $baseline) { Remove-Item -Recurse -Force -LiteralPath $baseline }
          git worktree add --detach $baseline $env:BASE_SHA
          try {
            New-Item -ItemType Directory -Force -Path (Join-Path $baseline 'artifacts\cache') | Out-Null
            if (Test-Path -LiteralPath 'artifacts\cache') {
              Copy-Item -Path 'artifacts\cache\*' -Destination (Join-Path $baseline 'artifacts\cache') -Recurse -Force -ErrorAction SilentlyContinue
            }
            Push-Location $baseline
            try {
              pnpm install --frozen-lockfile
              ./scripts/build-windows-arm64-experimental.ps1
            } finally {
              Pop-Location
            }
            $baselineArchive = @(Get-ChildItem (Join-Path $baseline 'artifacts') -File -Filter 'Pica-Library-*-windows-arm64-experimental.zip')[0]
            if (-not $baselineArchive) { throw 'Windows ARM64 baseline archive was not built' }
            Copy-Item -LiteralPath $baselineArchive.FullName -Destination 'artifacts\Pica-Library-windows-arm64-preview-baseline.zip'
          } finally {
            git worktree remove --force $baseline
          }

      - name: Run Windows ARM64 packaged acceptance
        timeout-minutes: 6
        shell: pwsh
        run: |
          $archive = @(Get-ChildItem artifacts -File -Filter 'Pica-Library-*-windows-arm64-experimental.zip')[0]
          if (-not $archive) { throw 'Windows ARM64 experimental archive not found' }
          ./scripts/test-windows-arm64-experimental.ps1 -Archive $archive.FullName

      - name: Run Windows ARM64 preview replacement and rollback acceptance
        timeout-minutes: 6
        shell: pwsh
        run: |
          $baseline = Get-Item 'artifacts\Pica-Library-windows-arm64-preview-baseline.zip'
          $candidate = @(Get-ChildItem artifacts -File -Filter 'Pica-Library-*-windows-arm64-experimental.zip')[0]
          if (-not $candidate) { throw 'Windows ARM64 candidate archive not found' }
          ./scripts/test-windows-arm64-preview-replacement.ps1 -BaselineArchive $baseline.FullName -CandidateArchive $candidate.FullName

      - name: Upload experimental Windows ARM64 artifact
        if: github.event.repository.private == false
        uses: actions/upload-artifact@v4
        with:
          name: pica-library-windows-arm64-experimental-${{ github.sha }}
          path: |
            artifacts/Pica-Library-*-windows-arm64-experimental.zip
            artifacts/WINDOWS-ARM64-EXPERIMENTAL-SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error
