name: Android Alpha APK
on:
  push:
    branches: [android-v0.1-alpha]
    paths:
      - 'mobile/Pica-Library-Android-v0.1.0-alpha1-source.zip'
      - '.github/workflows/android-alpha.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Expand Android source
        run: |
          rm -rf android-app
          mkdir android-app
          unzip -q mobile/Pica-Library-Android-v0.1.0-alpha1-source.zip -d android-app
      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Pica-Library-Android-v0.1.0-alpha1.apk
      - name: SHA256
        run: sha256sum Pica-Library-Android-v0.1.0-alpha1.apk | tee Pica-Library-Android-v0.1.0-alpha1.sha256
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Android-v0.1.0-alpha1
          path: |
            Pica-Library-Android-v0.1.0-alpha1.apk
            Pica-Library-Android-v0.1.0-alpha1.sha256
