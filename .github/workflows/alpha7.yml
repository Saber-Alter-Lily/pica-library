name: Alpha 7 Cloud Mobile

on:
  push:
    branches: [alpha7-cloud-mobile]
    paths:
      - 'src/remote-storage/**'
      - 'src/desktop/**'
      - 'src/mobile/**'
      - 'web/**'
      - 'mobile/android-alpha2/**'
      - 'scripts/apply-alpha7-integration.mjs'
      - 'scripts/apply-mobile-alpha2-patch.mjs'
      - 'scripts/apply-mobile-recommendation-cache-patch.mjs'
      - '.github/workflows/alpha7.yml'
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Publish/replace the single Android Preview release asset'
        required: false
        default: false
        type: boolean

concurrency:
  group: alpha7-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Alpha7 integration
        run: node scripts/apply-alpha7-integration.mjs
      - name: Alpha7 source type check
        run: >-
          pnpm exec tsc --noEmit --strict --module ESNext --target ESNext
          --lib ES2023,DOM --moduleResolution Bundler --esModuleInterop
          --allowSyntheticDefaultImports --skipLibCheck
          src/desktop/main.ts src/remote-storage/config.ts
          src/remote-storage/desktop-manager.ts src/remote-storage/factory.ts
          src/remote-storage/layout.ts src/remote-storage/sync-service.ts
          src/remote-storage/types.ts src/remote-storage/webdav.ts
      - name: Web syntax check
        run: pnpm web:check && node --check web/alpha7-cloud.js
      - name: Mobile Bridge tests
        run: pnpm exec vitest run test/unit/mobile-bridge.test.ts

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and build Alpha7 Android
        working-directory: mobile/android-alpha2
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Prepare Alpha7 Android artifact
        run: |
          mkdir -p artifacts
          cp mobile/android-alpha2/app/build/outputs/apk/debug/app-debug.apk artifacts/Pica-Library-Android-v0.1.0-alpha7-cloud.apk
          sha256sum artifacts/Pica-Library-Android-v0.1.0-alpha7-cloud.apk > artifacts/Pica-Library-Android-v0.1.0-alpha7-cloud.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Android-Alpha7-Cloud
          path: |
            artifacts/Pica-Library-Android-v0.1.0-alpha7-cloud.apk
            artifacts/Pica-Library-Android-v0.1.0-alpha7-cloud.sha256
          retention-days: 7
      - name: Prepare moving Android Preview release
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-preview]')) || (github.event_name == 'workflow_dispatch' && inputs.publish_preview) }}
        run: |
          cp artifacts/Pica-Library-Android-v0.1.0-alpha7-cloud.apk artifacts/Pica-Library-Android-Preview.apk
          SHA=$(sha256sum artifacts/Pica-Library-Android-Preview.apk | awk '{print $1}')
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' mobile/android-alpha2/app/build.gradle | head -1)
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" mobile/android-alpha2/app/build.gradle | head -1)
          python - "$VERSION_CODE" "$VERSION_NAME" "$SHA" <<'PY'
          import json, sys
          code = int(sys.argv[1])
          name = sys.argv[2]
          sha = sys.argv[3]
          value = {
              "versionCode": code,
              "versionName": name,
              "apkUrl": "https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.apk",
              "sha256": sha,
              "releaseNotes": "Android Preview generated from the current alpha7-cloud-mobile integration branch.",
              "minimumSupportedVersionCode": 1,
          }
          with open("artifacts/android-update.json", "w", encoding="utf-8") as f:
              json.dump(value, f, ensure_ascii=False, indent=2)
          PY
      - name: Publish one moving Android Preview release
        if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-preview]')) || (github.event_name == 'workflow_dispatch' && inputs.publish_preview) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-preview >/dev/null 2>&1 || gh release create android-preview --prerelease --title "Pica Library Android Preview" --notes "Single moving preview channel for in-app updates."
          gh release upload android-preview artifacts/Pica-Library-Android-Preview.apk artifacts/android-update.json --clobber

  windows:
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Alpha7 integration
        run: node scripts/apply-alpha7-integration.mjs
      - name: Restore accepted launcher base
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $url = 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/v0.2.0/Pica-Library-v0.2.0-windows-x64.zip'
          $file = 'artifacts\Pica-Library-v0.2.0-windows-x64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $file
          $sha = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '219d853bad6c0193adfcae2837c54f3bc72644aab664d1dae55c55259682d75e') { throw "launcher base SHA mismatch: $sha" }
      - run: pnpm build:windows
      - name: Prepare Alpha7 Windows artifact
        shell: powershell
        run: |
          Copy-Item artifacts\Pica-Library-v0.3.0-windows-x64.zip artifacts\Pica-Library-v0.3.0-alpha7-cloud-windows-x64.zip
          $sha = (Get-FileHash artifacts\Pica-Library-v0.3.0-alpha7-cloud-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Pica-Library-v0.3.0-alpha7-cloud-windows-x64.zip" | Set-Content artifacts\Pica-Library-v0.3.0-alpha7-cloud-windows-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Windows-Alpha7-Cloud
          path: |
            artifacts/Pica-Library-v0.3.0-alpha7-cloud-windows-x64.zip
            artifacts/Pica-Library-v0.3.0-alpha7-cloud-windows-x64.sha256
          retention-days: 7
