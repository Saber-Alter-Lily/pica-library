name: Apply v0.3.7 Star 401 hotfix

on:
  push:
    branches: [hotfix/v0.3.7-star-401]
    paths:
      - '.github/workflows/apply-v037-star-401.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.3.7-star-401
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply deterministic hotfix transforms
        run: node scripts/apply-v037-star-401-hotfix.mjs
      - name: Verify transformed source contracts
        run: |
          set -euo pipefail
          grep -q '"version": "0.3.7"' package.json
          grep -q 'versionCode 34' mobile/android-alpha2/app/build.gradle
          grep -q "versionName '0.1.0-alpha8.7.1-star-401-hotfix'" mobile/android-alpha2/app/build.gradle
          grep -q 'users/.*starred?per_page=100' src/services/personalization-service.ts
          grep -q "'0.3.7'" scripts/build-windows-package.ps1
          git diff --check
      - name: Commit transformed source
        run: |
          set -euo pipefail
          git config user.name 'Saber-Alter-Lily'
          git config user.email '3178088154@qq.com'
          git add src/services/personalization-service.ts package.json \
            mobile/android-alpha2/app/build.gradle scripts/build-windows-package.ps1 \
            README.md README.en.md
          git diff --cached --quiet && { echo 'No transform changes'; exit 1; }
          git commit -m 'fix: add dual-route Star verification and bump v0.3.7'
          git push origin HEAD:hotfix/v0.3.7-star-401
