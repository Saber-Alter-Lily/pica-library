name: Publish v0.3.5 and Android v32 Hotfix

on:
  push:
    paths:
      - '.github/workflows/publish-v0.3.5-hotfix.yml'

permissions:
  contents: write

env:
  RELEASE_TARGET: '014950b43daa5b6aff295d3a7291d7c5090bbb22'
  EXPECTED_CERT: '64fb87dc7d8bd6bc7b2cec92cc8c83fad3afe8cfb07591a2e53d53cbd3ab2f9d'

jobs:
  windows:
    runs-on: windows-latest
    env:
      PICA_LIBRARY_BUILD_PROVENANCE: '014950b43daa5b6aff295d3a7291d7c5090bbb22'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '014950b43daa5b6aff295d3a7291d7c5090bbb22'
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Re-run hotfix Web/Desktop gates
        shell: pwsh
        run: |
          pnpm web:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run test/unit/update-hotfix-contract.test.ts test/unit/update-manager-release-fallback.test.ts test/unit/update-manager.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download accepted v0.3.3 and v0.3.4 bases
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $items=@(
            @('0.3.3','fa7e2e282e471bc2e9ee0a0c4c9d2616c97f9383d5b034e019833b8e5ec62e0f'),
            @('0.3.4','6c52f076ae251e11089ed14fcfd1d9be3897c7220c97dfe025eafa75f50a233b')
          )
          foreach($item in $items){
            $v=$item[0];$expected=$item[1];$file="artifacts/Pica-Library-v$v-windows-x64.zip"
            Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/Saber-Alter-Lily/pica-library/releases/download/v$v/Pica-Library-v$v-windows-x64.zip" -OutFile $file
            $actual=(Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            if($actual -ne $expected){ throw "base $v hash mismatch: $actual" }
          }
      - name: Build Desktop v0.3.5 full package
        shell: pwsh
        run: pnpm build:windows
      - name: Build universal v0.3.3-v0.3.4 update and prove convergence
        shell: pwsh
        run: |
          pnpm exec tsx scripts/build-local-update-package.ts artifacts/Pica-Library-v0.3.3-windows-x64.zip artifacts/Pica-Library-v0.3.5-windows-x64.zip artifacts/Pica-Library-v0.3.5-update.zip
          @'
          import hashlib,json,zipfile,tempfile
          from pathlib import Path
          root=Path('artifacts')
          bases={v:root/f'Pica-Library-v{v}-windows-x64.zip' for v in ('0.3.3','0.3.4')}
          target=root/'Pica-Library-v0.3.5-windows-x64.zip'
          update=root/'Pica-Library-v0.3.5-update.zip'
          def entries(p):
              with zipfile.ZipFile(p) as z:
                  return {i.filename:z.read(i.filename) for i in z.infolist() if not i.is_dir()}
          b={v:entries(p) for v,p in bases.items()}; t=entries(target)
          with zipfile.ZipFile(update) as z:
              m=json.loads(z.read('update-manifest.json'))
          changed=sorted(name for name,data in t.items() if any(name not in b[v] or b[v][name]!=data for v in b))
          deleted=sorted({name for values in b.values() for name in values if name not in t})
          assert 'Pica Library.exe' not in changed, 'launcher replacement would require full install'
          assert 'app/updater.js' not in changed, 'updater self replacement would require full install'
          m['sourceVersionRange']='=0.3.3 || =0.3.4';m.pop('sourceSha',None)
          m['targetVersion']='0.3.5';m['targetSourceSha']=t['SOURCE_SHA.txt'].decode().strip();m['requiresFullInstall']=False
          m['deletions']=deleted
          m['files']=[{'path':name,'sha256':hashlib.sha256(t[name]).hexdigest(),'size':len(t[name])} for name in changed]
          tmp=update.with_suffix('.tmp.zip')
          with zipfile.ZipFile(tmp,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              z.writestr('update-manifest.json',json.dumps(m,ensure_ascii=False,indent=2).encode())
              for name in changed:z.writestr(name,t[name])
          tmp.replace(update)
          assert m['targetSourceSha']=='014950b43daa5b6aff295d3a7291d7c5090bbb22'
          for v,values in b.items():
              got=dict(values)
              for name in deleted:got.pop(name,None)
              for name in changed:got[name]=t[name]
              assert got.keys()==t.keys(),(v,sorted(got.keys()-t.keys())[:10],sorted(t.keys()-got.keys())[:10])
              mism=[name for name in t if got[name]!=t[name]]
              assert not mism,(v,mism[:10])
              print(f'{v} -> 0.3.5 exact tree PASS')
          print('changed files',len(changed),'deletions',len(deleted))
          '@ | python -
          $full=(Get-FileHash -Algorithm SHA256 artifacts/Pica-Library-v0.3.5-windows-x64.zip).Hash.ToLowerInvariant()
          $update=(Get-FileHash -Algorithm SHA256 artifacts/Pica-Library-v0.3.5-update.zip).Hash.ToLowerInvariant()
          "$full  Pica-Library-v0.3.5-windows-x64.zip`n$update  Pica-Library-v0.3.5-update.zip" | Set-Content -Encoding ascii artifacts/SHA256SUMS-v0.3.5.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Windows-v0.3.5-Hotfix
          path: |
            artifacts/Pica-Library-v0.3.5-windows-x64.zip
            artifacts/Pica-Library-v0.3.5-update.zip
            artifacts/SHA256SUMS-v0.3.5.txt
          retention-days: 3

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '014950b43daa5b6aff295d3a7291d7c5090bbb22'
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test lint and build Android v32
        working-directory: mobile/android-alpha2
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
      - name: Sign and verify Android v32
        env:
          PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          INPUT='mobile/android-alpha2/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$INPUT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$INPUT" | grep -q "package: name='com.picalibrary.android' versionCode='32' versionName='0.1.0-alpha8.6.1-theme-hotfix'"
          mkdir -p release-artifacts
          KEYSTORE="$RUNNER_TEMP/pica-preview.jks"
          printf '%s' "$PREVIEW_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias pica-preview \
            --ks-pass "pass:$PREVIEW_KEYSTORE_PASSWORD" --key-pass "pass:$PREVIEW_KEYSTORE_PASSWORD" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false \
            --out release-artifacts/Pica-Library-Android-Preview.apk "$INPUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release-artifacts/Pica-Library-Android-Preview.apk
          CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release-artifacts/Pica-Library-Android-Preview.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')
          test "$CERT" = "$EXPECTED_CERT"
          printf '%s\n' "$CERT" > release-artifacts/Pica-Library-Android-Preview.cert-sha256
          sha256sum release-artifacts/Pica-Library-Android-Preview.apk > release-artifacts/ANDROID-SHA256.txt
          rm -f "$KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Android-v32-Hotfix
          path: release-artifacts/
          retention-days: 3

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pica-Library-Windows-v0.3.5-Hotfix
          path: publish
      - uses: actions/download-artifact@v4
        with:
          name: Pica-Library-Android-v32-Hotfix
          path: publish
      - name: Validate artifacts and write update metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          p=Path('publish');apk=p/'Pica-Library-Android-Preview.apk';full=p/'Pica-Library-v0.3.5-windows-x64.zip';update=p/'Pica-Library-v0.3.5-update.zip'
          sha=lambda q:hashlib.sha256(q.read_bytes()).hexdigest()
          assert apk.is_file() and full.is_file() and update.is_file()
          with zipfile.ZipFile(update) as z:m=json.loads(z.read('update-manifest.json'))
          assert m['sourceVersionRange']=='=0.3.3 || =0.3.4',m
          assert 'sourceSha' not in m and m['targetVersion']=='0.3.5' and not m['requiresFullInstall'],m
          assert m['targetSourceSha']==os.environ['RELEASE_TARGET'],m
          cert=(p/'Pica-Library-Android-Preview.cert-sha256').read_text().strip().lower();assert cert==os.environ['EXPECTED_CERT']
          ah,fh,uh=sha(apk),sha(full),sha(update)
          sums=(p/'SHA256SUMS-v0.3.5.txt').read_text();assert f'{fh}  Pica-Library-v0.3.5-windows-x64.zip' in sums;assert f'{uh}  Pica-Library-v0.3.5-update.zip' in sums
          android={
            'versionCode':32,
            'versionName':'0.1.0-alpha8.6.1-theme-hotfix',
            'apkUrl':'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.apk',
            'sha256':ah,
            'releaseNotes':'Alpha8.6.1 / v32 hotfix: repairs GitHub Star theme access on Android. Pica Violet · 星漫 and existing custom themes can be selected again; GitHub Star can be verified directly on the phone or synchronized from a paired Desktop. Existing local theme data is preserved.',
            'minimumSupportedVersionCode':23
          }
          (p/'android-update.json').write_text(json.dumps(android,ensure_ascii=False,indent=2),encoding='utf-8')
          transparency={
            'releaseId':'android-v32-desktop-v0.3.5-hotfix',
            'publicSourceCommit':os.environ['RELEASE_TARGET'],
            'android':{'versionCode':32,'versionName':android['versionName'],'sha256':ah,'signingCertificateSha256':cert,'R8':True},
            'windows':{'version':'0.3.5','fullZipSha256':fh,'updateZipSha256':uh,'sourceVersionRange':m['sourceVersionRange'],'buildProvenance':m['targetSourceSha']},
            'fixes':['proxy-aware GitHub update traffic','stale update completion state','browser reload after backend upgrade','Android Star theme entry gate']
          }
          (p/'BUILD_TRANSPARENCY.json').write_text(json.dumps(transparency,ensure_ascii=False,indent=2),encoding='utf-8')
          (p/'SHA256SUMS.txt').write_text(f'{fh}  Pica-Library-v0.3.5-windows-x64.zip\n{uh}  Pica-Library-v0.3.5-update.zip\n',encoding='ascii')
          print('ANDROID_SHA='+ah);print('WINDOWS_FULL_SHA='+fh);print('WINDOWS_UPDATE_SHA='+uh)
          PY
      - name: Publish Android Preview v32
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit android-preview --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --prerelease --title 'Pica Library Android Preview' --notes 'Alpha8.6.1 / v32 hotfix: restores GitHub Star personalization entry and switching for Pica Violet · 星漫 and existing custom themes. Star verification now works directly on Android or through a paired Desktop.'
          gh release upload android-preview --repo "$GITHUB_REPOSITORY" publish/Pica-Library-Android-Preview.apk publish/android-update.json publish/Pica-Library-Android-Preview.cert-sha256 publish/BUILD_TRANSPARENCY.json --clobber
      - name: Publish Desktop v0.3.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Desktop v0.3.5 hotfix: GitHub update checks, Release downloads and GitHub Star verification now honor the HTTP/HTTPS proxy configured in Pica Library while local loopback traffic stays direct. The update page no longer shows stale “更新完成” after a failed check and reloads after a successful backend upgrade. The incremental package is verified for direct upgrades from v0.3.3 and v0.3.4.'
          if gh release view v0.3.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v0.3.5 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --title 'Pica Library v0.3.5' --notes "$NOTES" --latest
          else
            gh release create v0.3.5 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --title 'Pica Library v0.3.5' --notes "$NOTES" --latest
          fi
          gh release upload v0.3.5 --repo "$GITHUB_REPOSITORY" publish/Pica-Library-v0.3.5-windows-x64.zip publish/Pica-Library-v0.3.5-update.zip publish/SHA256SUMS.txt publish/BUILD_TRANSPARENCY.json --clobber
      - name: Verify live update channels
        run: |
          set -euo pipefail
          sleep 4
          curl -L --fail --retry 3 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/android-update.json' -o "$RUNNER_TEMP/android.json"
          curl -L --fail --retry 3 'https://api.github.com/repos/Saber-Alter-Lily/pica-library/releases/tags/android-preview' -o "$RUNNER_TEMP/android-release.json"
          curl -L --fail --retry 3 'https://api.github.com/repos/Saber-Alter-Lily/pica-library/releases/latest' -o "$RUNNER_TEMP/latest.json"
          python - "$RUNNER_TEMP/android.json" "$RUNNER_TEMP/android-release.json" "$RUNNER_TEMP/latest.json" <<'PY'
          import json,sys,urllib.request
          a=json.load(open(sys.argv[1],encoding='utf-8'));ar=json.load(open(sys.argv[2],encoding='utf-8'));w=json.load(open(sys.argv[3],encoding='utf-8'))
          assert a['versionCode']==32 and a['versionName']=='0.1.0-alpha8.6.1-theme-hotfix',a
          aa={x['name']:x for x in ar['assets']};assert aa['Pica-Library-Android-Preview.apk'].get('digest')=='sha256:'+a['sha256']
          assert w['tag_name']=='v0.3.5' and not w['draft'] and not w['prerelease'],w['tag_name']
          wa={x['name']:x for x in w['assets']};sums=urllib.request.urlopen(wa['SHA256SUMS.txt']['browser_download_url'],timeout=15).read().decode()
          for name in ('Pica-Library-v0.3.5-windows-x64.zip','Pica-Library-v0.3.5-update.zip'):
              expected=[line.split()[0] for line in sums.splitlines() if line.strip().endswith(name)][0]
              assert wa[name].get('digest')=='sha256:'+expected,(name,wa[name].get('digest'),expected)
          print('LIVE CHANNELS PASS: Android v32 and Desktop v0.3.5')
          PY
