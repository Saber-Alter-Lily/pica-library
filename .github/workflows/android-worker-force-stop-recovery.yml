name: Android Worker Force-Stop Recovery

on:
  push:
    branches: [main]
    paths:
      - 'mobile/android-alpha2/**'
      - 'scripts/run-android-worker-force-stop-recovery.sh'
      - 'test/unit/long-task-stability-v047.test.ts'
      - 'docs/ANDROID_FORCE_STOP_RECOVERY_P2G15.md'
      - 'DEVELOPMENT_TASK_LOG.md'
      - '.github/workflows/android-worker-force-stop-recovery.yml'
  pull_request:
    paths:
      - 'mobile/android-alpha2/**'
      - 'scripts/run-android-worker-force-stop-recovery.sh'
      - 'test/unit/long-task-stability-v047.test.ts'
      - 'docs/ANDROID_FORCE_STOP_RECOVERY_P2G15.md'
      - 'DEVELOPMENT_TASK_LOG.md'
      - '.github/workflows/android-worker-force-stop-recovery.yml'

permissions:
  contents: read

jobs:
  force-stop-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run force-stop recovery acceptance
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/run-android-worker-force-stop-recovery.sh
      - name: Upload recovery diagnostics
        if: always() && github.event.repository.private == false
        uses: actions/upload-artifact@v4
        with:
          name: android-worker-force-stop-recovery-${{ github.run_id }}-${{ github.job }}
          path: test-results/android-worker-force-stop-recovery/
          retention-days: 1
          if-no-files-found: ignore
