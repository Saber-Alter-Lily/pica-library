name: Apply V5 taste exclusion

on:
  push:
    branches: [feature/recommendation-v5-portable-policy]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recommendation-v5-portable-policy
          fetch-depth: 1
      - name: Apply taste exclusion
        run: |
          python scripts/v5-taste-exclusion.py
          node --check web/recommendation-v5-beta.js
          node --check web/app.js
          git diff --check
      - name: Validate focused tests
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm type:check
          pnpm exec vitest run test/unit/recommendation-v5-portable-policy.test.ts test/unit/recommendation-v5-product-contract.test.ts
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/recommendation-v5/portable-policy.ts \
                  src/recommendation-v5/policy-store.ts \
                  src/recommendation-v3/types.ts \
                  src/library/service.ts \
                  src/library/server.ts \
                  web/app.js \
                  web/recommendation-v5-beta.js \
                  test/unit/recommendation-v5-portable-policy.test.ts \
                  test/unit/recommendation-v5-product-contract.test.ts \
                  PROJECT_LOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: allow favorites to opt out of taste inference"
          git push origin HEAD:feature/recommendation-v5-portable-policy
