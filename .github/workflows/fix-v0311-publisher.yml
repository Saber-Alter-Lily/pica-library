name: Fix v0.3.11 publisher deletion scan

on:
  push:
    paths:
      - '.github/workflows/fix-v0311-publisher.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Permit QR filenames only as explicit deletions
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/publish-v0.3.11-no-payment.yml')
          s=path.read_text(encoding='utf-8')
          old="""          def assert_no_payment(path):
              with zipfile.ZipFile(path) as z:
                  for info in z.infolist():
                      if info.is_dir(): continue
                      name=info.filename.encode('utf-8','ignore')
                      data=z.read(info.filename)
                      for token in banned:
                          assert token.lower() not in name.lower(),(path.name,info.filename,token)
                          assert token.lower() not in data.lower(),(path.name,info.filename,token)
"""
          new="""          def assert_no_payment(path,allow_deletion_manifest=False):
              with zipfile.ZipFile(path) as z:
                  for info in z.infolist():
                      if info.is_dir(): continue
                      name=info.filename.encode('utf-8','ignore')
                      data=z.read(info.filename)
                      if allow_deletion_manifest and info.filename=='update-manifest.json':
                          manifest=json.loads(data)
                          qr_paths={'web/support-wechat.svg','web/support-alipay.svg'}
                          assert qr_paths.issubset(set(manifest.get('deletions',[]))),manifest.get('deletions',[])
                          assert not qr_paths.intersection({item.get('path') for item in manifest.get('files',[])}),manifest.get('files',[])
                          for token in (b'wxp://',b'qr.alipay.com',b'SupportQr',b'f2f04_W9ygrHkVzuyBDwcwQ-JD_s0x7ykO1XtWtemaqNViM',b'fkx14989yqljy1lllnfn47b'):
                              assert token.lower() not in data.lower(),(path.name,info.filename,token)
                          continue
                      for token in banned:
                          assert token.lower() not in name.lower(),(path.name,info.filename,token)
                          assert token.lower() not in data.lower(),(path.name,info.filename,token)
"""
          if old not in s: raise SystemExit('publisher scan anchor not found')
          s=s.replace(old,new,1)
          s=s.replace('          assert_no_payment(update)\n','          assert_no_payment(update,True)\n',1)
          path.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Commit publisher fix
        run: |
          git config user.name 'Saber-Alter-Lily'
          git config user.email '3178088154@qq.com'
          git add .github/workflows/publish-v0.3.11-no-payment.yml
          git commit -m 'release: allow QR paths only as update deletions'
          git push origin HEAD:main
