name: Publish Android v28 Preview OTA

on:
  push:
    paths:
      - '.github/workflows/publish-android-v28.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-7e1c-8230-8045-d1079c6cf3f3/raw?se=2026-09-10T07%3A50%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=566d20c6-01d3-52b2-aade-4c31ee5376d3&skoid=80e81ea6-3c08-46f9-bd84-b87176742bcd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T03%3A16%3A32Z&ske=2026-09-11T03%3A16%3A32Z&sks=b&skv=2026-02-06&sig=OYS6oiPnrCbr2EZFajQgEiSeTi2MWJXY0Ja8RVIMnnQ%3D'
      EXPECTED_CERT: '64fb87dc7d8bd6bc7b2cec92cc8c83fad3afe8cfb07591a2e53d53cbd3ab2f9d'
      VERSION_CODE: '28'
      VERSION_NAME: '0.1.0-alpha8.4.1-recommendation-persistence'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'build-tools;35.0.0'
      - name: Download verified private build artifact
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 "$ARTIFACT_URL" -o "$RUNNER_TEMP/v28-unsigned.zip"
          mkdir -p "$RUNNER_TEMP/v28"
          unzip -q "$RUNNER_TEMP/v28-unsigned.zip" -d "$RUNNER_TEMP/v28"
          test -s "$RUNNER_TEMP/v28/Pica-Library-Android-v28-Alpha8.4.1-UNSIGNED.apk"
      - name: Sign with stable Android Preview identity
        env:
          PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_KEYSTORE_B64:-}" ] || [ -z "${PREVIEW_KEYSTORE_PASSWORD:-}" ]; then
            echo 'Android Preview signing secrets are not configured.' >&2
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/pica-preview.jks"
          printf '%s' "$PREVIEW_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          mkdir -p publish
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias pica-preview \
            --ks-pass "pass:$PREVIEW_KEYSTORE_PASSWORD" \
            --key-pass "pass:$PREVIEW_KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --v4-signing-enabled false \
            --out publish/Pica-Library-Android-Preview.apk \
            "$RUNNER_TEMP/v28/Pica-Library-Android-v28-Alpha8.4.1-UNSIGNED.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs publish/Pica-Library-Android-Preview.apk
          CERT_SHA=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs publish/Pica-Library-Android-Preview.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')
          test "$CERT_SHA" = "$EXPECTED_CERT"
          printf '%s\n' "$CERT_SHA" > publish/Pica-Library-Android-Preview.cert-sha256
          SHA=$(sha256sum publish/Pica-Library-Android-Preview.apk | awk '{print $1}')
          python - "$VERSION_CODE" "$VERSION_NAME" "$SHA" "$CERT_SHA" <<'PY'
          import json, sys
          code, name, sha, cert = int(sys.argv[1]), sys.argv[2], sys.argv[3], sys.argv[4]
          manifest = {
              'versionCode': code,
              'versionName': name,
              'apkUrl': 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.apk',
              'sha256': sha,
              'releaseNotes': 'Alpha8.4.1 recommendation persistence hotfix: favoriting a recommended comic no longer clears the visible recommendation batch; storage action spacing is corrected; support copy moves the surprise hint to the GitHub Star area; personalization QA access remains enabled for official v28 testing.',
              'minimumSupportedVersionCode': 23,
          }
          with open('publish/android-update.json','w',encoding='utf-8') as f:
              json.dump(manifest,f,ensure_ascii=False,indent=2)
          transparency = {
              'product': 'Pica Library Android Preview',
              'versionCode': code,
              'versionName': name,
              'apkSha256': sha,
              'signerCertificateSha256': cert,
              'channel': 'android-preview',
              'sourcePolicy': 'delayed-source-release',
              'buildValidation': ['unit-tests','recommendation-persistence-test','lint','R8-release-build','stable-signer-verification'],
          }
          with open('publish/BUILD_TRANSPARENCY.json','w',encoding='utf-8') as f:
              json.dump(transparency,f,ensure_ascii=False,indent=2)
          PY
          rm -f "$KEYSTORE"
      - name: Replace Android Preview OTA assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view android-preview >/dev/null
          gh release edit android-preview --prerelease --title 'Pica Library Android Preview' --notes 'Alpha8.4.1 / v28 recommendation persistence hotfix. Favoriting no longer blanks the active recommendation batch, storage action spacing is fixed, and the personalization QA grant remains available.'
          gh release upload android-preview \
            publish/Pica-Library-Android-Preview.apk \
            publish/android-update.json \
            publish/Pica-Library-Android-Preview.cert-sha256 \
            publish/BUILD_TRANSPARENCY.json \
            --clobber
      - name: Final OTA manifest check
        run: |
          set -euo pipefail
          sleep 3
          curl -L --fail --retry 3 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/android-update.json' -o "$RUNNER_TEMP/live-update.json"
          python - "$RUNNER_TEMP/live-update.json" <<'PY'
          import json, sys
          with open(sys.argv[1],encoding='utf-8') as f: x=json.load(f)
          assert x['versionCode']==28, x
          assert x['versionName']=='0.1.0-alpha8.4.1-recommendation-persistence', x
          assert len(x['sha256'])==64, x
          print('OTA manifest PASS:', x['versionCode'], x['sha256'])
          PY
