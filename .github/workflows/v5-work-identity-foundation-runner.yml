name: Apply canonical work identity foundation

on:
  push:
    branches: [feature/recommendation-v5-portable-policy]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recommendation-v5-portable-policy
          fetch-depth: 1
      - name: Apply identity foundation
        run: |
          python scripts/v5-work-identity-foundation.py
          git diff --check
      - name: Validate focused tests
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm type:check
          pnpm exec vitest run test/unit/recommendation-v5-work-identity-foundation.test.ts test/unit/recommendation-v5-product-contract.test.ts test/unit/recommendation-v5-portable-policy.test.ts
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/storage/sqlite/migrations.ts \
                  src/recommendation-v5/work-identity-foundation.ts \
                  src/library/service.ts \
                  src/library/server.ts \
                  test/unit/recommendation-v5-work-identity-foundation.test.ts \
                  test/unit/recommendation-v5-product-contract.test.ts \
                  PROJECT_LOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add canonical work identity foundation"
          git push origin HEAD:feature/recommendation-v5-portable-policy
