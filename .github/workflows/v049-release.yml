name: v0.4.9 Formal Release

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/v049-release.yml'

permissions:
  contents: write

env:
  EXPECTED_CERT: '64fb87dc7d8bd6bc7b2cec92cc8c83fad3afe8cfb07591a2e53d53cbd3ab2f9d'

jobs:
  windows:
    if: github.event.repository.private == false && github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PICA_LIBRARY_BUILD_PROVENANCE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Re-run formal Desktop gates
        shell: pwsh
        run: |
          pnpm type:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm web:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download checksum-pinned public baselines
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\release-base | Out-Null
          $bases=@(
            @('0.4.1','88d87a8f0e5a8413656751ff344052eccbfa796e663e4acc8c7fe4a0e0866b3d'),
            @('0.4.2','96bcc020c7cd19aa84f982af9010f6656a44dc01b827839d6e24c40e36ec24c1'),
            @('0.4.3','36283292a1b3aefb1032b11c5064663bef9176d4bf32562be6a3f531c84ac733'),
            @('0.4.4','cff1c7cf5d79300d8fa38e9faf9d7280c20df1641908fbf28a28e32d3de41bff'),
            @('0.4.5','f5b93b4a81c78df17bbee793354d4e8df002fad6dcc9c432e334bb7c14fee901'),
            @('0.4.6','914d691b441e8dbc95a9ef0bb7a7ebc46940bfc44907e0595a8953a293bda50c'),
            @('0.4.7','dafea5417e27055c6a4871b7386f31b66a51f82a5ce01136d467ee1176659947'),
            @('0.4.8','6fd3eb5a1346cd2211efe5b47588b38d4099d6e768f836461969eaf22d64e26d')
          )
          foreach($row in $bases){
            $version=$row[0]
            $expected=$row[1]
            $name="Pica-Library-v$version-windows-x64.zip"
            $path="artifacts\release-base\$name"
            Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/Saber-Alter-Lily/pica-library/releases/download/v$version/$name" -OutFile $path
            $actual=(Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            if($actual -ne $expected){ throw "Official v$version package checksum mismatch: $actual" }
          }
      - name: Build Windows full and scoped updates
        shell: pwsh
        run: |
          pnpm build:windows
          $target='artifacts\Pica-Library-v0.4.9-windows-x64.zip'
          ./scripts/test-windows-artifact.ps1 -Zip $target
          foreach($source in @('0.4.1','0.4.2','0.4.3','0.4.4','0.4.5','0.4.6','0.4.7','0.4.8')){
            pnpm build:local-update "artifacts\release-base\Pica-Library-v$source-windows-x64.zip" $target "artifacts\Pica-Library-v0.4.9-update-from-v$source.zip"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build v0.4.0 direct upgrade assistant
        shell: pwsh
        run: |
          $full='artifacts\Pica-Library-v0.4.9-windows-x64.zip'
          $fullHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $full).Hash.ToLowerInvariant()
          $src='packaging\windows\upgrade-assistant-v041'
          $work=Join-Path $env:RUNNER_TEMP 'pica-v049-assistant'
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $work
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          $ps1=Get-Content -Raw -LiteralPath (Join-Path $src 'Upgrade-Pica-Library-v0.4.1.ps1')
          $ps1=$ps1.Replace('0.4.1','0.4.9').Replace('v041','v049')
          $ps1=$ps1.Replace('88d87a8f0e5a8413656751ff344052eccbfa796e663e4acc8c7fe4a0e0866b3d',$fullHash)
          $ps1=$ps1.Replace('974d4e9b22379aeed379b71711008332acc213a4',$env:GITHUB_SHA)
          [IO.File]::WriteAllText((Join-Path $work 'Upgrade-Pica-Library-v0.4.9.ps1'),$ps1,(New-Object Text.UTF8Encoding($true)))

          $cmd=(Get-Content -Raw -LiteralPath (Join-Path $src 'Upgrade-Pica-Library-v0.4.1.cmd')).Replace('0.4.1','0.4.9')
          [IO.File]::WriteAllText((Join-Path $work 'Upgrade-Pica-Library-v0.4.9.cmd'),$cmd,(New-Object Text.UTF8Encoding($false)))
          $readme=(Get-Content -Raw -LiteralPath (Join-Path $src 'README.txt')).Replace('0.4.1','0.4.9')
          [IO.File]::WriteAllText((Join-Path $work 'README.txt'),$readme,(New-Object Text.UTF8Encoding($false)))

          $assistant='artifacts\Pica-Library-v0.4.9-upgrade-assistant.zip'
          Compress-Archive -Path (Join-Path $work '*') -DestinationPath $assistant -CompressionLevel Optimal
          $assistantHash=(Get-FileHash -Algorithm SHA256 -LiteralPath $assistant).Hash.ToLowerInvariant()
          "$assistantHash  Pica-Library-v0.4.9-upgrade-assistant.zip" | Set-Content -Encoding ascii 'artifacts\Pica-Library-v0.4.9-upgrade-assistant.sha256'
      - name: Write Windows release evidence
        shell: pwsh
        run: |
          $names=@(
            'Pica-Library-v0.4.9-windows-x64.zip',
            'Pica-Library-v0.4.9-update-from-v0.4.1.zip',
            'Pica-Library-v0.4.9-update-from-v0.4.2.zip',
            'Pica-Library-v0.4.9-update-from-v0.4.3.zip',
            'Pica-Library-v0.4.9-update-from-v0.4.4.zip',
            'Pica-Library-v0.4.9-update-from-v0.4.5.zip',
            'Pica-Library-v0.4.9-update-from-v0.4.6.zip',
            'Pica-Library-v0.4.9-update-from-v0.4.7.zip',
            'Pica-Library-v0.4.9-update-from-v0.4.8.zip',
            'Pica-Library-v0.4.9-upgrade-assistant.zip'
          )
          $lines=@()
          foreach($name in $names){
            $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath ("artifacts\"+$name)).Hash.ToLowerInvariant()
            $lines += "$hash  $name"
          }
          $lines | Set-Content -Encoding ascii 'artifacts\SHA256SUMS-Windows.txt'
          [ordered]@{
            release='v0.4.9'; sourceSha=$env:GITHUB_SHA; productVersion='0.4.9';
            publicUpgradeBaseline='0.4.0'; databaseSchema=13;
            scopedUpdateSources=@('0.4.1','0.4.2','0.4.3','0.4.4','0.4.5','0.4.6','0.4.7','0.4.8');
            gates=@('type-check','web-syntax','unit-integration-tests','production-build','windows-artifact-smoke','official-base-checksums','scoped-update-builds','direct-upgrade-assistant')
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 'artifacts\BUILD_TRANSPARENCY-Windows.json'
      - uses: actions/upload-artifact@v4
        with:
          name: v049-windows-release
          path: |
            artifacts/Pica-Library-v0.4.9-windows-x64.zip
            artifacts/Pica-Library-v0.4.9-update-from-v0.4.1.zip
            artifacts/Pica-Library-v0.4.9-update-from-v0.4.2.zip
            artifacts/Pica-Library-v0.4.9-update-from-v0.4.3.zip
            artifacts/Pica-Library-v0.4.9-update-from-v0.4.4.zip
            artifacts/Pica-Library-v0.4.9-update-from-v0.4.5.zip
            artifacts/Pica-Library-v0.4.9-update-from-v0.4.6.zip
            artifacts/Pica-Library-v0.4.9-update-from-v0.4.7.zip
            artifacts/Pica-Library-v0.4.9-update-from-v0.4.8.zip
            artifacts/Pica-Library-v0.4.9-upgrade-assistant.zip
            artifacts/Pica-Library-v0.4.9-upgrade-assistant.sha256
            artifacts/SHA256SUMS-Windows.txt
            artifacts/BUILD_TRANSPARENCY-Windows.json
          retention-days: 1
          if-no-files-found: error

  android:
    if: github.event.repository.private == false && github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and lint Android
        working-directory: mobile/android-alpha2
        run: gradle :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Build and verify formal v52
        working-directory: mobile/android-alpha2
        env:
          ANDROID_PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
          ANDROID_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_PREVIEW_KEYSTORE_B64:-}"
          test -n "${ANDROID_PREVIEW_KEYSTORE_PASSWORD:-}"
          curl -fL --retry 3 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/v0.4.8/Pica-Library-Android-Preview.cert-sha256' -o "$RUNNER_TEMP/old-cert.txt"
          oldcert=$(tr -d '\r\n ' < "$RUNNER_TEMP/old-cert.txt")
          test "$oldcert" = "$EXPECTED_CERT"

          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/pica-v049-signing-XXXXXXXX")
          export ANDROID_PREVIEW_KEYSTORE_PATH="$signing_dir/preview.jks"
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$ANDROID_PREVIEW_KEYSTORE_B64" | base64 --decode > "$ANDROID_PREVIEW_KEYSTORE_PATH"
          unset ANDROID_PREVIEW_KEYSTORE_B64
          gradle :app:assembleRelease --no-daemon
          apk=app/build/outputs/apk/release/app-release.apk

          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/package.txt"
          grep -q "package: name='com.picalibrary.android' versionCode='52' versionName='0.4.9'" "$RUNNER_TEMP/package.txt"
          grep -q "application-label:'Pica Library'" "$RUNNER_TEMP/package.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/cert.txt"
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/cert.txt" | head -1 | tr 'A-F' 'a-f')
          test "$cert" = "$EXPECTED_CERT"
          test "$cert" = "$oldcert"

          mkdir -p publish
          cp "$apk" publish/Pica-Library-Android-v52.apk
          cp "$apk" publish/Pica-Library-Android-Preview.apk
          printf '%s\n' "$cert" > publish/Pica-Library-Android-Preview.cert-sha256
          sha=$(sha256sum publish/Pica-Library-Android-v52.apk | awk '{print $1}')
          cat > publish/android-update.json <<JSON
          {
            "versionCode": 52,
            "versionName": "0.4.9",
            "apkUrl": "https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.apk",
            "sha256": "$sha",
            "releaseNotes": "v0.4.9 推荐交互与作品身份更新：Android 推荐原位暂停/继续、反馈批次冻结与人工调整滚动稳定；双端自动更新提示；已拥有 Work 排除与可折叠相似作品版本互链。",
            "minimumSupportedVersionCode": 42
          }
          JSON
          printf '%s  %s\n' "$sha" 'Pica-Library-Android-v52.apk' > publish/SHA256SUMS-Android.txt
          python - "$sha" "$cert" "$GITHUB_SHA" <<'PY'
          import json,sys
          sha,cert,source=sys.argv[1:]
          out={"release":"v0.4.9","versionCode":52,"versionName":"0.4.9","sourceSha":source,"apkSha256":sha,"signerCertificateSha256":cert,"minimumSupportedVersionCode":42,"upgradeValidation":["same-package-id","higher-than-v51-formal-version","same-signing-certificate","formal-label","unit-tests","lint","R8-release-build"]}
          with open("publish/BUILD_TRANSPARENCY-Android.json","w",encoding="utf-8") as f: json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v049-android-release
          path: mobile/android-alpha2/publish/
          retention-days: 1
          if-no-files-found: error

  publish:
    if: github.event.repository.private == false && github.repository == 'Saber-Alter-Lily/pica-library'
    needs: [windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: v049-windows-release
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: v049-android-release
          path: release/android
      - name: Assemble release metadata
        run: |
          cat release/windows/SHA256SUMS-Windows.txt release/android/SHA256SUMS-Android.txt > release/SHA256SUMS.txt
          python - <<'PY'
          import json
          from pathlib import Path
          w=json.loads(Path("release/windows/BUILD_TRANSPARENCY-Windows.json").read_text(encoding="utf-8-sig"))
          a=json.loads(Path("release/android/BUILD_TRANSPARENCY-Android.json").read_text(encoding="utf-8-sig"))
          Path("release/BUILD_TRANSPARENCY.json").write_text(json.dumps({"release":"v0.4.9","windows":w,"android":a},ensure_ascii=False,indent=2),encoding="utf-8")
          PY
          cat > release/RELEASE_NOTES.md <<'EOF'
          Pica Library v0.4.9

          ## 推荐交互稳定性
          - Android 推荐“暂停”不再取消 WorkManager；正常暂停后继续会在同一存活 Worker 内原位恢复，并保留已完成阶段与可见进度。
          - 如果 Android / 系统终止了暂停中的 Worker，会明确显示“暂停状态已保留”，继续时只重做未完成阶段，不伪装成跨进程精确 checkpoint。
          - Android Like / Dislike 与 Desktop 对齐：当前可见批次保持冻结，反馈后只更新卡片状态，不再删除卡片并从下一批提前补位。
          - 重复点击已经激活的 Like / Dislike 为 no-op，不会清除之前保存的反馈原因。
          - Android 0–10 人工调整、屏蔽和 Session 意图更新后恢复原滚动位置，不再跳回页面顶部。

          ## 自动更新发现
          - Desktop/Web 与 Android 增加前台自动检查正式更新。
          - 网络检查按 6 小时节流，同一版本提示按 12 小时节流；前台弹窗与 Android 通知做去重。
          - 自动发现只负责提示并导向既有更新页，不会自动下载或静默安装。

          ## 已拥有作品与版本互链
          - Final V3 在 exact upload 过滤之外增加 Canonical Work 级 ownership gate：已收藏、已入库或已下载作品的已确认其他上传版本不再作为“新作品”进入最终推荐。
          - Work ownership 使用轻量 fingerprint 使缓存按需失效，不恢复每切批都全量扫描书库的性能回退。
          - Desktop/Web 与 Android 详情页新增可折叠“相似作品 · N”；默认只显示数量，展开后显示封面、标题、作者、页数、来源、版本/语言、收藏/下载状态以及可用评分/汉化信息。
          - Canonical binding 与人工 SAME_WORK / EDITION_VARIANT 裁决优先；高置信 probable 关系只作为详情提示，不自动物化，也不直接作为推荐硬排除；KEEP_SEPARATE 始终优先。
          - Web 书库、已下载、书架、搜索与推荐统一使用同一作品详情入口；普通详情不再预加载完整 Visual QC 数据。

          ## 升级
          - Windows v0.4.1–v0.4.8：应用内兼容增量更新。
          - Windows v0.4.0：使用 Pica-Library-v0.4.9-upgrade-assistant.zip 一次直达。
          - Android：v52 / 0.4.9；保持正式包名与签名，可从 v42–v51 原地升级。
          EOF
      - name: Publish stable release and Android channel
        run: |
          assets=(
            release/windows/Pica-Library-v0.4.9-windows-x64.zip
            release/windows/Pica-Library-v0.4.9-update-from-v0.4.1.zip
            release/windows/Pica-Library-v0.4.9-update-from-v0.4.2.zip
            release/windows/Pica-Library-v0.4.9-update-from-v0.4.3.zip
            release/windows/Pica-Library-v0.4.9-update-from-v0.4.4.zip
            release/windows/Pica-Library-v0.4.9-update-from-v0.4.5.zip
            release/windows/Pica-Library-v0.4.9-update-from-v0.4.6.zip
            release/windows/Pica-Library-v0.4.9-update-from-v0.4.7.zip
            release/windows/Pica-Library-v0.4.9-update-from-v0.4.8.zip
            release/windows/Pica-Library-v0.4.9-upgrade-assistant.zip
            release/windows/Pica-Library-v0.4.9-upgrade-assistant.sha256
            release/windows/BUILD_TRANSPARENCY-Windows.json
            release/android/Pica-Library-Android-v52.apk
            release/android/Pica-Library-Android-Preview.cert-sha256
            release/android/android-update.json
            release/android/BUILD_TRANSPARENCY-Android.json
            release/BUILD_TRANSPARENCY.json
            release/SHA256SUMS.txt
          )
          gh release create v0.4.9 "${assets[@]}" --target "$GITHUB_SHA" --title 'Pica Library v0.4.9 · Recommendation Stability & Work Variants' --notes-file release/RELEASE_NOTES.md

          git tag -f android-preview "$GITHUB_SHA"
          git push --force origin refs/tags/android-preview
          gh release upload android-preview             release/android/Pica-Library-Android-Preview.apk             release/android/Pica-Library-Android-Preview.cert-sha256             release/android/android-update.json             release/android/BUILD_TRANSPARENCY-Android.json             release/BUILD_TRANSPARENCY.json             --clobber
          gh release edit android-preview --title 'Android Preview v52 · Pica Library 0.4.9' --notes 'Android v52 / 0.4.9 正式更新通道。与既有正式版本保持相同包名和签名；可从 v42–v51 原地升级。' --prerelease
