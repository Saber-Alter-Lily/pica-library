name: Android Macrobenchmark Build

on:
  push:
    branches: [main]
    paths:
      - 'mobile/android-alpha2/**'
      - 'scripts/run-android-macrobenchmark.sh'
      - 'test/unit/android-macrobenchmark-p2g18.test.ts'
      - 'docs/ANDROID_FOREGROUND_PERFORMANCE_P2G18.md'
      - 'DEVELOPMENT_TASK_LOG.md'
      - '.github/workflows/android-macrobenchmark-build.yml'
  pull_request:
    paths:
      - 'mobile/android-alpha2/**'
      - 'scripts/run-android-macrobenchmark.sh'
      - 'test/unit/android-macrobenchmark-p2g18.test.ts'
      - 'docs/ANDROID_FOREGROUND_PERFORMANCE_P2G18.md'
      - 'DEVELOPMENT_TASK_LOG.md'
      - '.github/workflows/android-macrobenchmark-build.yml'

permissions:
  contents: read

jobs:
  macrobenchmark-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile release-like benchmark target and Macrobenchmark APK
        working-directory: mobile/android-alpha2
        run: gradle :app:assembleBenchmark :macrobenchmark:assembleBenchmark --stacktrace
