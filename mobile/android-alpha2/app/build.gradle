plugins {
    id 'com.android.application'
}

android {
    namespace 'com.picalibrary.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.picalibrary.android'
        minSdk 28
        targetSdk 35
        versionCode 4
        versionName '0.1.0-alpha4'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
