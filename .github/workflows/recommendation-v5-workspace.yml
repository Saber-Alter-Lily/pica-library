name: Recommendation V5 integration staging

on:
  push:
    branches: [feature/recommendation-v5-portable-policy]
    paths: [.github/workflows/recommendation-v5-workspace.yml]

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply Recommendation V5 integration
        run: |
          set -euo pipefail
          python scripts/apply-recommendation-v5-portable-policy.py
          python scripts/apply-recommendation-v5-followup.py
          python scripts/apply-recommendation-v5-testfix.py
          python scripts/apply-recommendation-v5-testfix2.py
      - name: Validate Web and Desktop implementation
        run: |
          set -euo pipefail
          pnpm type:check
          pnpm web:check
          pnpm test
          pnpm build
      - name: Commit validated implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No validated changes to commit.'
            exit 0
          fi
          git commit -m 'feat: integrate portable recommendation policy and pairing sync'
          git push origin HEAD:feature/recommendation-v5-portable-policy
