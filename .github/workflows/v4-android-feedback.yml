name: Recommendation V4 Android Feedback Apply

on:
  push:
    branches: [feature/recommendation-v4-visual-feedback]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recommendation-v4-visual-feedback
          fetch-depth: 0
      - name: Apply Android feedback parity
        run: python3 scripts/v4_android_feedback.py
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(android): integrate recommendation feedback parity"
          git push origin HEAD:feature/recommendation-v4-visual-feedback
