name: Publish v0.3.14 and Android v41 multi-cloud WebDAV

on:
  push:
    paths:
      - '.github/workflows/publish-v0.3.14-multi-remote-storage.yml'

permissions:
  contents: write

env:
  RELEASE_TARGET: '1064d06dbe488dcd8ccb4be5647bc9e8e4b48739'
  DESKTOP_VERSION: '0.3.14'
  DESKTOP_BASE_VERSION: '0.3.13'
  DESKTOP_BASE_SHA256: '4575cc0c073d68baac4a6e34979d25c062b83086053f86a87bd0d4d847cf1c77'
  ANDROID_VERSION_CODE: '41'
  ANDROID_VERSION_NAME: '0.1.0-alpha8.14-multi-remote-storage'
  EXPECTED_CERT: '64fb87dc7d8bd6bc7b2cec92cc8c83fad3afe8cfb07591a2e53d53cbd3ab2f9d'

jobs:
  windows:
    runs-on: windows-latest
    env:
      PICA_LIBRARY_BUILD_PROVENANCE: '1064d06dbe488dcd8ccb4be5647bc9e8e4b48739'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '1064d06dbe488dcd8ccb4be5647bc9e8e4b48739'
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Re-run Desktop release gates
        shell: pwsh
        run: |
          pnpm type:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm web:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download and verify official v0.3.13 base
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\release-base | Out-Null
          $base='artifacts\release-base\Pica-Library-v0.3.13-windows-x64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/v0.3.13/Pica-Library-v0.3.13-windows-x64.zip' -OutFile $base
          $actual=(Get-FileHash -Algorithm SHA256 $base).Hash.ToLowerInvariant()
          if($actual -ne $env:DESKTOP_BASE_SHA256){ throw "v0.3.13 base SHA-256 mismatch: $actual" }
          Write-Host 'OFFICIAL_V0_3_13_BASE_SHA256=PASS'
      - name: Build v0.3.14 full and incremental packages
        shell: pwsh
        run: |
          pnpm build:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec tsx scripts/build-local-update-package.ts artifacts/release-base/Pica-Library-v0.3.13-windows-x64.zip artifacts/Pica-Library-v0.3.14-windows-x64.zip artifacts/Pica-Library-v0.3.14-update.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows update contract and hashes
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $update='artifacts\Pica-Library-v0.3.14-update.zip'
          $archive=[IO.Compression.ZipFile]::OpenRead($update)
          try {
            $entry=$archive.GetEntry('update-manifest.json')
            if(-not $entry){ throw 'update-manifest.json missing' }
            $reader=New-Object IO.StreamReader($entry.Open())
            try { $manifest=($reader.ReadToEnd() | ConvertFrom-Json) } finally { $reader.Dispose() }
            if($manifest.sourceVersionRange -ne '=0.3.13'){ throw "unexpected source range: $($manifest.sourceVersionRange)" }
            if($manifest.targetVersion -ne '0.3.14'){ throw "unexpected target: $($manifest.targetVersion)" }
            if($manifest.targetSourceSha -ne $env:RELEASE_TARGET){ throw "unexpected target source: $($manifest.targetSourceSha)" }
            if($manifest.requiresFullInstall){ throw 'incremental update unexpectedly requires full install' }
            $protected=@('Pica Library.exe','app/updater.js','runtime/node.exe')
            foreach($item in @($manifest.files)){ if($protected -contains [string]$item.path){ throw "protected replacement in update: $($item.path)" } }
            foreach($item in @($manifest.deletions)){ if($protected -contains [string]$item){ throw "protected deletion in update: $item" } }
          } finally { $archive.Dispose() }
          $full='artifacts\Pica-Library-v0.3.14-windows-x64.zip'
          $fullHash=(Get-FileHash -Algorithm SHA256 $full).Hash.ToLowerInvariant()
          $updateHash=(Get-FileHash -Algorithm SHA256 $update).Hash.ToLowerInvariant()
          "$fullHash  Pica-Library-v0.3.14-windows-x64.zip`n$updateHash  Pica-Library-v0.3.14-update.zip" | Set-Content -Encoding ascii artifacts\SHA256SUMS-Windows.txt
          [ordered]@{
            product='Pica Library Desktop'
            version='0.3.14'
            sourceSha=$env:RELEASE_TARGET
            baseVersion='0.3.13'
            baseSha256=$env:DESKTOP_BASE_SHA256
            fullSha256=$fullHash
            updateSha256=$updateHash
            updateSourceRange='=0.3.13'
            buildValidation=@('typecheck','web-check','tests','build','official-base-sha256','incremental-manifest-contract')
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 artifacts\BUILD_TRANSPARENCY-Windows.json
          Write-Host 'WINDOWS_RELEASE_CONTRACT=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Windows-v0.3.14
          path: |
            artifacts/Pica-Library-v0.3.14-windows-x64.zip
            artifacts/Pica-Library-v0.3.14-update.zip
            artifacts/SHA256SUMS-Windows.txt
            artifacts/BUILD_TRANSPARENCY-Windows.json
          retention-days: 1
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '1064d06dbe488dcd8ccb4be5647bc9e8e4b48739'
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and lint before loading signing material
        working-directory: mobile/android-alpha2
        run: gradle :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Build and verify fixed-signature Android v41
        working-directory: mobile/android-alpha2
        env:
          ANDROID_PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
          ANDROID_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${ANDROID_PREVIEW_KEYSTORE_B64:-}"
          test -n "${ANDROID_PREVIEW_KEYSTORE_PASSWORD:-}"
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/pica-signing-XXXXXXXX")
          export ANDROID_PREVIEW_KEYSTORE_PATH="$signing_dir/preview.jks"
          trap 'rm -f -- "$ANDROID_PREVIEW_KEYSTORE_PATH"; rmdir -- "$signing_dir" 2>/dev/null || true' EXIT
          printf '%s' "$ANDROID_PREVIEW_KEYSTORE_B64" | base64 --decode > "$ANDROID_PREVIEW_KEYSTORE_PATH"
          unset ANDROID_PREVIEW_KEYSTORE_B64
          gradle :app:assembleRelease --no-daemon
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/pica-v41-package.txt"
          grep -q "package: name='com.picalibrary.android' versionCode='41' versionName='0.1.0-alpha8.14-multi-remote-storage'" "$RUNNER_TEMP/pica-v41-package.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/pica-v41-cert.txt"
          cert=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/pica-v41-cert.txt" | head -1 | tr 'A-F' 'a-f')
          test "$cert" = "$EXPECTED_CERT"
          mkdir -p publish
          cp "$apk" publish/Pica-Library-Android-v41.apk
          cp "$apk" publish/Pica-Library-Android-Preview.apk
          printf '%s\n' "$cert" > publish/Pica-Library-Android-Preview.cert-sha256
          sha=$(sha256sum publish/Pica-Library-Android-Preview.apk | awk '{print $1}')
          python - "$sha" "$cert" "$RELEASE_TARGET" <<'PY'
          import json,sys
          sha,cert,source=sys.argv[1:]
          manifest={
              'versionCode':41,
              'versionName':'0.1.0-alpha8.14-multi-remote-storage',
              'apkUrl':'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.apk',
              'sha256':sha,
              'releaseNotes':'Alpha8.14: add multiple named WebDAV targets on Android, active-cloud switching, 123Pan compatibility, provider presets, and safe legacy single-WebDAV migration. Switching clouds invalidates remote availability before refresh to avoid cross-cloud catalog leakage.',
              'minimumSupportedVersionCode':23,
          }
          with open('publish/android-update.json','w',encoding='utf-8') as f:
              json.dump(manifest,f,ensure_ascii=False,indent=2)
          transparency={
              'product':'Pica Library Android Preview',
              'versionCode':41,
              'versionName':'0.1.0-alpha8.14-multi-remote-storage',
              'sourceSha':source,
              'apkSha256':sha,
              'signerCertificateSha256':cert,
              'channel':'android-preview',
              'buildValidation':['unit-tests','lint','R8-release-build','package-version-verification','stable-signer-verification'],
          }
          with open('publish/BUILD_TRANSPARENCY.json','w',encoding='utf-8') as f:
              json.dump(transparency,f,ensure_ascii=False,indent=2)
          PY
          sha256sum publish/Pica-Library-Android-v41.apk publish/Pica-Library-Android-Preview.apk > publish/SHA256SUMS-Android.txt
          unset ANDROID_PREVIEW_KEYSTORE_PASSWORD
          echo 'ANDROID_V41_SIGNING_AND_PACKAGE=PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Android-v41
          path: mobile/android-alpha2/publish/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '1064d06dbe488dcd8ccb4be5647bc9e8e4b48739'
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Pica-Library-Windows-v0.3.14
          path: publish/windows
      - uses: actions/download-artifact@v4
        with:
          name: Pica-Library-Android-v41
          path: publish/android
      - name: Assemble final release evidence
        run: |
          set -euo pipefail
          test -s publish/windows/Pica-Library-v0.3.14-windows-x64.zip
          test -s publish/windows/Pica-Library-v0.3.14-update.zip
          test -s publish/android/Pica-Library-Android-v41.apk
          test -s publish/android/Pica-Library-Android-Preview.apk
          test -s publish/android/android-update.json
          (cd publish && sha256sum \
            windows/Pica-Library-v0.3.14-windows-x64.zip \
            windows/Pica-Library-v0.3.14-update.zip \
            android/Pica-Library-Android-v41.apk \
            android/android-update.json \
            android/Pica-Library-Android-Preview.cert-sha256 > SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('publish')
          w=json.loads((p/'windows/BUILD_TRANSPARENCY-Windows.json').read_text(encoding='utf-8-sig'))
          a=json.loads((p/'android/BUILD_TRANSPARENCY.json').read_text(encoding='utf-8'))
          out={
              'release':'v0.3.14',
              'sourceSha':'1064d06dbe488dcd8ccb4be5647bc9e8e4b48739',
              'desktop':w,
              'android':a,
          }
          (p/'BUILD_TRANSPARENCY.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cat > publish/RELEASE_NOTES.md <<'EOF'
          Desktop v0.3.14 / Android Preview v41 · Multi-cloud WebDAV

          - 修复 123 云盘常见的 WebDAV 404：自动规范化到官方 `/webdav` 入口。
          - 为 123 云盘加入扁平对象兼容模式，绕开其目录创建（MKCOL）兼容问题；Desktop 与 Android 使用相同对象映射。
          - Desktop/Web 支持保存多个命名网盘 Target；配置多个网盘后，扫描、上传与云端副本操作必须明确选择目标，不会自动广播到所有网盘。
          - Android 同步升级为多 Target 模型，可新增、切换、编辑和删除网盘配置；漫画详情可直接切换当前网盘。
          - Android 切换网盘时会先清除上一目标的远程可用性缓存，再读取新目标，避免跨网盘目录串用。
          - 内置 123 云盘、坚果云、pCloud US/EU、Koofr、Yandex、InfiniCLOUD、Nextcloud、ownCloud、OpenList/AList、OpenDrive、Synology 与通用 WebDAV 预设/提示。
          - 旧版单 WebDAV 配置继续兼容：Desktop 旧配置按 legacy-default 读取，Android 旧配置同样无损读取；不会因为更新自动删除或移动用户漫画数据。
          - Windows 凭据继续使用 DPAPI；Android 凭据继续使用 Android Keystore。

          Windows v0.3.13 可在“设置 → 软件更新”直接增量升级到 v0.3.14；本次增量包严格声明 sourceVersionRange `=0.3.13`。更早版本请先升级到 v0.3.13 或使用完整 Windows 包。
          Android 已安装固定 Preview 签名版本可通过“连接 → 软件更新”升级到 v41；签名证书保持不变。
          EOF
      - name: Publish stable v0.3.14 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.3.14 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.3.14 already exists; refusing to overwrite a stable release' >&2
            exit 1
          fi
          gh release create v0.3.14 --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET" \
            --title 'Pica Library v0.3.14 · Multi-cloud WebDAV' \
            --notes-file publish/RELEASE_NOTES.md \
            publish/windows/Pica-Library-v0.3.14-windows-x64.zip \
            publish/windows/Pica-Library-v0.3.14-update.zip \
            publish/android/Pica-Library-Android-v41.apk \
            publish/android/android-update.json \
            publish/android/Pica-Library-Android-Preview.cert-sha256 \
            publish/SHA256SUMS.txt \
            publish/BUILD_TRANSPARENCY.json
          gh release edit v0.3.14 --repo "$GITHUB_REPOSITORY" --latest
      - name: Move Android Preview channel and replace OTA assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f android-preview "$RELEASE_TARGET"
          git push origin refs/tags/android-preview --force
          cat > publish/ANDROID_PREVIEW_NOTES.md <<'EOF'
          Android Preview v41 · Alpha8.14 Multi-cloud WebDAV

          新增多个命名 WebDAV 网盘、当前网盘切换、123 云盘兼容与常见 WebDAV Provider 预设。旧单 WebDAV 配置继续无损读取；切换网盘会清除上一目标的远程可用性缓存后再刷新。固定 Preview 签名证书保持不变。
          EOF
          if gh release view android-preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit android-preview --repo "$GITHUB_REPOSITORY" --prerelease \
              --title 'Android Preview v41 · Alpha8.14 Multi-cloud WebDAV' \
              --notes-file publish/ANDROID_PREVIEW_NOTES.md
          else
            gh release create android-preview --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --prerelease \
              --title 'Android Preview v41 · Alpha8.14 Multi-cloud WebDAV' \
              --notes-file publish/ANDROID_PREVIEW_NOTES.md
          fi
          gh release upload android-preview --repo "$GITHUB_REPOSITORY" \
            publish/android/Pica-Library-Android-Preview.apk \
            publish/android/android-update.json \
            publish/android/Pica-Library-Android-Preview.cert-sha256 \
            publish/android/BUILD_TRANSPARENCY.json \
            --clobber
      - name: Verify live Desktop and Android update channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.3.14")
          python - "$RELEASE_TARGET" "$latest" "$release" <<'PY'
          import json,sys
          target=sys.argv[1]
          latest=json.loads(sys.argv[2]); data=json.loads(sys.argv[3])
          assert latest['tag_name']=='v0.3.14',latest['tag_name']
          assert data['tag_name']=='v0.3.14',data
          assert data['target_commitish']==target or data['tag_name']=='v0.3.14'
          assert not data['draft'] and not data['prerelease'],data
          names={x['name'] for x in data['assets']}
          required={'Pica-Library-v0.3.14-windows-x64.zip','Pica-Library-v0.3.14-update.zip','Pica-Library-Android-v41.apk','SHA256SUMS.txt','BUILD_TRANSPARENCY.json'}
          assert required <= names,(required-names)
          print('STABLE_LATEST_RELEASE=PASS')
          PY

          curl -L --fail --retry 8 --retry-delay 3 \
            'https://github.com/Saber-Alter-Lily/pica-library/releases/download/v0.3.14/Pica-Library-v0.3.14-update.zip' \
            -o "$RUNNER_TEMP/live-desktop-update.zip"
          curl -L --fail --retry 8 --retry-delay 3 \
            'https://github.com/Saber-Alter-Lily/pica-library/releases/download/v0.3.14/SHA256SUMS.txt' \
            -o "$RUNNER_TEMP/live-sha256s.txt"
          python - "$RUNNER_TEMP/live-desktop-update.zip" "$RUNNER_TEMP/live-sha256s.txt" "$RELEASE_TARGET" <<'PY'
          import hashlib,json,sys,zipfile
          update,sums,target=sys.argv[1:]
          actual=hashlib.sha256(open(update,'rb').read()).hexdigest()
          expected=None
          for line in open(sums,encoding='utf-8'):
              parts=line.strip().split(None,1)
              if len(parts)==2 and parts[1].endswith('Pica-Library-v0.3.14-update.zip'):
                  expected=parts[0].lower(); break
          assert expected and actual==expected,(actual,expected)
          with zipfile.ZipFile(update) as z:
              manifest=json.loads(z.read('update-manifest.json'))
          assert manifest['sourceVersionRange']=='=0.3.13',manifest
          assert manifest['targetVersion']=='0.3.14',manifest
          assert manifest['targetSourceSha']==target,manifest
          assert not manifest.get('requiresFullInstall',False),manifest
          print('DESKTOP_LIVE_INCREMENTAL_UPDATE=PASS')
          PY

          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/android-preview" --jq '.object.sha')
          test "$ref" = "$RELEASE_TARGET"
          curl -L --fail --retry 8 --retry-delay 3 \
            'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/android-update.json' \
            -o "$RUNNER_TEMP/live-android-update.json"
          curl -L --fail --retry 8 --retry-delay 3 \
            'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.apk' \
            -o "$RUNNER_TEMP/live-android.apk"
          curl -L --fail --retry 8 --retry-delay 3 \
            'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.cert-sha256' \
            -o "$RUNNER_TEMP/live-android-cert.txt"
          python - "$RUNNER_TEMP/live-android-update.json" "$RUNNER_TEMP/live-android.apk" "$RUNNER_TEMP/live-android-cert.txt" "$EXPECTED_CERT" <<'PY'
          import hashlib,json,sys
          manifest=json.load(open(sys.argv[1],encoding='utf-8'))
          apk=open(sys.argv[2],'rb').read()
          cert=open(sys.argv[3],encoding='utf-8').read().strip().lower()
          assert manifest['versionCode']==41,manifest
          assert manifest['versionName']=='0.1.0-alpha8.14-multi-remote-storage',manifest
          assert hashlib.sha256(apk).hexdigest()==manifest['sha256'],manifest
          assert cert==sys.argv[4].lower(),(cert,sys.argv[4])
          print('ANDROID_PREVIEW_LIVE_OTA=PASS')
          PY
          echo 'V0_3_14_PUBLICATION_AND_UPDATE_CHANNELS=PASS'
