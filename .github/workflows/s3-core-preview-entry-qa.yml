name: S3 actual independent source-free Desktop preview entry QA (unpublished)

on:
  push:
    branches:
      - codex/s3-core-preview-entry-20261029
    paths:
      - '.github/workflows/s3-core-preview-entry-qa.yml'
      - 'src/desktop/core-preview-main.ts'
      - 'src/desktop/instance.ts'
      - 'src/offline-core/**'
      - 'src/library/core-runtime-composition.ts'
      - 'scripts/build-offline-core-candidate.ts'
      - 'scripts/stage-offline-full-web-qa.ts'
      - 'test/unit/core-desktop-preview-entry.test.ts'
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s3-independent-core-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physically-independent-desktop-entry:
    if: github.repository == 'Saber-Alter-Lily/pica-library'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Typecheck full Desktop and standalone source-free core
        run: pnpm type:check
      - name: Real independent esbuild, owned profile, loopback, original full Web, single-instance and restart
        run: pnpm exec vitest run test/unit/core-desktop-preview-entry.test.ts test/unit/core-runtime-composition.test.ts test/unit/offline-core-candidate.test.ts test/unit/offline-full-web-http.test.ts
