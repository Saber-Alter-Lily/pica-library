name: Mobile Alpha 2

on:
  push:
    branches: [android-v0.1-alpha]
    paths:
      - 'src/mobile/**'
      - 'scripts/apply-mobile-alpha2-patch.mjs'
      - 'test/unit/mobile-bridge.test.ts'
      - 'mobile/android-alpha2/**'
      - '.github/workflows/mobile-alpha2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Stage Android source
        run: |
          rm -rf android-app
          cp -R mobile/android-alpha2 android-app
      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Pica-Library-Android-v0.1.0-alpha2.apk
          sha256sum Pica-Library-Android-v0.1.0-alpha2.apk | tee Pica-Library-Android-v0.1.0-alpha2.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Android-v0.1.0-alpha2
          path: |
            Pica-Library-Android-v0.1.0-alpha2.apk
            Pica-Library-Android-v0.1.0-alpha2.sha256
          retention-days: 7

  windows-mobile-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Mobile Bridge alpha patch
        run: node scripts/apply-mobile-alpha2-patch.mjs
      - name: Mobile Bridge unit test
        run: pnpm exec vitest run test/unit/mobile-bridge.test.ts
      - name: Restore accepted v0.2.0 launcher base
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $url = 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/v0.2.0/Pica-Library-v0.2.0-windows-x64.zip'
          $file = 'artifacts\Pica-Library-v0.2.0-windows-x64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $file
          $sha = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '219d853bad6c0193adfcae2837c54f3bc72644aab664d1dae55c55259682d75e') {
            throw "v0.2.0 launcher base SHA mismatch: $sha"
          }
      - run: pnpm build:windows
      - name: Rename candidate
        shell: powershell
        run: |
          Copy-Item artifacts\Pica-Library-v0.3.0-windows-x64.zip artifacts\Pica-Library-v0.3.0-mobile-alpha2-windows-x64.zip
          $sha = (Get-FileHash artifacts\Pica-Library-v0.3.0-mobile-alpha2-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  Pica-Library-v0.3.0-mobile-alpha2-windows-x64.zip" | Set-Content artifacts\Pica-Library-v0.3.0-mobile-alpha2-windows-x64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Windows-Mobile-Bridge-alpha2
          path: |
            artifacts/Pica-Library-v0.3.0-mobile-alpha2-windows-x64.zip
            artifacts/Pica-Library-v0.3.0-mobile-alpha2-windows-x64.sha256
          retention-days: 7
