name: v0.5.1 Formal Release Candidate

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [codex/release-v051-reader-polish]

permissions:
  contents: read

env:
  TARGET_VERSION: '0.5.1'
  ANDROID_VERSION_CODE: '56'
  BASE_VERSION: '0.5.0'
  BASE_WINDOWS_SHA256: '14b92b60660b6694e2c8c19a2c1da695127de8dfd0fbafd6bd36fc8b5bc3d2bf'
  EXPECTED_CERT: '64fb87dc7d8bd6bc7b2cec92cc8c83fad3afe8cfb07591a2e53d53cbd3ab2f9d'

jobs:
  windows-tests:
    if: github.event.repository.private == false && github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Re-run Desktop release gates from permanent stamp
        shell: pwsh
        run: |
          pnpm type:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm web:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-candidate:
    if: github.event.repository.private == false && github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: windows-latest
    timeout-minutes: 56
    env:
      PICA_LIBRARY_BUILD_PROVENANCE: ${{ github.sha }}
      PICA_WINDOWS_LAUNCHER_BASE_VERSION: '0.5.0'
      PICA_WINDOWS_LAUNCHER_BASE_SHA256: '14b92b60660b6694e2c8c19a2c1da695127de8dfd0fbafd6bd36fc8b5bc3d2bf'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile

      - name: Download checksum-pinned public v0.5.0 baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\release-base | Out-Null
          $name="Pica-Library-v$env:BASE_VERSION-windows-x64.zip"
          $path=Join-Path 'artifacts\release-base' $name
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/Saber-Alter-Lily/pica-library/releases/download/v$env:BASE_VERSION/$name" -OutFile $path
          $actual=(Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
          if($actual -ne $env:BASE_WINDOWS_SHA256){ throw "Official v$env:BASE_VERSION package checksum mismatch: $actual" }
      - name: Verify permanent Desktop release stamp
        shell: pwsh
        run: |
          node -e "const p=require('./package.json'); if(p.version!==process.env.TARGET_VERSION) throw new Error('Repository version is not permanently stamped to '+process.env.TARGET_VERSION+': '+p.version)"
      - name: Build formal-layout Windows candidate
        shell: pwsh
        run: |
          pnpm build:windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $target="artifacts\Pica-Library-v$env:TARGET_VERSION-windows-x64.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive=[IO.Compression.ZipFile]::OpenRead((Resolve-Path $target))
          try { foreach($name in @('web/reader-ux-051.js','web/reader-ux-051.css')) { if(-not $archive.GetEntry($name)){throw "Missing runtime asset $name"} } } finally {$archive.Dispose()}
          ./scripts/test-windows-artifact.ps1 -Zip $target -ExpectedVersion $env:TARGET_VERSION -PortCollision -SetupPersistence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and exercise v0.5.0 one-click bridge
        shell: pwsh
        run: |
          $base="artifacts\release-base\Pica-Library-v$env:BASE_VERSION-windows-x64.zip"
          $target="artifacts\Pica-Library-v$env:TARGET_VERSION-windows-x64.zip"
          $incremental="artifacts\Pica-Library-v$env:TARGET_VERSION-update-from-v$env:BASE_VERSION.zip"
          pnpm build:local-update $base $target $incremental
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-windows-v050-incremental-upgrade.ps1 -BaselineZip $base -CandidateZip $target -IncrementalZip $incremental -CandidateVersion $env:TARGET_VERSION -CandidateSourceSha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the official v0.5.0 Settings one-click button in Edge
        shell: pwsh
        run: |
          # Same pinned driver as run-web-browser-smoke.sh, installed outside the release tree.
          npm install --prefix "$env:RUNNER_TEMP/pica-051-browser" --no-save --ignore-scripts --package-lock=false playwright-core@1.63.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/acceptance/v051-button-upgrade.mjs "artifacts/release-base/Pica-Library-v0.5.0-windows-x64.zip" "artifacts/Pica-Library-v0.5.1-update-from-v0.5.0.zip" $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise official v0.5.0 full-update runtime
        shell: pwsh
        run: |
          ./scripts/test-windows-universal-full-upgrade.ps1 -BaselineZip "artifacts/release-base/Pica-Library-v0.5.0-windows-x64.zip" -CandidateZip "artifacts/Pica-Library-v0.5.1-windows-x64.zip" -CandidateVersion $env:TARGET_VERSION -CandidateSourceSha $env:GITHUB_SHA
      - name: Build checksum-bound fallback Upgrade Assistant
        shell: pwsh
        run: |
          $target="artifacts\Pica-Library-v$env:TARGET_VERSION-windows-x64.zip"
          $assistant="artifacts\Pica-Library-v$env:TARGET_VERSION-upgrade-assistant-from-v$env:BASE_VERSION.zip"
          pnpm build:upgrade-assistant $env:BASE_VERSION $env:TARGET_VERSION $target $env:GITHUB_SHA 14 $assistant
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $work=Join-Path $env:RUNNER_TEMP 'pica-v051-assistant-parse'
          Expand-Archive -LiteralPath $assistant -DestinationPath $work
          $script=Get-Content -Raw -LiteralPath (Join-Path $work 'Upgrade-Pica-Library-v0.5.1.ps1')
          [scriptblock]::Create($script) | Out-Null
          if(-not $script.Contains('$RequiredSourceVersion = ''0.5.0''')){ throw 'Fallback assistant source version mismatch' }
          if(-not $script.Contains('$ExpectedDatabaseSchema = 14')){ throw 'Fallback assistant schema mismatch' }
      - name: Assemble Windows candidate evidence
        shell: pwsh
        run: |
          $names=@(
            "Pica-Library-v$env:TARGET_VERSION-windows-x64.zip",
            "Pica-Library-v$env:TARGET_VERSION-update-from-v$env:BASE_VERSION.zip",
            "Pica-Library-v$env:TARGET_VERSION-upgrade-assistant-from-v$env:BASE_VERSION.zip"
          )
          $lines=@()
          foreach($name in $names){
            $path=Join-Path 'artifacts' $name
            if(-not (Test-Path -LiteralPath $path)){ throw "Missing candidate asset: $name" }
            $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            $lines += "$hash  $name"
          }
          $lines | Set-Content -Encoding ascii 'artifacts\SHA256SUMS-v051-candidate.txt'
          [ordered]@{
            candidateVersion=$env:TARGET_VERSION
            sourceSha=$env:GITHUB_SHA
            publicBaseline=$env:BASE_VERSION
            databaseSchema=14
            appApi=2
            launcherBaseVersion=$env:BASE_VERSION
            publishAuthorized=$false
            otaMutated=$false
          } | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 'artifacts\BUILD_TRANSPARENCY-v051-Windows-candidate.json'
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-v0.5.1-Windows-Formal-Candidate
          path: |
            artifacts/Pica-Library-v0.5.1-windows-x64.zip
            artifacts/Pica-Library-v0.5.1-update-from-v0.5.0.zip
            artifacts/Pica-Library-v0.5.1-upgrade-assistant-from-v0.5.0.zip
            artifacts/SHA256SUMS-v051-candidate.txt
            artifacts/BUILD_TRANSPARENCY-v051-Windows-candidate.json
          retention-days: 1
          if-no-files-found: error

  android-candidate:
    if: github.event.repository.private == false && github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and lint Android
        working-directory: mobile/android-alpha2
        run: gradle :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Download public v55 identity
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/Saber-Alter-Lily/pica-library/releases/download/v0.5.0/Pica-Library-Android-v55.apk" -o "$RUNNER_TEMP/Pica-Library-Android-v55.apk"
          curl -fL --retry 3 "https://github.com/Saber-Alter-Lily/pica-library/releases/download/v0.5.0/Pica-Library-Android-v55.cert-sha256" -o "$RUNNER_TEMP/v55-cert.txt"
          echo "0bfe382b9026b7942309ac5a1e7cfefc676c0ea3e4e85f288d15d33fead8f598  $RUNNER_TEMP/Pica-Library-Android-v55.apk" | sha256sum -c -
          oldcert="$(tr -d '\r\n ' < "$RUNNER_TEMP/v55-cert.txt")"
          test "$oldcert" = "$EXPECTED_CERT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$RUNNER_TEMP/Pica-Library-Android-v55.apk" > "$RUNNER_TEMP/v55-badging.txt"
          grep -q "package: name='com.picalibrary.android' versionCode='55' versionName='0.5.0'" "$RUNNER_TEMP/v55-badging.txt"
      - name: Build signed production-identity v56 candidate
        working-directory: mobile/android-alpha2
        env:
          ANDROID_PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
          ANDROID_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
          PICA_ANDROID_VERSION_CODE: '56'
          PICA_ANDROID_VERSION_NAME: '0.5.1'
        run: |
          set -euo pipefail
          test -n "$ANDROID_PREVIEW_KEYSTORE_B64"
          test -n "$ANDROID_PREVIEW_KEYSTORE_PASSWORD"
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/pica-v051-signing-XXXXXXXX")"
          export ANDROID_PREVIEW_KEYSTORE_PATH="$signing_dir/preview.jks"
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$ANDROID_PREVIEW_KEYSTORE_B64" | base64 --decode > "$ANDROID_PREVIEW_KEYSTORE_PATH"
          unset ANDROID_PREVIEW_KEYSTORE_B64
          gradle :app:assembleRelease --no-daemon
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/v56-badging.txt"
          grep -q "package: name='com.picalibrary.android' versionCode='56' versionName='0.5.1'" "$RUNNER_TEMP/v56-badging.txt"
          grep -q "application-label:'Pica Library'" "$RUNNER_TEMP/v56-badging.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/v56-cert.txt"
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/v56-cert.txt" | head -1 | tr 'A-F' 'a-f')"
          oldcert="$(tr -d '\r\n ' < "$RUNNER_TEMP/v55-cert.txt")"
          test "$cert" = "$EXPECTED_CERT"
          test "$cert" = "$oldcert"
          mkdir -p candidate
          cp "$apk" candidate/Pica-Library-Android-v56.apk
          sha="$(sha256sum candidate/Pica-Library-Android-v56.apk | awk '{print $1}')"
          printf '%s\n' "$cert" > candidate/CERTIFICATE_SHA256.txt
          printf '%s  %s\n' "$sha" 'Pica-Library-Android-v56.apk' > candidate/SHA256SUMS-Android.txt
          cat > candidate/android-update.json <<JSON
          {
            "versionCode": 56,
            "versionName": "0.5.1",
            "apkUrl": "https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.apk",
            "sha256": "$sha",
            "releaseNotes": "v0.5.1：作者订阅更新书架、随机重排、推荐轮次与多章节阅读优化。",
            "minimumSupportedVersionCode": 42
          }
          JSON
          python - "$sha" "$cert" "$GITHUB_SHA" <<'PY'
          import json,sys
          sha,cert,source=sys.argv[1:]
          out={
            "candidateVersion":"0.5.1",
            "versionCode":56,
            "sourceSha":source,
            "apkSha256":sha,
            "signerCertificateSha256":cert,
            "upgradeFromVersionCode":55,
            "packageName":"com.picalibrary.android",
            "publishAuthorized":False,
            "otaMutated":False
          }
          with open("candidate/BUILD_TRANSPARENCY-v051-Android-candidate.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - name: Enable KVM for Android in-place upgrade acceptance
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prove v55 -> v56 is an in-place Android package update
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: >-
            bash scripts/test-android-v55-v56-inplace.sh
            "$RUNNER_TEMP/Pica-Library-Android-v55.apk"
            "mobile/android-alpha2/candidate/Pica-Library-Android-v56.apk"
            "com.picalibrary.android"
            "55"
            "56"
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-v0.5.1-Android-v56-Formal-Candidate
          path: mobile/android-alpha2/candidate/
          retention-days: 1
          if-no-files-found: error
