name: Live GitHub account auth acceptance

on:
  push:
    branches: [feature/v0.3.8-auth-theme-disclaimer]
    paths:
      - '.github/workflows/live-github-account-auth-acceptance.yml'

permissions:
  contents: read

jobs:
  start-auth:
    runs-on: ubuntu-latest
    env:
      CLIENT_ID: 'Iv23li2rIouPPVGgMoyI'
    steps:
      - name: Request one-time GitHub device code
        shell: bash
        run: |
          set -euo pipefail
          START=$(curl --fail-with-body -sS -X POST \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=$CLIENT_ID" \
            https://github.com/login/device/code)
          DEVICE_CODE=$(printf '%s' "$START" | jq -r '.device_code // empty')
          USER_CODE=$(printf '%s' "$START" | jq -r '.user_code // empty')
          VERIFY_URI=$(printf '%s' "$START" | jq -r '.verification_uri // empty')
          INTERVAL=$(printf '%s' "$START" | jq -r '.interval // 5')
          EXPIRES_IN=$(printf '%s' "$START" | jq -r '.expires_in // 900')
          test -n "$DEVICE_CODE"
          test -n "$USER_CODE"
          test "$VERIFY_URI" = 'https://github.com/login/device'
          printf '%s\n%s\n%s\n' "$DEVICE_CODE" "$INTERVAL" "$EXPIRES_IN" > "$RUNNER_TEMP/device-flow-state.txt"
          echo "PICA_GITHUB_DEVICE_URL=$VERIFY_URI"
          echo "PICA_GITHUB_DEVICE_CODE=$USER_CODE"
          echo "PICA_GITHUB_DEVICE_EXPIRES_IN=$EXPIRES_IN"
      - name: Preserve private polling state
        uses: actions/upload-artifact@v4
        with:
          name: pica-live-device-flow-state
          path: ${{ runner.temp }}/device-flow-state.txt
          retention-days: 1
          include-hidden-files: false

  verify-auth:
    needs: start-auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLIENT_ID: 'Iv23li2rIouPPVGgMoyI'
      EXPECTED_LOGIN: 'Saber-Alter-Lily'
      REPOSITORY: 'Saber-Alter-Lily/pica-library'
    steps:
      - name: Restore polling state
        uses: actions/download-artifact@v4
        with:
          name: pica-live-device-flow-state
          path: ${{ runner.temp }}/pica-live-auth
      - name: Wait for authenticated account and verify Star
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t STATE < "$RUNNER_TEMP/pica-live-auth/device-flow-state.txt"
          DEVICE_CODE="${STATE[0]}"
          INTERVAL="${STATE[1]:-5}"
          EXPIRES_IN="${STATE[2]:-900}"
          DEADLINE=$(( $(date +%s) + EXPIRES_IN - 10 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            sleep "$INTERVAL"
            TOKEN_JSON=$(curl --fail-with-body -sS -X POST \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "client_id=$CLIENT_ID" \
              --data-urlencode "device_code=$DEVICE_CODE" \
              --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:device_code' \
              https://github.com/login/oauth/access_token)
            ERROR=$(printf '%s' "$TOKEN_JSON" | jq -r '.error // empty')
            if [ "$ERROR" = 'authorization_pending' ]; then continue; fi
            if [ "$ERROR" = 'slow_down' ]; then INTERVAL=$(( INTERVAL + 5 )); continue; fi
            if [ -n "$ERROR" ]; then echo "GitHub Device Flow failed: $ERROR" >&2; exit 1; fi
            TOKEN=$(printf '%s' "$TOKEN_JSON" | jq -r '.access_token // empty')
            test -n "$TOKEN"
            echo "::add-mask::$TOKEN"

            IDENTITY=$(curl --fail-with-body -sS \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H "Authorization: Bearer $TOKEN" \
              https://api.github.com/user)
            LOGIN=$(printf '%s' "$IDENTITY" | jq -r '.login // empty')
            USER_ID=$(printf '%s' "$IDENTITY" | jq -r '.id // empty')
            test "$LOGIN" = "$EXPECTED_LOGIN"
            test -n "$USER_ID"

            STAR_STATUS=$(curl -sS -o /tmp/star-response -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.github.com/user/starred/$REPOSITORY")
            test "$STAR_STATUS" = '204'
            echo "AUTHENTICATED_LOGIN=$LOGIN"
            echo "AUTHENTICATED_USER_ID=$USER_ID"
            echo "AUTHENTICATED_STAR_STATUS=$STAR_STATUS"
            echo 'LIVE_GITHUB_ACCOUNT_AUTH_ACCEPTANCE=PASS'
            exit 0
          done
          echo 'Timed out waiting for GitHub Device Flow authorization' >&2
          exit 1

# live acceptance retry 2
