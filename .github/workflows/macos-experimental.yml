name: Experimental macOS arm64 Package

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'scripts/build-macos-experimental.sh'
      - 'scripts/test-macos-experimental.sh'
      - 'scripts/test-macos-preview-acceptance.sh'
      - 'scripts/test-macos-preview-replacement.sh'
      - 'scripts/test-macos-app-bundle.sh'
      - 'rollup.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/macos-experimental.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'web/**'
      - 'scripts/build-macos-experimental.sh'
      - 'scripts/test-macos-experimental.sh'
      - 'scripts/test-macos-preview-acceptance.sh'
      - 'scripts/test-macos-preview-replacement.sh'
      - 'scripts/test-macos-app-bundle.sh'
      - 'rollup.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/macos-experimental.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64-experimental:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert Apple Silicon runner
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false

      - run: pnpm install --frozen-lockfile

      - name: Build experimental macOS arm64 package
        run: bash scripts/build-macos-experimental.sh

      - name: Build first W4A macOS preview baseline for replacement gate
        env:
          BASE_SHA: 0d11cee2e73f449c66f6aeb42655325a2d8d1760
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/pica-macos-preview-baseline"
          rm -rf "$baseline"
          git worktree add --detach "$baseline" "$BASE_SHA"
          cleanup() {
            git worktree remove --force "$baseline" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          mkdir -p "$baseline/artifacts/cache"
          if [ -d artifacts/cache ]; then
            cp -R artifacts/cache/. "$baseline/artifacts/cache/"
          fi
          (
            cd "$baseline"
            pnpm install --frozen-lockfile
            bash scripts/build-macos-experimental.sh
          )
          baseline_archive="$(find "$baseline/artifacts" -maxdepth 1 -type f -name 'Pica-Library-*-macos-arm64-experimental.tar.gz' -print | head -n 1)"
          test -n "$baseline_archive"
          cp "$baseline_archive" artifacts/Pica-Library-macos-arm64-preview-baseline.tar.gz
          cleanup
          trap - EXIT

      - name: Smoke packaged macOS arm64 runtime
        run: |
          set -euo pipefail
          archive="$(find artifacts -maxdepth 1 -type f -name 'Pica-Library-*-macos-arm64-experimental.tar.gz' -print | head -n 1)"
          test -n "$archive"
          bash scripts/test-macos-experimental.sh "$archive"

      - name: Run macOS arm64 preview vertical acceptance
        run: |
          set -euo pipefail
          archive="$(find artifacts -maxdepth 1 -type f -name 'Pica-Library-*-macos-arm64-experimental.tar.gz' -print | head -n 1)"
          test -n "$archive"
          bash scripts/test-macos-preview-acceptance.sh "$archive"

      - name: Run macOS preview replacement and rollback acceptance
        run: |
          set -euo pipefail
          baseline="artifacts/Pica-Library-macos-arm64-preview-baseline.tar.gz"
          candidate="$(find artifacts -maxdepth 1 -type f -name 'Pica-Library-*-macos-arm64-experimental.tar.gz' -print | head -n 1)"
          test -f "$baseline"
          test -n "$candidate"
          bash scripts/test-macos-preview-replacement.sh "$baseline" "$candidate"

      - name: Run standalone macOS app-bundle acceptance
        run: |
          set -euo pipefail
          archive="$(find artifacts -maxdepth 1 -type f -name 'Pica-Library-*-macos-arm64-experimental.tar.gz' -print | head -n 1)"
          test -n "$archive"
          bash scripts/test-macos-app-bundle.sh "$archive"

      - name: Upload experimental macOS arm64 artifact
        if: github.event.repository.private == false
        uses: actions/upload-artifact@v4
        with:
          name: pica-library-macos-arm64-experimental-${{ github.sha }}
          path: |
            artifacts/Pica-Library-*-macos-arm64-experimental.tar.gz
            artifacts/MACOS-EXPERIMENTAL-SHA256SUMS.txt
          retention-days: 1
          if-no-files-found: error
