name: Install validated README poster binaries

on:
  push:
    paths:
      - '.github/workflows/install-final-readme-posters.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Restore exact binary blobs and validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p docs/assets
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/d5b45478a2cb9be8204ac746681df34d967ff882" --jq .content | tr -d '\n' | base64 -d > docs/assets/desktop-overview-v0311-final.jpg
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/faf96802554d522c6d5c75273299a83e5b08c9ab" --jq .content | tr -d '\n' | base64 -d > docs/assets/android-overview-v38-final.jpg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          expected = {
              Path('docs/assets/desktop-overview-v0311-final.jpg'): (700, 989),
              Path('docs/assets/android-overview-v38-final.jpg'): (700, 746),
          }
          for path, size in expected.items():
              data = path.read_bytes()
              assert data[:3] == b'\xff\xd8\xff', (path, data[:12].hex())
              with Image.open(path) as im:
                  im.load()
                  assert im.format == 'JPEG', (path, im.format)
                  assert im.size == size, (path, im.size, size)
                  print(path, im.format, im.size, len(data))
          docs = [
              Path('README.md'), Path('README.en.md'),
              Path('docs/desktop-guide.zh-CN.md'), Path('docs/android-guide.zh-CN.md'),
              Path('docs/desktop-guide.en.md'), Path('docs/android-guide.en.md'),
          ]
          for path in docs:
              text = path.read_text(encoding='utf-8')
              if 'desktop' in path.name.lower() or path.name.startswith('README'):
                  assert 'desktop-overview-v0311-final.jpg' in text, path
              if 'android' in path.name.lower() or path.name.startswith('README'):
                  assert 'android-overview-v38-final.jpg' in text, path
          print('FINAL_POSTERS_DECODE=PASS')
          PY
      - name: Remove corrupt legacy assets and temporary staging
        run: |
          set -euo pipefail
          rm -f docs/assets/desktop-overview.webp docs/assets/android-overview.webp
          rm -f docs/assets/desktop-overview.jpg docs/assets/android-overview.jpg
          rm -rf .tmp-readme-assets
          git rm --ignore-unmatch .github/workflows/install-final-readme-posters.yml
      - name: Commit final poster assets
        run: |
          set -euo pipefail
          git config user.name 'Saber-Alter-Lily'
          git config user.email '3178088154@qq.com'
          git add -A docs/assets .tmp-readme-assets .github/workflows/install-final-readme-posters.yml
          git diff --cached --check
          git commit -m 'docs: install validated final README posters'
          git push origin HEAD:main
