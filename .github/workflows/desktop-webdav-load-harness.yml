name: Desktop WebDAV Foreground Latency Harness

on:
  push:
    branches: [main]
    paths:
      - 'scripts/benchmark/http-latency-scenario.ts'
      - 'scripts/benchmark/desktop-webdav-load-harness.ts'
      - 'scripts/run-desktop-webdav-load-harness.mjs'
      - 'test/unit/http-latency-scenario-p2j2.test.ts'
      - 'test/unit/desktop-webdav-load-benchmark-p2j9.test.ts'
      - 'src/remote-storage/**'
      - 'src/runtime/resource-coordinator.ts'
      - 'docs/DESKTOP_WEBDAV_FOREGROUND_LATENCY_P2J9.md'
      - 'DEVELOPMENT_TASK_LOG.md'
      - 'package.json'
      - '.github/workflows/desktop-webdav-load-harness.yml'
  pull_request:
    paths:
      - 'scripts/benchmark/http-latency-scenario.ts'
      - 'scripts/benchmark/desktop-webdav-load-harness.ts'
      - 'scripts/run-desktop-webdav-load-harness.mjs'
      - 'test/unit/http-latency-scenario-p2j2.test.ts'
      - 'test/unit/desktop-webdav-load-benchmark-p2j9.test.ts'
      - 'src/remote-storage/**'
      - 'src/runtime/resource-coordinator.ts'
      - 'docs/DESKTOP_WEBDAV_FOREGROUND_LATENCY_P2J9.md'
      - 'DEVELOPMENT_TASK_LOG.md'
      - 'package.json'
      - '.github/workflows/desktop-webdav-load-harness.yml'

permissions:
  contents: read

jobs:
  webdav-foreground-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run J2/J9 contract tests
        run: >-
          pnpm exec vitest run
          test/unit/http-latency-scenario-p2j2.test.ts
          test/unit/desktop-webdav-load-benchmark-p2j9.test.ts
      - name: Run controlled WebDAV foreground-latency harness smoke
        run: >-
          pnpm benchmark:desktop-webdav-load --
          --rounds=1
          --iterations=3
          --warmup=1
          --interval-ms=10
          --pages=160
          --bytes-per-page=8192
          --request-delay-ms=20
          --output=test-results/desktop-webdav-load/j9-smoke.json
      - name: Upload J9 harness diagnostics
        if: always() && github.event.repository.private == false
        uses: actions/upload-artifact@v4
        with:
          name: desktop-webdav-load-${{ github.run_id }}-${{ github.job }}
          path: test-results/desktop-webdav-load/
          retention-days: 1
          if-no-files-found: ignore
