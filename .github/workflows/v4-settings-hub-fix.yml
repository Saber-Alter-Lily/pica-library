name: Recommendation V4 settings hub fix

on:
  push:
    branches: [feature/recommendation-v4-visual-feedback]
    paths:
      - 'scripts/apply-v4-settings-hub-fix.mjs'
      - '.github/workflows/v4-settings-hub-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recommendation-v4-visual-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply deterministic settings hub fix
        run: node scripts/apply-v4-settings-hub-fix.mjs
      - name: Remove one-shot files
        run: |
          rm scripts/apply-v4-settings-hub-fix.mjs
          rm .github/workflows/v4-settings-hub-fix.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/alpha8-7-desktop-hub.js test/unit/recommendation-v4-settings-hub.test.ts scripts/apply-v4-settings-hub-fix.mjs .github/workflows/v4-settings-hub-fix.yml
          git commit -m 'fix: expose E-H and visual settings in desktop hub'
          git push origin HEAD:feature/recommendation-v4-visual-feedback
