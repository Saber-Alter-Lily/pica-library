name: Real source Host interop (synthetic local source only)

on:
  push:
    branches: [codex/source-host-interop-20261026]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: source-host-interop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-host:
    if: github.event.repository.private == false && github.repository == 'Saber-Alter-Lily/pica-library' && github.ref == 'refs/heads/codex/source-host-interop-20261026' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Frozen dependencies and source contracts
        run: |
          pnpm install --frozen-lockfile
          pnpm type:check
          pnpm exec tsc --project scripts/tsconfig.source-host-interop.json
          pnpm exec vitest run test/unit/source-host-interop-gate.test.ts test/unit/source-host-contract.test.ts test/unit/source-host-http.test.ts --maxWorkers=2 --minWorkers=1
      - name: Download the immutable official Host, not an app component
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/pica-host-interop-input"
          curl --fail --location --max-time 180 'https://github.com/Suwayomi/Suwayomi-Server/releases/download/v2.4.2366/Suwayomi-Server-v2.4.2366.jar' --output "$RUNNER_TEMP/pica-host-interop-input/host.jar"
          printf '%s  %s\n' 'af9feb20af9d7ebe9e30769e6c6ebc7fc7ab1c447388d42e0280b1da5fe07bfd' "$RUNNER_TEMP/pica-host-interop-input/host.jar" | sha256sum --check -
          test "$(stat --format=%s "$RUNNER_TEMP/pica-host-interop-input/host.jar")" = '182952426'
      - name: Real upstream runtime and fresh-process offline Reader, network isolated
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo env PATH="$PATH" JAVA_HOME="$JAVA_HOME" RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_REF="$GITHUB_REF" GITHUB_SHA="$GITHUB_SHA" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            PICA_NODE="$(command -v node)" PICA_HOST_OUTER_NETNS="$(readlink /proc/self/ns/net)" \
            PICA_HOST_INTEROP_JAR="$RUNNER_TEMP/pica-host-interop-input/host.jar" \
            unshare --net --fork --kill-child bash -euc '
              ip link set lo up
              export PICA_HOST_INTEROP_NETNS=1
              exec "$PICA_NODE" scripts/test-source-host-interop.mjs main "$GITHUB_SHA"
            '
      - name: Keep only bounded diagnostics, never host binaries, images or databases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Real-Host-Interop-Diagnostics
          path: |
            artifacts/source-host-interop/result.json
            artifacts/source-host-interop/host-startup-tail.txt
          retention-days: 1
          if-no-files-found: warn
