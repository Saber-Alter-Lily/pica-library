name: Publish Desktop v0.3.3 updater resilience

on:
  push:
    paths:
      - '.github/workflows/publish-v033-resilience.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_REPO: 'Saber-Alter-Lily/pica-library'
      ARTIFACT_URL: 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-62d0-81fb-b6c5-36f5e0d11493/raw?se=2026-09-10T10%3A43%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=b84758f7-4253-5415-b8cc-52eaef6ec319&skoid=80e81ea6-3c08-46f9-bd84-b87176742bcd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T03%3A22%3A53Z&ske=2026-09-11T03%3A22%3A53Z&sks=b&skv=2026-02-06&sig=qyqO2HxojjjdIhB4viP%2BMymDws9C8CirLHmtTvwMfCY%3D'
      EXPECTED_FULL_SHA: 'fa7e2e282e471bc2e9ee0a0c4c9d2616c97f9383d5b034e019833b8e5ec62e0f'
      EXPECTED_UPDATE_SHA: 'a939e6380337925d890defcfb7e7a84bc5eeb948f1949101ab30e4acdd6b3f53'
      BUILD_PROVENANCE: '3590c67ce3c3ae95b88643fed3945a1b0b7c5189'
      RELEASE_TARGET: '7bae09df5f28b7595f6f03eb260404f29890f721'
    steps:
      - name: Download and verify private validated artifact
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 1 "$ARTIFACT_URL" -o "$RUNNER_TEMP/v033.zip"
          mkdir -p publish
          unzip -q "$RUNNER_TEMP/v033.zip" -d publish
          FULL=publish/Pica-Library-v0.3.3-windows-x64.zip
          UPDATE=publish/Pica-Library-v0.3.3-update.zip
          test -s "$FULL" && test -s "$UPDATE"
          test "$(sha256sum "$FULL" | cut -d' ' -f1)" = "$EXPECTED_FULL_SHA"
          test "$(sha256sum "$UPDATE" | cut -d' ' -f1)" = "$EXPECTED_UPDATE_SHA"
          mv publish/SHA256SUMS-v0.3.3.txt publish/SHA256SUMS.txt
          grep -q "$EXPECTED_FULL_SHA  Pica-Library-v0.3.3-windows-x64.zip" publish/SHA256SUMS.txt
          grep -q "$EXPECTED_UPDATE_SHA  Pica-Library-v0.3.3-update.zip" publish/SHA256SUMS.txt
          python - <<'PY'
          import json,zipfile,os
          from pathlib import Path
          p=Path('publish/Pica-Library-v0.3.3-update.zip')
          with zipfile.ZipFile(p) as z:
              m=json.loads(z.read('update-manifest.json'))
          assert m['sourceVersionRange']=='=0.3.1 || =0.3.2',m
          assert 'sourceSha' not in m,m
          assert m['targetVersion']=='0.3.3',m
          assert m['targetSourceSha']==os.environ['BUILD_PROVENANCE'],m
          assert m['requiresFullInstall'] is False,m
          transparency={
            'releaseId':'desktop-v0.3.3-updater-resilience',
            'sourcePolicy':'delayed-source-release',
            'version':'0.3.3',
            'fullZipSha256':os.environ['EXPECTED_FULL_SHA'],
            'updateZipSha256':os.environ['EXPECTED_UPDATE_SHA'],
            'buildProvenance':os.environ['BUILD_PROVENANCE'],
            'sourceVersionRange':'=0.3.1 || =0.3.2',
            'fixes':['github-rest-release-fallback','sha256sums-verification-fallback','failed-validation-state-recovery'],
            'retains':['alpha8.5-theme-studio','theme-pack-mobile-sync']
          }
          Path('publish/BUILD_TRANSPARENCY.json').write_text(json.dumps(transparency,indent=2),encoding='utf-8')
          PY
      - name: Publish stable v0.3.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Desktop v0.3.3 hardens in-app updating: GitHub REST remains primary, with a GitHub Release SHA256SUMS fallback for discovery and verification when api.github.com is unavailable or rate-limited. Failed validation now exits the stale validating state. The update ZIP supports both v0.3.1 and v0.3.2 and retains the Alpha8.5 Theme Studio and paired-phone personalization workflow.'
          if gh release view v0.3.3 >/dev/null 2>&1; then
            gh release edit v0.3.3 --title 'Pica Library v0.3.3' --notes "$NOTES" --latest
          else
            gh release create v0.3.3 --target "$RELEASE_TARGET" --title 'Pica Library v0.3.3' --notes "$NOTES" --latest
          fi
          gh release upload v0.3.3 \
            publish/Pica-Library-v0.3.3-windows-x64.zip \
            publish/Pica-Library-v0.3.3-update.zip \
            publish/SHA256SUMS.txt \
            publish/BUILD_TRANSPARENCY.json --clobber
      - name: Verify live channel
        run: |
          set -euo pipefail
          sleep 3
          curl -L --fail --retry 3 'https://api.github.com/repos/Saber-Alter-Lily/pica-library/releases/latest' -o "$RUNNER_TEMP/latest.json"
          python - "$RUNNER_TEMP/latest.json" <<'PY'
          import json,sys,os
          x=json.load(open(sys.argv[1],encoding='utf-8'))
          assert x['tag_name']=='v0.3.3',x.get('tag_name')
          names={a['name']:a for a in x['assets']}
          for name in ['Pica-Library-v0.3.3-windows-x64.zip','Pica-Library-v0.3.3-update.zip','SHA256SUMS.txt','BUILD_TRANSPARENCY.json']:
              assert name in names,name
          assert names['Pica-Library-v0.3.3-windows-x64.zip'].get('digest')=='sha256:'+os.environ['EXPECTED_FULL_SHA']
          assert names['Pica-Library-v0.3.3-update.zip'].get('digest')=='sha256:'+os.environ['EXPECTED_UPDATE_SHA']
          print('Desktop v0.3.3 live and verified')
          PY
