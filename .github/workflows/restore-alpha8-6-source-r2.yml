name: Restore Alpha8.6 Current Source R2

on:
  push:
    paths:
      - '.github/workflows/restore-alpha8-6-source-r2.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      SOURCE_ARTIFACT_URL: 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-53f8-81fb-9e38-31a67fffee21/raw?se=2026-09-10T13%3A06%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=259ab23b-efdf-5200-a19a-81f4fd0b1575&skoid=80e81ea6-3c08-46f9-bd84-b87176742bcd&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-10T03%3A18%3A22Z&ske=2026-09-11T03%3A18%3A22Z&sks=b&skv=2026-02-06&sig=kRSqmyn26dKGjivOFglMy4sTe%2B9C4oZ9sCJjKy8hzls%3D'
      EXPECTED_SOURCE_SHA: 'f1766004b156c1621fdaf29474b7fca4cd846be48dd3b740b659d63488a56984'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download and verify source snapshot
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 1 "$SOURCE_ARTIFACT_URL" -o "$RUNNER_TEMP/source-artifact.zip"
          mkdir -p "$RUNNER_TEMP/wrapper" "$RUNNER_TEMP/source"
          unzip -q "$RUNNER_TEMP/source-artifact.zip" -d "$RUNNER_TEMP/wrapper"
          INNER="$RUNNER_TEMP/wrapper/Pica-Library-Alpha8.6-Open-Source.zip"
          test "$(sha256sum "$INNER" | cut -d' ' -f1)" = "$EXPECTED_SOURCE_SHA"
          unzip -q "$INNER" -d "$RUNNER_TEMP/source"
          grep -q '"version": "0.3.4"' "$RUNNER_TEMP/source/package.json"
          grep -q 'versionCode 31' "$RUNNER_TEMP/source/mobile/android-alpha2/app/build.gradle"
      - name: Restore source while preserving workflow directory
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          rsync -a "$RUNNER_TEMP/source/" ./ --exclude='.github/'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- ':!.github'
          git commit -m 'chore(open-source): restore current Alpha8.6 source'
          git push origin HEAD:main
