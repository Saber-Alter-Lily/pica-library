name: Validate and apply E-H desktop integration patch

on:
  push:
    branches:
      - feature/eh-provider-v1
    paths:
      - 'scripts/dev/apply-eh-desktop-v1.mjs'
      - '.github/workflows/eh-dev-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eh-provider-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply isolated desktop patch
        run: node scripts/dev/apply-eh-desktop-v1.mjs
      - name: Validate desktop and web
        run: |
          set -euo pipefail
          pnpm type:check
          pnpm web:check
          pnpm test
          pnpm build
      - name: Commit validated patch to development branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/providers/eh-provider.ts src/storage/sqlite/migrations.ts src/library/database.ts src/services/provider-service.ts src/library/service.ts src/services/online-reader-service.ts src/library/server.ts web/index.html web/app.js
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat: integrate E-H across desktop library flows'
          git push origin HEAD:feature/eh-provider-v1
