name: Verify README poster assets

on:
  push:
    paths:
      - 'README.md'
      - 'README.en.md'
      - 'docs/*guide*.md'
      - 'docs/assets/desktop-overview.webp'
      - 'docs/assets/android-overview.webp'
      - '.github/workflows/verify-readme-jpegs.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Decode README posters and verify Markdown targets
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          posters = [
              Path('docs/assets/desktop-overview.webp'),
              Path('docs/assets/android-overview.webp'),
          ]
          for p in posters:
              data = p.read_bytes()
              print(p, 'bytes=', len(data), 'prefix=', data[:12].hex())
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', p
              with Image.open(p) as im:
                  im.load()
                  print(p, 'format=', im.format, 'size=', im.size, 'mode=', im.mode)
                  assert im.format == 'WEBP', (p, im.format)
                  assert im.width >= 700 and im.height >= 700, (p, im.size)

          docs = [
              Path('README.md'), Path('README.en.md'),
              Path('docs/desktop-guide.zh-CN.md'), Path('docs/android-guide.zh-CN.md'),
              Path('docs/desktop-guide.en.md'), Path('docs/android-guide.en.md'),
          ]
          for p in docs:
              text = p.read_text(encoding='utf-8')
              assert 'overview.jpg' not in text, p
              if 'desktop' in p.name.lower() or p.name.startswith('README'):
                  assert 'desktop-overview.webp' in text, p
              if 'android' in p.name.lower() or p.name.startswith('README'):
                  assert 'android-overview.webp' in text, p
          print('README_POSTER_DECODE=PASS')
          PY
