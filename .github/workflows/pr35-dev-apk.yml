name: PR35 Dev APK (no publication)

on:
  push:
    branches: [feature/eh-provider-v1]
    paths:
      - 'mobile/android-alpha2/**'
      - 'test/unit/android-dev-package-contract.test.ts'
      - '.github/workflows/pr35-dev-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-dev-apk:
    if: github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and lint before loading signing material
        working-directory: mobile/android-alpha2
        run: gradle :app:testDebugUnitTest :app:lintDebug --no-daemon
      - name: Build fixed-signature side-by-side Dev APK
        working-directory: mobile/android-alpha2
        env:
          ANDROID_PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
          ANDROID_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_PREVIEW_KEYSTORE_B64"
          test -n "$ANDROID_PREVIEW_KEYSTORE_PASSWORD"
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/pica-dev-signing-XXXXXXXX")
          export ANDROID_PREVIEW_KEYSTORE_PATH="$signing_dir/preview.jks"
          trap 'rm -f -- "$ANDROID_PREVIEW_KEYSTORE_PATH"; rmdir -- "$signing_dir"' EXIT
          printf '%s' "$ANDROID_PREVIEW_KEYSTORE_B64" | base64 --decode > "$ANDROID_PREVIEW_KEYSTORE_PATH"
          unset ANDROID_PREVIEW_KEYSTORE_B64

          gradle :app:assembleDebug --no-daemon
          unset ANDROID_PREVIEW_KEYSTORE_PASSWORD

          apk=app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/pica-dev-cert.txt"
          fingerprint=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/pica-dev-cert.txt")
          test "$fingerprint" = '64fb87dc7d8bd6bc7b2cec92cc8c83fad3afe8cfb07591a2e53d53cbd3ab2f9d'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/pica-dev-package.txt"
          grep -q "package: name='com.picalibrary.android.dev'" "$RUNNER_TEMP/pica-dev-package.txt"
          grep -q "application-label:'Pica Library Dev'" "$RUNNER_TEMP/pica-dev-package.txt"

          mkdir -p candidate
          cp "$apk" candidate/Pica-Library-Dev-PR35.apk
          cp "$RUNNER_TEMP/pica-dev-package.txt" candidate/PACKAGE_INFO.txt
          printf '%s\n' "$fingerprint" > candidate/CERTIFICATE_SHA256.txt
          printf '%s\n' "$GITHUB_SHA" > candidate/SOURCE_SHA.txt
          printf '%s\n' 'UNRELEASED DEV BUILD: separate package id; manual QA only; formal OTA disabled.' > candidate/STATUS.txt
          (cd candidate && sha256sum Pica-Library-Dev-PR35.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Dev-PR35
          path: mobile/android-alpha2/candidate/
          retention-days: 3
          if-no-files-found: error
