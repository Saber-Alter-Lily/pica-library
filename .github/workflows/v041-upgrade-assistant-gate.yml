name: v0.4.1 Upgrade Assistant Gate

on:
  push:
    branches: [fix/v041-full-install-guidance]
    paths:
      - 'packaging/windows/upgrade-assistant-v041/**'
      - '.github/workflows/v041-upgrade-assistant-gate.yml'

permissions:
  contents: read

jobs:
  windows-powershell5:
    if: github.event.repository.private == false && github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Parse assistant with Windows PowerShell
        shell: powershell
        run: |
          $file = 'packaging\windows\upgrade-assistant-v041\Upgrade-Pica-Library-v0.4.1.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell parser reported $($errors.Count) error(s)"
          }
          $source = Get-Content -Raw -LiteralPath $file
          if ($source -match '\?\?|\?\.') {
            throw 'PowerShell 7-only syntax detected'
          }
          Write-Host 'POWERSHELL5_PARSE=PASS'
      - name: Verify one-click launcher
        shell: powershell
        run: |
          $cmd = Get-Content -Raw -LiteralPath 'packaging\windows\upgrade-assistant-v041\Upgrade-Pica-Library-v0.4.1.cmd'
          if ($cmd -notmatch 'Upgrade-Pica-Library-v0\.4\.1\.ps1') { throw 'CMD launcher target missing' }
          if ($cmd -notmatch 'ExecutionPolicy Bypass') { throw 'CMD launcher does not invoke the bundled assistant' }
          Write-Host 'CMD_LAUNCHER=PASS'
      - name: Package test assistant
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path 'packaging\windows\upgrade-assistant-v041\*' -DestinationPath 'artifacts\Pica-Library-v0.4.1-upgrade-assistant.zip' -CompressionLevel Optimal
          $hash=(Get-FileHash -Algorithm SHA256 'artifacts\Pica-Library-v0.4.1-upgrade-assistant.zip').Hash.ToLowerInvariant()
          "$hash  Pica-Library-v0.4.1-upgrade-assistant.zip" | Set-Content -Encoding ascii 'artifacts\Pica-Library-v0.4.1-upgrade-assistant.sha256'
          Write-Host "ASSISTANT_SHA256=$hash"
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-v0.4.1-upgrade-assistant-gated
          path: artifacts/
          retention-days: 1
          if-no-files-found: error
