name: Recommendation V4 multi-provider onboarding fix

on:
  push:
    branches: [feature/recommendation-v4-visual-feedback]
    paths:
      - 'scripts/apply-v4-multiprovider-onboarding-fix.py'
      - '.github/workflows/v4-multiprovider-onboarding-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Saber-Alter-Lily/pica-library'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply onboarding fix
        run: python scripts/apply-v4-multiprovider-onboarding-fix.py
      - name: Remove one-shot patch machinery
        run: rm scripts/apply-v4-multiprovider-onboarding-fix.py .github/workflows/v4-multiprovider-onboarding-fix.yml
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: expose E-H account access during first-run onboarding'
          git push origin HEAD:feature/recommendation-v4-visual-feedback
