name: limited-download

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Download source'
        required: true
        type: choice
        default: favorites_page
        options: [favorites_page, comic_ids]
      favorite_page:
        description: 'Favorites page (normally about 20 comics)'
        required: false
        default: '1'
        type: string
      comic_ids:
        description: 'Comma-separated comic IDs (maximum 20)'
        required: false
        type: string
      episodes:
        description: 'Episodes, for example all or 1,3,5-10'
        required: true
        default: 'all'
        type: string
      profile:
        description: 'Performance preset; fast is aggressive, not a benchmark claim'
        required: true
        default: balanced
        type: choice
        options: [conservative, balanced, fast]

permissions:
  contents: read

jobs:
  private-download:
    uses: ./.github/workflows/private-download.yml
    with:
      mode: ${{ inputs.mode }}
      favorite_page: ${{ inputs.favorite_page }}
      comic_ids: ${{ inputs.comic_ids }}
      episodes: ${{ inputs.episodes }}
      profile: ${{ inputs.profile }}
    secrets:
      PICA_ACCOUNT: ${{ secrets.PICA_ACCOUNT }}
      PICA_PASSWORD: ${{ secrets.PICA_PASSWORD }}
