name: Apply v0.3.9 release metadata

on:
  push:
    branches: [hotfix/v0.3.9-auth-ux-204]
    paths:
      - '.github/workflows/apply-v039-release-metadata.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v0.3.9-auth-ux-204
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply deterministic metadata transform
        run: node scripts/apply-v039-release-metadata.mjs
      - name: Verify release metadata
        run: |
          set -euo pipefail
          grep -q 'Pica-Library-v0.3.9-windows-x64' scripts/build-windows-package.ps1
          grep -q "Pica-Library-v0.3.8-windows-x64.zip" scripts/build-windows-package.ps1
          grep -q 'Windows / Desktop：v0.3.9' README.md
          grep -q 'Android Preview：v36' README.md
          grep -q 'Windows / Desktop:** v0.3.9' README.en.md
          git diff --check
      - name: Commit transformed files
        run: |
          set -euo pipefail
          git config user.name 'Saber-Alter-Lily'
          git config user.email '3178088154@qq.com'
          git add scripts/build-windows-package.ps1 README.md README.en.md
          git diff --cached --quiet && { echo 'No metadata changes'; exit 1; }
          git commit -m 'chore: stage v0.3.9 release metadata'
          git push origin HEAD:hotfix/v0.3.9-auth-ux-204
