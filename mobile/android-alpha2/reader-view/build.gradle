plugins {
    id 'com.android.library'
}

// Original image viewport + gesture settings, physically separate from
// Desktop/online sources. No new renderer, image library or source SDK.
android {
    namespace 'com.picalibrary.android.readerview'
    compileSdk 35
    defaultConfig { minSdk 28 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':local-core')
    // Existing app versions, now required by the physically moved original Reader screen.
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
}
