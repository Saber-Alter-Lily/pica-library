name: E-H public live smoke

on:
  push:
    branches:
      - feature/eh-provider-v1
    paths:
      - 'scripts/qa/eh-live-smoke.ts'
      - '.github/workflows/eh-live-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/eh-provider-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Verify live public E-H search, metadata, reader page and cover
        run: pnpm exec tsx scripts/qa/eh-live-smoke.ts
