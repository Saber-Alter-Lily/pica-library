name: Publish v0.3.6 and Android v33 Alpha8.7

on:
  push:
    paths:
      - '.github/workflows/publish-v0.3.6-alpha8.7.yml'

permissions:
  contents: write

env:
  RELEASE_TARGET: 'ceb6e46c137dd0180cedd92eacfeddb596baa2e2'
  EXPECTED_CERT: '64fb87dc7d8bd6bc7b2cec92cc8c83fad3afe8cfb07591a2e53d53cbd3ab2f9d'

jobs:
  windows:
    runs-on: windows-latest
    env:
      PICA_LIBRARY_BUILD_PROVENANCE: 'ceb6e46c137dd0180cedd92eacfeddb596baa2e2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ceb6e46c137dd0180cedd92eacfeddb596baa2e2'
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.16.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Re-run Alpha8.7 Web/Desktop gates
        shell: pwsh
        run: |
          pnpm web:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run test/unit/alpha8-7-settings-star-contract.test.ts test/unit/alpha8-6-star-personalization-contract.test.ts test/unit/personalization-theme-studio.test.ts test/unit/update-hotfix-contract.test.ts test/unit/update-manager-release-fallback.test.ts test/unit/update-manager.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download accepted v0.3.3-v0.3.5 bases
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $items=@(
            @('0.3.3','fa7e2e282e471bc2e9ee0a0c4c9d2616c97f9383d5b034e019833b8e5ec62e0f'),
            @('0.3.4','6c52f076ae251e11089ed14fcfd1d9be3897c7220c97dfe025eafa75f50a233b'),
            @('0.3.5','876ee53b16ff76ab590de7c7f4c8c0d3bf2052c03edd3480b1a1ee243148209d')
          )
          foreach($item in $items){
            $v=$item[0];$expected=$item[1];$file="artifacts/Pica-Library-v$v-windows-x64.zip"
            Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/Saber-Alter-Lily/pica-library/releases/download/v$v/Pica-Library-v$v-windows-x64.zip" -OutFile $file
            $actual=(Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            if($actual -ne $expected){ throw "base $v hash mismatch: $actual" }
          }
      - name: Build Desktop v0.3.6 full package
        shell: pwsh
        run: pnpm build:windows
      - name: Build universal v0.3.3-v0.3.5 update and prove convergence
        shell: pwsh
        run: |
          pnpm exec tsx scripts/build-local-update-package.ts artifacts/Pica-Library-v0.3.5-windows-x64.zip artifacts/Pica-Library-v0.3.6-windows-x64.zip artifacts/Pica-Library-v0.3.6-update.zip
          @'
          import hashlib,json,zipfile
          from pathlib import Path
          root=Path('artifacts')
          versions=('0.3.3','0.3.4','0.3.5')
          bases={v:root/f'Pica-Library-v{v}-windows-x64.zip' for v in versions}
          target=root/'Pica-Library-v0.3.6-windows-x64.zip'
          update=root/'Pica-Library-v0.3.6-update.zip'
          def entries(p):
              with zipfile.ZipFile(p) as z:
                  return {i.filename:z.read(i.filename) for i in z.infolist() if not i.is_dir()}
          b={v:entries(p) for v,p in bases.items()}; t=entries(target)
          changed=sorted(name for name,data in t.items() if any(name not in b[v] or b[v][name]!=data for v in versions))
          deleted=sorted({name for values in b.values() for name in values if name not in t})
          assert 'Pica Library.exe' not in changed, 'launcher replacement would require full install'
          assert 'app/updater.js' not in changed, 'updater self replacement would require full install'
          with zipfile.ZipFile(update) as z:m=json.loads(z.read('update-manifest.json'))
          m['sourceVersionRange']='=0.3.3 || =0.3.4 || =0.3.5';m.pop('sourceSha',None)
          m['targetVersion']='0.3.6';m['targetSourceSha']=t['SOURCE_SHA.txt'].decode().strip();m['requiresFullInstall']=False
          m['deletions']=deleted
          m['files']=[{'path':name,'sha256':hashlib.sha256(t[name]).hexdigest(),'size':len(t[name])} for name in changed]
          tmp=update.with_suffix('.tmp.zip')
          with zipfile.ZipFile(tmp,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              z.writestr('update-manifest.json',json.dumps(m,ensure_ascii=False,indent=2).encode())
              for name in changed:z.writestr(name,t[name])
          tmp.replace(update)
          assert m['targetSourceSha']=='ceb6e46c137dd0180cedd92eacfeddb596baa2e2'
          for v,values in b.items():
              got=dict(values)
              for name in deleted:got.pop(name,None)
              for name in changed:got[name]=t[name]
              assert got.keys()==t.keys(),(v,sorted(got.keys()-t.keys())[:10],sorted(t.keys()-got.keys())[:10])
              mism=[name for name in t if got[name]!=t[name]]
              assert not mism,(v,mism[:10])
              print(f'{v} -> 0.3.6 exact tree PASS')
          print('changed files',len(changed),'deletions',len(deleted))
          '@ | python -
          $full=(Get-FileHash -Algorithm SHA256 artifacts/Pica-Library-v0.3.6-windows-x64.zip).Hash.ToLowerInvariant()
          $update=(Get-FileHash -Algorithm SHA256 artifacts/Pica-Library-v0.3.6-update.zip).Hash.ToLowerInvariant()
          "$full  Pica-Library-v0.3.6-windows-x64.zip`n$update  Pica-Library-v0.3.6-update.zip" | Set-Content -Encoding ascii artifacts/SHA256SUMS-v0.3.6.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Windows-v0.3.6-Alpha8.7
          path: |
            artifacts/Pica-Library-v0.3.6-windows-x64.zip
            artifacts/Pica-Library-v0.3.6-update.zip
            artifacts/SHA256SUMS-v0.3.6.txt
          retention-days: 3

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'ceb6e46c137dd0180cedd92eacfeddb596baa2e2'
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test lint and build Android v33
        working-directory: mobile/android-alpha2
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --stacktrace
      - name: Sign and verify Android v33
        env:
          PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
          PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          INPUT='mobile/android-alpha2/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$INPUT"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$INPUT" | grep -q "package: name='com.picalibrary.android' versionCode='33' versionName='0.1.0-alpha8.7-settings-star-fix'"
          mkdir -p release-artifacts
          KEYSTORE="$RUNNER_TEMP/pica-preview.jks"
          printf '%s' "$PREVIEW_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias pica-preview \
            --ks-pass "pass:$PREVIEW_KEYSTORE_PASSWORD" --key-pass "pass:$PREVIEW_KEYSTORE_PASSWORD" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false \
            --out release-artifacts/Pica-Library-Android-Preview.apk "$INPUT"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release-artifacts/Pica-Library-Android-Preview.apk
          CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs release-artifacts/Pica-Library-Android-Preview.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr 'A-F' 'a-f')
          test "$CERT" = "$EXPECTED_CERT"
          printf '%s\n' "$CERT" > release-artifacts/Pica-Library-Android-Preview.cert-sha256
          sha256sum release-artifacts/Pica-Library-Android-Preview.apk > release-artifacts/ANDROID-SHA256.txt
          rm -f "$KEYSTORE"
      - uses: actions/upload-artifact@v4
        with:
          name: Pica-Library-Android-v33-Alpha8.7
          path: release-artifacts/
          retention-days: 3

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Pica-Library-Windows-v0.3.6-Alpha8.7
          path: publish
      - uses: actions/download-artifact@v4
        with:
          name: Pica-Library-Android-v33-Alpha8.7
          path: publish
      - name: Live Star acceptance for Saber-Alter-Lily
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H "Authorization: Bearer $GH_TOKEN" \
            'https://api.github.com/repos/Saber-Alter-Lily/pica-library/stargazers?per_page=100&page=1' \
            -o "$RUNNER_TEMP/stargazers.json"
          python - "$RUNNER_TEMP/stargazers.json" <<'PY'
          import json,sys
          users=json.load(open(sys.argv[1],encoding='utf-8'))
          assert any(str(x.get('login','')).lower()=='saber-alter-lily' for x in users), users
          print('LIVE_STAR_ACCEPTANCE=Saber-Alter-Lily PASS')
          PY
      - name: Validate artifacts and write update metadata
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          p=Path('publish');apk=p/'Pica-Library-Android-Preview.apk';full=p/'Pica-Library-v0.3.6-windows-x64.zip';update=p/'Pica-Library-v0.3.6-update.zip'
          sha=lambda q:hashlib.sha256(q.read_bytes()).hexdigest()
          assert apk.is_file() and full.is_file() and update.is_file()
          with zipfile.ZipFile(update) as z:m=json.loads(z.read('update-manifest.json'))
          assert m['sourceVersionRange']=='=0.3.3 || =0.3.4 || =0.3.5',m
          assert 'sourceSha' not in m and m['targetVersion']=='0.3.6' and not m['requiresFullInstall'],m
          assert m['targetSourceSha']==os.environ['RELEASE_TARGET'],m
          cert=(p/'Pica-Library-Android-Preview.cert-sha256').read_text().strip().lower();assert cert==os.environ['EXPECTED_CERT']
          ah,fh,uh=sha(apk),sha(full),sha(update)
          sums=(p/'SHA256SUMS-v0.3.6.txt').read_text();assert f'{fh}  Pica-Library-v0.3.6-windows-x64.zip' in sums;assert f'{uh}  Pica-Library-v0.3.6-update.zip' in sums
          android={
            'versionCode':33,
            'versionName':'0.1.0-alpha8.7-settings-star-fix',
            'apkUrl':'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/Pica-Library-Android-Preview.apk',
            'sha256':ah,
            'releaseNotes':'Alpha8.7 / v33: fixes GitHub Star verification by checking the public repository stargazer list with pagination and case-insensitive username matching. Existing Pica Violet and custom theme data is preserved.',
            'minimumSupportedVersionCode':23
          }
          (p/'android-update.json').write_text(json.dumps(android,ensure_ascii=False,indent=2),encoding='utf-8')
          transparency={
            'releaseId':'alpha8.7-v33-desktop-v0.3.6',
            'publicSourceCommit':os.environ['RELEASE_TARGET'],
            'android':{'versionCode':33,'versionName':android['versionName'],'sha256':ah,'signingCertificateSha256':cert,'R8':True},
            'windows':{'version':'0.3.6','fullZipSha256':fh,'updateZipSha256':uh,'sourceVersionRange':m['sourceVersionRange'],'buildProvenance':m['targetSourceSha']},
            'acceptance':{'liveStarAccount':'Saber-Alter-Lily','liveStarResult':'PASS'},
            'fixes':['public stargazer Star verification','unified Desktop settings hub','responsive personalization layout','completed and cancelled download history collapsed by default']
          }
          (p/'BUILD_TRANSPARENCY.json').write_text(json.dumps(transparency,ensure_ascii=False,indent=2),encoding='utf-8')
          (p/'SHA256SUMS.txt').write_text(f'{fh}  Pica-Library-v0.3.6-windows-x64.zip\n{uh}  Pica-Library-v0.3.6-update.zip\n',encoding='ascii')
          print('ANDROID_SHA='+ah);print('WINDOWS_FULL_SHA='+fh);print('WINDOWS_UPDATE_SHA='+uh)
          PY
      - name: Publish Android Preview v33
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit android-preview --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --prerelease --title 'Pica Library Android Preview' --notes 'Alpha8.7 / v33: fixes GitHub Star verification using the public repository stargazer list with pagination and case-insensitive matching. Existing Pica Violet · 星漫 and custom theme data is preserved.'
          gh release upload android-preview --repo "$GITHUB_REPOSITORY" publish/Pica-Library-Android-Preview.apk publish/android-update.json publish/Pica-Library-Android-Preview.cert-sha256 publish/BUILD_TRANSPARENCY.json --clobber
      - name: Publish Desktop v0.3.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES='Desktop v0.3.6 / Alpha8.7: fixes GitHub Star verification by reading the public repository stargazer list; merges the former Maintenance and Settings top-level areas into one six-section Settings hub; rebuilds the personalization layout; and collapses completed/cancelled download history by default while retaining failed jobs and historical records. The incremental package is verified for direct upgrades from v0.3.3, v0.3.4 and v0.3.5.'
          if gh release view v0.3.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit v0.3.6 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --title 'Pica Library v0.3.6' --notes "$NOTES" --latest
          else
            gh release create v0.3.6 --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" --title 'Pica Library v0.3.6' --notes "$NOTES" --latest
          fi
          gh release upload v0.3.6 --repo "$GITHUB_REPOSITORY" publish/Pica-Library-v0.3.6-windows-x64.zip publish/Pica-Library-v0.3.6-update.zip publish/SHA256SUMS.txt publish/BUILD_TRANSPARENCY.json --clobber
      - name: Verify live update channels
        run: |
          set -euo pipefail
          sleep 4
          curl -L --fail --retry 3 'https://github.com/Saber-Alter-Lily/pica-library/releases/download/android-preview/android-update.json' -o "$RUNNER_TEMP/a.json"
          curl -L --fail --retry 3 'https://api.github.com/repos/Saber-Alter-Lily/pica-library/releases/tags/android-preview' -o "$RUNNER_TEMP/ar.json"
          curl -L --fail --retry 3 'https://api.github.com/repos/Saber-Alter-Lily/pica-library/releases/latest' -o "$RUNNER_TEMP/w.json"
          python - "$RUNNER_TEMP/a.json" "$RUNNER_TEMP/ar.json" "$RUNNER_TEMP/w.json" <<'PY'
          import json,sys,urllib.request
          a=json.load(open(sys.argv[1],encoding='utf-8'));ar=json.load(open(sys.argv[2],encoding='utf-8'));w=json.load(open(sys.argv[3],encoding='utf-8'))
          assert a['versionCode']==33 and a['versionName']=='0.1.0-alpha8.7-settings-star-fix'
          aa={x['name']:x for x in ar['assets']};assert aa['Pica-Library-Android-Preview.apk'].get('digest')=='sha256:'+a['sha256']
          assert w['tag_name']=='v0.3.6' and not w['draft'] and not w['prerelease']
          wa={x['name']:x for x in w['assets']}
          sums=urllib.request.urlopen(wa['SHA256SUMS.txt']['browser_download_url'],timeout=15).read().decode()
          for name in ['Pica-Library-v0.3.6-windows-x64.zip','Pica-Library-v0.3.6-update.zip']:
              expected=[line.split()[0] for line in sums.splitlines() if line.strip().endswith(name)][0]
              assert wa[name].get('digest')=='sha256:'+expected,(name,wa[name].get('digest'),expected)
          print('Alpha8.7 Android v33 and Desktop v0.3.6 are live and verified')
          PY
